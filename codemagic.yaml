# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
workflows:
  quant-core-parity-draft:
    name: PR68 CORE Kotlin Python parity - fail closed
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Python tests and restart persistence tests
        script: |
          set -euo pipefail
          export PYTHONPATH="$CM_BUILD_DIR"
          python3 -m unittest discover -s quant_engine/tests -v
      - name: Verify canonical inputs and export Kotlin trace
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p artifacts/parity
          export PYTHONPATH="$CM_BUILD_DIR"
          # Fetch genuine confirmed BTC-USDT-SWAP candles on the build machine.
          # Preserve input CSV + provenance manifest as build artifacts.
          if ! python3 -m quant_engine.okx_ohlcv --output parity-input --m15-count 600 --h1-count 180; then
            echo "ERROR OHLCV_DOWNLOAD_FAILED: cannot verify real market candles"
            printf '{"parity_verified":false,"reason":"OHLCV_DOWNLOAD_FAILED"}\n' > artifacts/parity/parity-report.json
            exit 1
          fi
          python3 -c 'from quant_engine.canonical_csv import read_csv,digest; m=read_csv("parity-input/m15.csv",900000); h=read_csv("parity-input/h1.csv",3600000); print("Verified canonical OHLCV:",len(m),len(h),digest(m,h))'
          git fetch origin feature/freqtrade-strategy-parity-20261029
          git worktree add /tmp/quant-kotlin-parity FETCH_HEAD
          # setup-android writes local.properties into CM_BUILD_DIR/android-app.
          # Use the same SDK in the independent Kotlin worktree.
          bash /tmp/quant-kotlin-parity/ci/setup-android.sh
          source "$CM_ENV"
          test -x "$CHART_GRADLE_BIN"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > /tmp/quant-kotlin-parity/android-app/local.properties
          export PARITY_M15_CSV="$CM_BUILD_DIR/parity-input/m15.csv"
          export PARITY_H1_CSV="$CM_BUILD_DIR/parity-input/h1.csv"
          export PARITY_KOTLIN_TRACE_OUTPUT="$CM_BUILD_DIR/artifacts/parity/kotlin-trace.json"
          cd /tmp/quant-kotlin-parity/android-app
          "$CHART_GRADLE_BIN" :app:testDebugUnitTest --tests "*StrategyCsvArtifactTest" --no-daemon
          test -s "$PARITY_KOTLIN_TRACE_OUTPUT"
      - name: Python replay on the same closed candles
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          export PYTHONPATH="$CM_BUILD_DIR"
          python3 -m quant_engine.replay_cli --m15 parity-input/m15.csv --h1 parity-input/h1.csv --output artifacts/parity/python-trace.json
      - name: Compare both independent engine traces
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          export PYTHONPATH="$CM_BUILD_DIR"
          python3 -m quant_engine.trace_gate artifacts/parity
      - name: Controlled DCA Soft SL Emergency scenarios on real Kotlin and Python engines
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          export PYTHONPATH="$CM_BUILD_DIR"
          python3 -m quant_engine.scenario_runner --output artifacts/core-scenarios
          cp ci/kotlin/QuantControlledScenarioTest.kt /tmp/quant-kotlin-parity/android-app/app/src/test/java/com/kenznguyen/btclivealerts/
          source "$CM_ENV"
          for scenario in DCA "SOFT SL" "EMERGENCY SL"; do
            export QUANT_SCENARIO_DIR="$CM_BUILD_DIR/artifacts/core-scenarios/$scenario"
            export QUANT_KOTLIN_TRACE_OUTPUT="$QUANT_SCENARIO_DIR/kotlin-trace.json"
            ( cd /tmp/quant-kotlin-parity/android-app && "$CHART_GRADLE_BIN" :app:testDebugUnitTest --tests "*QuantControlledScenarioTest" --no-daemon --rerun-tasks )
            test -s "$QUANT_KOTLIN_TRACE_OUTPUT"
          done
          python3 -m quant_engine.scenario_gate artifacts/core-scenarios
      - name: Real PaperLedger DCA submit restart and fill reconciliation
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          export PYTHONPATH="$CM_BUILD_DIR"
          export QUANT_PAPER_SOURCE=/tmp/quant-kotlin-parity
          export QUANT_REQUIRE_PAPER_E2E=1
          python3 -m unittest quant_engine.tests.test_paper_dca_end_to_end -v
    artifacts:
      - artifacts/parity/**
      - artifacts/core-scenarios/**
      - parity-input/**
      - android-app/app/build/test-results/testDebugUnitTest/*.xml
