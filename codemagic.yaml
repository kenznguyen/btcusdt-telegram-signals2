# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
# Five-layer parity gate: a codemagic.yaml change intentionally fans out to Python/API, React and Android workflows.
# Keep this trigger comment in the release-candidate commit so all three run against the same source SHA.
# Android Paper native parity and API contract tests are included in the candidate build.
# The quality API envelope contract is also covered in the Python/API candidate run.
workflows:
  android-chart-pro-debug:
    name: BTC Chart Pro - tests, regular and parallel APKs
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.cache/btc-chart-pro
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/android-five-layer-control
          include: true
          source: true
        - pattern: feature/five-layer-paper
          include: true
          source: true
        - pattern: feature/canonical-market-data
          include: true
          source: true
        - pattern: feature/hummingbot-order-book
          include: true
          source: true
        - pattern: fix/chart-pro-reliability-20261027
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - android-app/
          - integrations/
          - paper_execution/
          - pipeline/
          - control_dashboard/
          - ci/
          - codemagic.yaml
    scripts:
      - name: Test Hummingbot read-only bridge
        script: |
          set -euo pipefail
          python3 -m unittest integrations.test_hummingbot_bridge -v
          python3 -m unittest ci.test_android_apks -v
      - name: Prepare Android build tools and record source
        script: bash ci/setup-android.sh
      - name: Run Android unit tests
        working_directory: android-app
        script: |
          set -euo pipefail
          "$CHART_GRADLE_BIN" :app:testDebugUnitTest :app:testParallelUnitTest --no-daemon --stacktrace
        test_report: android-app/app/build/test-results/test*UnitTest/*.xml
      - name: Build regular and parallel APKs
        working_directory: android-app
        script: |
          set -euo pipefail
          "$CHART_GRADLE_BIN" :app:assembleDebug :app:assembleParallel --no-daemon --stacktrace
      - name: Verify application identities and publish parallel APK
        script: python3 ci/verify-android-apks.py
    artifacts:
      - android-app/app/build/outputs/apk/debug/*.apk
      - artifacts/BTC-5-Tang-Paper-*.apk
      - android-app/app/build/test-results/testDebugUnitTest/*.xml
      - android-app/app/build/reports/tests/testDebugUnitTest/**
      - android-app/app/build/test-results/testParallelUnitTest/*.xml
      - android-app/app/build/reports/tests/testParallelUnitTest/**
      - android-source-sha.txt
      - android-apks.json

  android-chart-pro-release:
    name: BTC Chart Pro - verified signed release APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      groups:
        - android_release
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.cache/btc-chart-pro
    # No triggering section: start this workflow manually on the intended source branch.
    scripts:
      - name: Prepare Android build tools and record source
        script: bash ci/setup-android.sh
      - name: Test, build and verify the existing release signing identity
        script: bash ci/release-android.sh
        test_report: android-app/app/build/test-results/testDebugUnitTest/*.xml
    artifacts:
      - android-app/app/build/outputs/apk/release/*.apk
      - android-app/app/build/test-results/testDebugUnitTest/*.xml
      - android-app/app/build/reports/tests/testDebugUnitTest/**
      - android-source-sha.txt
      - android-release-apk-signature.txt

  canonical-market-data:
    name: Canonical market data - Python checks
    instance_type: mac_mini_m2
    max_build_duration: 15
    cache:
      cache_paths:
        - $HOME/.cache/pip
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/five-layer-paper
          include: true
          source: true
        - pattern: feature/canonical-market-data
          include: true
          source: true
        - pattern: feature/hummingbot-order-book
          include: true
          source: true
        - pattern: feature/android-five-layer-control
          include: true
          source: true
        - pattern: feature/t1-intelligence-provenance-quality-20261101
          include: true
          source: true
        - pattern: feature/timescaledb-market-data-repository
          include: true
          source: true
        - pattern: feature/timescaledb-storage-factory-api
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - market_data/
          - futures_intelligence/
          - pipeline/
          - paper_execution/
          - freqai_bridge/
          - integrations/
          - ci/
          - app.py
          - backtest.py
          - telegram_commands.py
          - requirements-market-data.txt
          - requirements.txt
          - requirements-freqai.txt
          - requirements-web.txt
          - requirements-ci.txt
          - codemagic.yaml
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements-market-data.txt requirements.txt requirements-web.txt requirements-ci.txt
      - name: Verify installed adapters and application
        script: |
          set -euo pipefail
          "$CI_PYTHON" -c 'import ccxt; import app; assert ccxt.binanceusdm().id == "binanceusdm"'
      - name: Run data tests and gateway regressions
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest market_data.test_store market_data.test_storage market_data.test_sync market_data.test_api -v 2>&1 | tee market-data-tests.log
          "$CI_PYTHON" -m unittest discover -s integrations -p 'test_*.py' -v 2>&1 | tee gateway-tests.log
          "$CI_PYTHON" -m unittest discover -s ci -p 'test_*.py' -v 2>&1 | tee ci-policy-tests.log
      - name: Run five-layer paper integration tests
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest futures_intelligence.test_import_collector pipeline.test_decision pipeline.test_api pipeline.test_core_signal pipeline.test_core_strategy paper_execution.test_ledger paper_execution.test_risk_control paper_execution.test_equity freqai_bridge.test_exporter -v 2>&1 | tee paper-system-tests.log
      - name: Verify CLI and syntax
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m market_data.sync --help
          "$CI_PYTHON" -m compileall -q market_data integrations ci futures_intelligence pipeline paper_execution freqai_bridge app.py backtest.py telegram_commands.py
    artifacts:
      - ci-source-sha.txt
      - market-data-tests.log
      - gateway-tests.log
      - ci-policy-tests.log
      - paper-system-tests.log

  market-data-timescaledb:
    name: Market data - TimescaleDB migration and SQLite parity
    instance_type: mac_mini_m2
    max_build_duration: 15
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/timescaledb-storage-factory-api
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      groups:
        - market_data_timescale_test
    scripts:
      - name: Prepare Python dependencies
        script: bash ci/setup-python.sh requirements-market-data.txt requirements-ci.txt
      - name: Run TimescaleDB integration and SQLite parity tests
        script: bash ci/test-timescaledb.sh
    artifacts:
      - ci-source-sha.txt
      - timescaledb-tests.log

  telegram-command:
    name: Telegram command
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups: [codemagic_legacy]
      vars:
        TELEGRAM_COMMAND: help
        BACKTEST_DAYS: "360"
        BACKTEST_INITIAL_CAPITAL: "100"
        ENTRY_MARGIN_PCT: "50"
        DCA_MARGIN_RATIO: "100"
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Execute authorized Telegram command
        script: '"$CI_PYTHON" ci/run-legacy.py telegram'
    artifacts:
      - ci-source-sha.txt
      - backtest_last_result.json
      - backtest_status.json
      - backtest_trades.csv
      - backtest_equity.csv
      - backtest_equity_m15.csv

  dashboard-backtest:
    name: Dashboard backtest
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        BACKTEST_DAYS: "360"
        BACKTEST_INITIAL_CAPITAL: "100"
        ENTRY_MARGIN_PCT: "50"
        DCA_MARGIN_RATIO: "100"
        BACKTEST_STATUS_FILE: dashboard_backtest_status.json
        BACKTEST_RESULT_FILE: dashboard_backtest_last_result.json
        BACKTEST_TRADES_FILE: dashboard_backtest_trades.csv
        BACKTEST_EQUITY_FILE: dashboard_backtest_equity.csv
        BACKTEST_CURVE_FILE: dashboard_backtest_equity_m15.csv
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Run backtest
        script: '"$CI_PYTHON" ci/run-legacy.py dashboard'
    artifacts:
      - ci-source-sha.txt
      - dashboard_backtest_last_result.json
      - dashboard_backtest_status.json
      - dashboard_backtest_trades.csv
      - dashboard_backtest_equity.csv
      - dashboard_backtest_equity_m15.csv

  signal-scan:
    name: Manual paper signal scan
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      groups: [codemagic_legacy]
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Scan using explicitly supplied paper state
        script: '"$CI_PYTHON" ci/run-legacy.py scanner'
    artifacts:
      - ci-source-sha.txt
      - state.json
      - state-provenance.json


  five-layer-dashboard:
    name: Five-layer React control - test and build
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      node: 24
      npm: 11.9.0
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/five-layer-paper
          include: true
          source: true
        - pattern: feature/android-five-layer-control
          include: true
          source: true
        - pattern: feature/t1-intelligence-provenance-quality-20261101
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - control_dashboard/
          - pipeline/
          - codemagic.yaml
    scripts:
      - name: Record dashboard source
        script: git rev-parse HEAD > ci-source-sha.txt
      - name: Frozen install with dependency scripts disabled
        working_directory: control_dashboard
        script: npm ci --ignore-scripts
      - name: Test React dashboard and API boundaries
        working_directory: control_dashboard
        script: npm test
      - name: Build control dashboard
        working_directory: control_dashboard
        script: npm run build
      - name: Audit dependencies
        working_directory: control_dashboard
        script: npm audit --audit-level=high
    artifacts:
      - control_dashboard/dist/**
      - ci-source-sha.txt

  freqai-strategy-smoke:
    name: FreqAI 2026.9 - native strategy load (manual)
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Prepare CPU runtime
        script: |
          set -euo pipefail
          if ! brew list --versions libomp > /dev/null 2>&1; then
            brew install libomp
          fi
          bash ci/setup-python.sh requirements-freqai.txt requirements-market-data.txt
      - name: Load prediction-only strategy without starting trading
        script: |
          set -euo pipefail
          export PYTHONPATH="$CM_BUILD_DIR"
          "$CI_PYTHON" ci/freqai-smoke.py 2>&1 | tee freqai-smoke-tests.log
    artifacts:
      - ci-source-sha.txt
      - freqai-smoke-tests.log


  market-data-kraken-adapter-tests:
    name: Market data - isolated Kraken spot adapter tests (manual)
    instance_type: mac_mini_m2
    max_build_duration: 10
    # Manual only. Unit tests use a fake exchange and never call external APIs.
    scripts:
      - name: Prepare Python and record source SHA
        script: |
          set -euo pipefail
          bash ci/setup-python.sh requirements-market-data.txt requirements-ci.txt
          git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run Kraken spot adapter contract tests
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest market_data.test_kraken_spot -v 2>&1 | tee kraken-adapter-tests.log
      - name: Compile Kraken adapter and report result
        script: |
          set -euo pipefail
          if "$CI_PYTHON" -m compileall -q market_data/kraken_spot.py; then
            echo "KRAKEN_ADAPTER_COMPILEALL=PASS" | tee kraken-adapter-compileall.log
          else
            status=$?
            echo "KRAKEN_ADAPTER_COMPILEALL=FAIL (exit ${status})" | tee kraken-adapter-compileall.log
            exit "$status"
          fi
    artifacts:
      - ci-source-sha.txt
      - kraken-adapter-tests.log
      - kraken-adapter-compileall.log

  market-data-kraken-spot-sqlite-tests:
    name: Market data - isolated Kraken Spot SQLite persistence (manual)
    instance_type: mac_mini_m2
    max_build_duration: 10
    # Manual only. Tests use temporary SQLite files; no live exchange or Binance database.
    scripts:
      - name: Prepare Python and record source SHA
        script: |
          set -euo pipefail
          bash ci/setup-python.sh requirements-market-data.txt requirements-ci.txt
          git rev-parse HEAD | tee ci-source-sha.txt
      - name: Test Kraken Spot adapter and isolated SQLite store
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest market_data.test_kraken_spot market_data.test_kraken_spot_store -v 2>&1 | tee kraken-spot-sqlite-tests.log
      - name: Compile Kraken Spot persistence modules
        script: |
          set -euo pipefail
          if "$CI_PYTHON" -m compileall -q market_data/kraken_spot.py market_data/kraken_spot_store.py; then
            echo "KRAKEN_SPOT_SQLITE_COMPILEALL=PASS" | tee kraken-spot-sqlite-compileall.log
          else
            status=$?
            echo "KRAKEN_SPOT_SQLITE_COMPILEALL=FAIL (exit ${status})" | tee kraken-spot-sqlite-compileall.log
            exit "$status"
          fi
    artifacts:
      - ci-source-sha.txt
      - kraken-spot-sqlite-tests.log
      - kraken-spot-sqlite-compileall.log

  market-data-kraken-spot-read-api:
    name: Market data - isolated Kraken Spot read-only API (manual)
    instance_type: mac_mini_m2
    max_build_duration: 10
    # Manual only. Uses temporary SQLite files; no network, production DB, or Futures consumers.
    scripts:
      - name: Prepare Python and record source SHA
        script: |
          set -euo pipefail
          bash ci/setup-python.sh requirements-market-data.txt requirements-ci.txt
          git rev-parse HEAD | tee ci-source-sha.txt
      - name: Test isolated Kraken Spot adapter, store and read API
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest market_data.test_kraken_spot market_data.test_kraken_spot_store market_data.test_kraken_spot_api -v 2>&1 | tee kraken-spot-read-api-tests.log
      - name: Compile Kraken Spot read API and persistence modules
        script: |
          set -euo pipefail
          if "$CI_PYTHON" -m compileall -q market_data/kraken_spot.py market_data/kraken_spot_store.py market_data/kraken_spot_api.py; then
            echo "KRAKEN_SPOT_READ_API_COMPILEALL=PASS" | tee kraken-spot-read-api-compileall.log
          else
            status=$?
            echo "KRAKEN_SPOT_READ_API_COMPILEALL=FAIL (exit ${status})" | tee kraken-spot-read-api-compileall.log
            exit "$status"
          fi
    artifacts:
      - ci-source-sha.txt
      - kraken-spot-read-api-tests.log
      - kraken-spot-read-api-compileall.log

  # P1 scheduler slice: normal GREEN gate, intentionally limited to scheduler tests.
  t0-feeder-scheduler:
    name: T0 feeder - scheduler and retry contracts
    instance_type: mac_mini_m2
    max_build_duration: 10
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/t0-centralized-data-feeder-p1-20261101
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - market_data/feeder.py
          - market_data/test_feeder_scheduler.py
          - market_data/test_feeder_retry.py
          - market_data/test_feeder_recovery.py
          - market_data/test_feeder_lease.py
          - codemagic.yaml
    scripts:
      - name: Verify Python and record exact source SHA
        script: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Python 3.10+ required"'
          git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run singleton lease and fencing contract tests
        script: |
          set -euo pipefail
          python3 -m unittest market_data.test_feeder_lease -v 2>&1 | tee t0-feeder-lease-tests.log
          echo "T0_FEEDER_LEASE_TESTS=PASS" | tee t0-feeder-lease-verdict.txt
      - name: Compile feeder lease module
        script: |
          set -euo pipefail
          python3 -m py_compile market_data/feeder.py
          echo "T0_FEEDER_LEASE_COMPILE=PASS" | tee t0-feeder-lease-compile.log
    artifacts:
      - ci-source-sha.txt
      - t0-feeder-lease-tests.log
      - t0-feeder-lease-verdict.txt
      - t0-feeder-lease-compile.log
  
  # P1.7 GREEN gate: evaluator + HTTP health contracts.
  t0-feeder-health:
    name: T0 feeder - health, freshness and readiness (GREEN)
    instance_type: mac_mini_m2
    max_build_duration: 10
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/t0-centralized-data-feeder-p1-20261101
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - market_data/feeder.py
          - market_data/test_feeder_health.py
          - market_data/test_feeder_health_api.py
          - app.py
          - codemagic.yaml
    scripts:
      - name: Prepare Python dependencies and record exact source SHA
        script: bash ci/setup-python.sh requirements.txt
      - name: Run T0 health evaluator and HTTP contract tests
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-feeder-health-tests.log
          echo "T0_FEEDER_HEALTH_TESTS=PASS" | tee t0-feeder-health-verdict.txt
      - name: Compile health implementation and contract tests
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m py_compile market_data/feeder.py app.py market_data/test_feeder_health.py market_data/test_feeder_health_api.py
          echo "T0_FEEDER_HEALTH_COMPILE=PASS" | tee t0-feeder-health-compile.log
    artifacts:
      - ci-source-sha.txt
      - t0-feeder-health-tests.log
      - t0-feeder-health-verdict.txt
      - t0-feeder-health-compile.log

  # P1.8 RED evidence: historical pre-implementation gate; manual reruns are not valid after FeederRuntime exists.
  t0-feeder-lifecycle-red:
    name: T0 feeder - lifecycle RED evidence (historical; do not rerun)
    instance_type: mac_mini_m2
    max_build_duration: 10
    when:
      changeset:
        includes:
          - market_data/feeder.py
          - market_data/feeder_service.py
          - market_data/test_feeder_lifecycle.py
          - codemagic.yaml
    scripts:
      - name: Prepare Python and record exact source SHA
        script: bash ci/setup-python.sh requirements.txt
      - name: Confirm lifecycle contracts fail before implementation
        script: |
          set -euo pipefail
          set +e
          "$CI_PYTHON" -m unittest market_data.test_feeder_lifecycle -v 2>&1 | tee t0-feeder-lifecycle-red-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -eq 0 ]; then
            echo "Unexpected PASS: lifecycle RED gate must fail before implementation" >&2
            exit 1
          fi
          if grep -q "cannot import name 'FeederRuntime'" t0-feeder-lifecycle-red-tests.log; then
            echo "T0_FEEDER_LIFECYCLE_RED=CONFIRMED (FeederRuntime missing as expected)" | tee t0-feeder-lifecycle-red-verdict.txt
          else
            cat t0-feeder-lifecycle-red-tests.log
            echo "T0_FEEDER_LIFECYCLE_RED=INVALID (failure was not the expected missing lifecycle implementation)" | tee t0-feeder-lifecycle-red-verdict.txt
            exit 1
          fi
      - name: Compile lifecycle contract tests
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m py_compile market_data/test_feeder_lifecycle.py
          echo "T0_FEEDER_LIFECYCLE_TEST_COMPILE=PASS" | tee t0-feeder-lifecycle-red-compile.log
    artifacts:
      - ci-source-sha.txt
      - t0-feeder-lifecycle-red-tests.log
      - t0-feeder-lifecycle-red-verdict.txt
      - t0-feeder-lifecycle-red-compile.log

  # P1.8 GREEN gate: lifecycle implementation plus regression coverage for prior T0 contracts.
  t0-feeder-lifecycle:
    name: T0 feeder - lifecycle and graceful shutdown (GREEN)
    instance_type: mac_mini_m2
    max_build_duration: 10
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/t0-centralized-data-feeder-p1-20261101
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - market_data/feeder.py
          - market_data/test_feeder_lifecycle.py
          - market_data/test_feeder_scheduler.py
          - market_data/test_feeder_retry.py
          - market_data/test_feeder_recovery.py
          - market_data/test_feeder_lease.py
          - market_data/test_feeder_health.py
          - market_data/test_feeder_health_api.py
          - app.py
          - codemagic.yaml
    scripts:
      - name: Prepare Python and record exact source SHA
        script: bash ci/setup-python.sh requirements.txt
      - name: Run lifecycle and all existing T0 contract regressions
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest market_data.test_feeder_lifecycle market_data.test_feeder_scheduler market_data.test_feeder_retry market_data.test_feeder_recovery market_data.test_feeder_lease market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-feeder-lifecycle-tests.log
          echo "T0_FEEDER_LIFECYCLE_TESTS=PASS" | tee t0-feeder-lifecycle-verdict.txt
      - name: Compile lifecycle, feeder and health API modules
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m py_compile market_data/feeder.py market_data/feeder_service.py market_data/test_feeder_lifecycle.py app.py
          echo "T0_FEEDER_LIFECYCLE_COMPILE=PASS" | tee t0-feeder-lifecycle-compile.log
    artifacts:
      - ci-source-sha.txt
      - t0-feeder-lifecycle-tests.log
      - t0-feeder-lifecycle-verdict.txt
      - t0-feeder-lifecycle-compile.log


  # T0 atomic write fencing: RED evidence before implementation.
  t0-feeder-atomic-fencing-red:
    name: T0 feeder - atomic write fencing RED evidence
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Prepare Python and record exact source SHA
        script: |
          set -euo pipefail
          bash ci/setup-python.sh requirements.txt
          git rev-parse HEAD | tee ci-source-sha.txt
      - name: Confirm atomic fencing contracts fail before implementation
        script: |
          set -euo pipefail
          set +e
          "$CI_PYTHON" -m unittest market_data.test_feeder_atomic_fencing -v 2>&1 | tee t0-feeder-atomic-fencing-red-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -eq 0 ]; then
            echo "Unexpected PASS: atomic fencing RED gate must fail before implementation" >&2
            exit 1
          fi
          if grep -Eq "AttributeError: 'CandleStore' object has no attribute 'insert_fenced'|unexpected keyword argument 'write_fence'" t0-feeder-atomic-fencing-red-tests.log; then
            echo "T0_FEEDER_ATOMIC_FENCING_RED=CONFIRMED" | tee t0-feeder-atomic-fencing-red-verdict.txt
          else
            cat t0-feeder-atomic-fencing-red-tests.log
            echo "T0_FEEDER_ATOMIC_FENCING_RED=INVALID" | tee t0-feeder-atomic-fencing-red-verdict.txt
            exit 1
          fi
      - name: Compile atomic fencing contract tests
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m py_compile market_data/test_feeder_atomic_fencing.py
          echo "T0_FEEDER_ATOMIC_FENCING_TEST_COMPILE=PASS" | tee t0-feeder-atomic-fencing-red-compile.log
    artifacts:
      - ci-source-sha.txt
      - t0-feeder-atomic-fencing-red-tests.log
      - t0-feeder-atomic-fencing-red-verdict.txt
      - t0-feeder-atomic-fencing-red-compile.log

