        - pattern: feature/dual-strategy-phase3-paper-replay-20261030
          include: true
          source: true
        - pattern: feature/dual-strategy-phase4-artifact-audit-20261030
          include: true
          source: true
        - pattern: feature/dual-strategy-phase5-contention-audit-20261030
          include: true
          source: true
        - pattern: feature/dual-strategy-phase6-oos-readiness-20261030
          include: true
          source: true
        - pattern: feature/dual-strategy-phase7-model-lineage-20261031
          include: true
          source: true
        - pattern: feature/dual-strategy-phase8-native-model-fingerprints-20261031
          include: true
          source: true
        - pattern: feature/dual-strategy-phase9-three-slots-ten-percent-20261031
          include: true
          source: true
        - pattern: feature/dual-strategy-phase10-contention-attribution-20261031
          include: true
          source: true
        - pattern: feature/dual-strategy-phase11-conflict-reconciliation-20261031
          include: true
          source: true
