workflows:
  android_freqtrade_debug:
    name: Android Freqtrade offline parity + Debug APK
    max_build_duration: 60
    environment:
      java: 17
      vars:
        ANDROID_PARITY_TRACE_OUTPUT: "$CM_BUILD_DIR/android-emergency-trace.json"
        ANDROID_PARITY_ENTRY_TRACE_OUTPUT: "$CM_BUILD_DIR/android-entry-trace.json"
        ANDROID_PARITY_DCA_TRACE_OUTPUT: "$CM_BUILD_DIR/android-dca-trace.json"
        ANDROID_PARITY_TP_TRACE_OUTPUT: "$CM_BUILD_DIR/android-tp-trace.json"
    scripts:
      - name: Verify project and Python offline analytics
        script: |
          set -eu
          test -f android-app/settings.gradle.kts
          test -f android-app/app/build.gradle.kts
          python3 -m unittest discover -s freqtrade-backtest/tests -v
      - name: Android unit tests and canonical trace exports
        script: |
          set -eu
          cd android-app
          gradle :app:testDebugUnitTest --no-daemon
      - name: Compare Android and Python parity traces
        script: |
          set -eu
          python3 freqtrade-backtest/export_emergency_parity_trace.py python-emergency-trace.json
          python3 freqtrade-backtest/compare_events.py android-emergency-trace.json python-emergency-trace.json
          python3 freqtrade-backtest/export_entry_parity_trace.py python-entry-trace.json
          python3 freqtrade-backtest/compare_events.py android-entry-trace.json python-entry-trace.json
          python3 freqtrade-backtest/export_dca_parity_trace.py python-dca-trace.json
          python3 freqtrade-backtest/compare_events.py android-dca-trace.json python-dca-trace.json
          python3 freqtrade-backtest/export_tp_parity_trace.py python-tp-trace.json
          python3 freqtrade-backtest/compare_events.py android-tp-trace.json python-tp-trace.json
      - name: Write Android/Python parity discrepancy report
        script: |
          set -eu
          python3 freqtrade-backtest/parity_suite.py --android-dir . --output-dir parity-results
      - name: Assemble Android Debug APK
        script: |
          set -eu
          cd android-app
          gradle :app:assembleDebug --no-daemon
      - name: Verify Debug APK signature
        script: |
          set -eu
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -m 1 '^package:'
          "$APKSIGNER" verify --print-certs "$APK"
          echo "DEBUG ONLY: this APK is not signed with the installed Release certificate."
    artifacts:
      - android-app/app/build/outputs/apk/debug/*.apk
      - parity-results/*.json
      - android-app/app/build/reports/tests/testDebugUnitTest/**/*

  android_freqtrade_release:
    name: Android Freqtrade parity + signed Release APK
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - release_signing
      vars:
        ANDROID_PARITY_TRACE_OUTPUT: "$CM_BUILD_DIR/android-emergency-trace.json"
        ANDROID_PARITY_ENTRY_TRACE_OUTPUT: "$CM_BUILD_DIR/android-entry-trace.json"
        ANDROID_PARITY_DCA_TRACE_OUTPUT: "$CM_BUILD_DIR/android-dca-trace.json"
        ANDROID_PARITY_TP_TRACE_OUTPUT: "$CM_BUILD_DIR/android-tp-trace.json"
    scripts:
      - name: Verify project and Python offline analytics
        script: |
          set -eu
          test -f android-app/settings.gradle.kts
          test -f android-app/app/build.gradle.kts
          python3 -m unittest discover -s freqtrade-backtest/tests -v
      - name: Android unit tests and canonical trace exports
        script: |
          set -eu
          cd android-app
          gradle :app:testDebugUnitTest --no-daemon
      - name: Compare Android and Python parity traces
        script: |
          set -eu
          python3 freqtrade-backtest/export_emergency_parity_trace.py python-emergency-trace.json
          python3 freqtrade-backtest/compare_events.py android-emergency-trace.json python-emergency-trace.json
          python3 freqtrade-backtest/export_entry_parity_trace.py python-entry-trace.json
          python3 freqtrade-backtest/compare_events.py android-entry-trace.json python-entry-trace.json
          python3 freqtrade-backtest/export_dca_parity_trace.py python-dca-trace.json
          python3 freqtrade-backtest/compare_events.py android-dca-trace.json python-dca-trace.json
          python3 freqtrade-backtest/export_tp_parity_trace.py python-tp-trace.json
          python3 freqtrade-backtest/compare_events.py android-tp-trace.json python-tp-trace.json
      - name: Decode release keystore securely
        script: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Set secure ANDROID_KEYSTORE_BASE64 in Codemagic release_signing group}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set secure ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_PASSWORD:?Set secure ANDROID_KEY_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Set secure ANDROID_KEY_ALIAS}"
          test "$ANDROID_KEY_ALIAS" = "btc-chart-release"
          export ANDROID_KEYSTORE_PATH="$CM_BUILD_DIR/android-app/release-signing.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          echo "Keystore loaded (content and passwords not printed)."
      - name: Assemble signed Android Release APK
        script: |
          set -eu
          export ANDROID_KEYSTORE_PATH="$CM_BUILD_DIR/android-app/release-signing.keystore"
          cd android-app
          gradle :app:assembleRelease --no-daemon
      - name: Verify Release APK signature and identity
        script: |
          set -eu
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -m 1 "^package: name='com.kenznguyen.btclivealerts'"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "Compare the signer SHA-256 above with the installed Release APK before attempting an update."
    artifacts:
      - android-app/app/build/outputs/apk/release/*.apk
      - android-app/app/build/reports/tests/testDebugUnitTest/**/*

  freqtrade_runtime_probe:
    name: Freqtrade actual runtime discovery (NOT parity)
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Verify Docker availability
        script: |
          set -eu
          command -v docker
          docker info >/dev/null
      - name: Invoke actual Freqtrade runtime and discover strategy
        script: |
          set -eu
          mkdir -p freqtrade-runtime-results
          docker run --rm freqtradeorg/freqtrade:stable --version | tee freqtrade-runtime-results/freqtrade-version.txt
          docker run --rm -v "$CM_BUILD_DIR/freqtrade-backtest/strategies:/freqtrade/user_data/strategies:ro" \
            freqtradeorg/freqtrade:stable list-strategies \
            --strategy-path /freqtrade/user_data/strategies --one-column \
            | tee freqtrade-runtime-results/strategy-discovery.txt
          grep -q '^BtcM15H1ParityGate$' freqtrade-runtime-results/strategy-discovery.txt
      - name: Record limitations (no real strategy backtest yet)
        script: |
          set -eu
          python3 -c 'import json,pathlib; pathlib.Path("freqtrade-runtime-results/verification.json").write_text(json.dumps({"runtime_version_invoked": True, "strategy_discovered": True, "actual_backtest_executed": False, "android_freqtrade_parity_verified": False, "reason": "adapter_has_disabled_entry_exit_and_no_shared_historical_trade_ledger"}, indent=2)+"\\n")'
    artifacts:
      - freqtrade-runtime-results/**/*

  freqtrade_entry_diagnostics:
    name: Android/Freqtrade ENTRY dataframe parity diagnostics
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Install dataframe dependency
        script: |
          set -eu
          python3 -m pip install "pandas>=2.1,<3"
      - name: Verify shared OHLCV ENTRY diagnostic tests
        script: |
          set -eu
          python3 -m unittest discover -s freqtrade-backtest/tests -p test_entry_frame.py -v
          python3 freqtrade-backtest/export_entry_parity_trace.py python-entry-trace.json
      - name: Explain runtime parity status
        script: |
          set -eu
          echo "ENTRY dataframe diagnostics only; actual Freqtrade order simulation, DCA and exits NOT certified."
    artifacts:
      - python-entry-trace.json

  freqtrade_runtime_backtest:
    name: Freqtrade REAL backtest — macOS M2 native experiment
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Validate backtest-only configuration
        script: |
          set -eu
          uname -sm
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path("freqtrade-backtest/config.runtime-entry.json").read_text())
          assert c["dry_run"] is True and c["trading_mode"] == "spot"
          assert c["exchange"]["key"] == "" and c["exchange"]["secret"] == ""
          assert c["exchange"]["pair_whitelist"] == ["BTC/USDT"]
          assert c["exchange"]["name"] == "okx"
          print("Keyless spot historical backtest only.")
          PY
      - name: Install native Freqtrade (experimental, ARM64 unsupported upstream)
        script: |
          set -eu
          command -v brew || { echo "Homebrew is required for native install"; exit 1; }
          brew install python@3.12 ta-lib libomp
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$CM_BUILD_DIR/.freqtrade-venv"
          "$CM_BUILD_DIR/.freqtrade-venv/bin/python" -m pip install --upgrade pip wheel setuptools
          "$CM_BUILD_DIR/.freqtrade-venv/bin/python" -m pip install freqtrade
          "$CM_BUILD_DIR/.freqtrade-venv/bin/freqtrade" --version
      - name: Prepare backtest workspace
        script: |
          set -eu
          mkdir -p freqtrade-runtime-data/data freqtrade-runtime-data/backtest_results freqtrade-runtime-data/strategies freqtrade-runtime-results
          cp freqtrade-backtest/config.runtime-entry.json freqtrade-runtime-data/config.json
          cp freqtrade-backtest/strategies/BtcM15H1EntryRuntime.py freqtrade-runtime-data/BtcM15H1EntryRuntime.py
          cp freqtrade-backtest/entry_frame.py freqtrade-runtime-data/entry_frame.py
          cp freqtrade-backtest/android_indicators.py freqtrade-runtime-data/android_indicators.py
          cp freqtrade-backtest/android_signal_predicates.py freqtrade-runtime-data/android_signal_predicates.py
      - name: Record actual Freqtrade version
        script: |
          set -eu
          "$CM_BUILD_DIR/.freqtrade-venv/bin/freqtrade" --version | tee freqtrade-runtime-results/version.txt
      - name: Download OKX SPOT candles for native backtest
        script: |
          set -eu
          "$CM_BUILD_DIR/.freqtrade-venv/bin/freqtrade" download-data \
            --userdir "$CM_BUILD_DIR/freqtrade-runtime-data" \
            --config "$CM_BUILD_DIR/freqtrade-runtime-data/config.json" \
            --exchange okx --pairs BTC/USDT \
            --trading-mode spot --timeframes 15m 1h --days 45 \
            --datadir "$CM_BUILD_DIR/freqtrade-runtime-data/data"
      - name: Run actual Freqtrade CLI backtesting
        script: |
          set -eu
          "$CM_BUILD_DIR/.freqtrade-venv/bin/freqtrade" backtesting \
            --userdir "$CM_BUILD_DIR/freqtrade-runtime-data" \
            --config "$CM_BUILD_DIR/freqtrade-runtime-data/config.json" \
            --strategy BtcM15H1EntryRuntime \
            --strategy-path "$CM_BUILD_DIR/freqtrade-runtime-data" \
            --datadir "$CM_BUILD_DIR/freqtrade-runtime-data/data" \
            --export-directory "$CM_BUILD_DIR/freqtrade-runtime-data/backtest_results" \
            --fee 0.0005 --cache none --export trades \
            > freqtrade-runtime-results/backtest.log 2>&1 || {
              tail -n 120 freqtrade-runtime-results/backtest.log
              exit 1
            }
          tail -n 100 freqtrade-runtime-results/backtest.log
          find freqtrade-runtime-data/backtest_results -type f -name '*.zip' | grep -q .
      - name: Write verified command-execution manifest
        script: |
          set -eu
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = {
              "actual_freqtrade_backtest_command_completed": True,
              "runtime_install": "experimental native macOS ARM64",
              "strategy": "BtcM15H1EntryRuntime",
              "market": "OKX BTC/USDT SPOT",
              "strategy_scope": "LONG entry diagnostic, placeholder ROI/stoploss",
              "android_13x_futures_parity_verified": False,
              "dca_short_tp_soft_sl_emergency_sl_parity_verified": False,
              "no_real_orders": True
          }
          Path("freqtrade-runtime-results/run-manifest.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          PY
    artifacts:
      - freqtrade-runtime-results/**/*
      - freqtrade-runtime-data/backtest_results/**/*

  freqtrade_futures_backtest:
    name: Freqtrade FUTURES 13x backtest — candidate not parity-certified
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Validate backtest-only configuration
        script: |
          set -eu
          uname -sm
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path("freqtrade-backtest/config.runtime-futures.json").read_text())
          assert c["dry_run"] is True and c["trading_mode"] == "futures"
          assert c["margin_mode"] == "isolated"
          assert c["exchange"]["key"] == "" and c["exchange"]["secret"] == ""
          assert c["exchange"]["pair_whitelist"] == ["BTC/USDT:USDT"]
          assert c["exchange"]["name"] == "okx"
          print("Keyless futures historical backtest only.")
          PY
      - name: Install native Freqtrade (experimental, ARM64 unsupported upstream)
        script: |
          set -eu
          command -v brew || { echo "Homebrew is required for native install"; exit 1; }
          brew install python@3.12 ta-lib libomp
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$CM_BUILD_DIR/.freqtrade-venv"
          "$CM_BUILD_DIR/.freqtrade-venv/bin/python" -m pip install --upgrade pip wheel setuptools
          "$CM_BUILD_DIR/.freqtrade-venv/bin/python" -m pip install freqtrade
          "$CM_BUILD_DIR/.freqtrade-venv/bin/freqtrade" --version
      - name: Prepare backtest workspace
        script: |
          set -eu
          mkdir -p freqtrade-futures-data/data freqtrade-futures-data/backtest_results freqtrade-futures-data/strategies freqtrade-futures-results
          cp freqtrade-backtest/config.runtime-futures.json freqtrade-futures-data/config.json
          cp freqtrade-backtest/strategies/BtcM15H1FuturesRuntime.py freqtrade-futures-data/strategies/BtcM15H1FuturesRuntime.py
          cp freqtrade-backtest/entry_frame.py freqtrade-futures-data/entry_frame.py
          cp freqtrade-backtest/android_indicators.py freqtrade-futures-data/android_indicators.py
          cp freqtrade-backtest/android_signal_predicates.py freqtrade-futures-data/android_signal_predicates.py
      - name: Verify futures contract and priority unit tests
        script: |
          set -eu
          python3 -m unittest discover -s freqtrade-backtest/tests -p test_futures_runtime_contract.py -v
          python3 -m unittest discover -s freqtrade-backtest/tests -p test_dca_diagnostics.py -v
      - name: Record actual Freqtrade version
        script: |
          set -eu
          "$CM_BUILD_DIR/.freqtrade-venv/bin/freqtrade" --version | tee freqtrade-futures-results/version.txt
      - name: Download OKX perpetual candles plus mark and funding history
        script: |
          set -eu
          "$CM_BUILD_DIR/.freqtrade-venv/bin/freqtrade" download-data \
            --userdir "$CM_BUILD_DIR/freqtrade-futures-data" \
            --config "$CM_BUILD_DIR/freqtrade-futures-data/config.json" \
            --exchange okx --pairs BTC/USDT:USDT \
            --trading-mode futures --timeframes 15m 1h --days 45 \
            --datadir "$CM_BUILD_DIR/freqtrade-futures-data/data"
      - name: Run actual Freqtrade CLI backtesting
        script: |
          set -eu
          export FREQTRADE_DCA_TRACE="$CM_BUILD_DIR/freqtrade-futures-results/dca-diagnostics.jsonl"
          "$CM_BUILD_DIR/.freqtrade-venv/bin/freqtrade" backtesting \
            --userdir "$CM_BUILD_DIR/freqtrade-futures-data" \
            --config "$CM_BUILD_DIR/freqtrade-futures-data/config.json" \
            --strategy BtcM15H1FuturesRuntime \
            --strategy-path "$CM_BUILD_DIR/freqtrade-futures-data/strategies" \
            --datadir "$CM_BUILD_DIR/freqtrade-futures-data/data" \
            --export-directory "$CM_BUILD_DIR/freqtrade-futures-data/backtest_results" \
            --fee 0.0005 --cache none --export trades \
            > freqtrade-futures-results/backtest.log 2>&1 || {
              tail -n 120 freqtrade-futures-results/backtest.log
              exit 1
            }
          tail -n 100 freqtrade-futures-results/backtest.log
          if test -f freqtrade-futures-results/dca-diagnostics.jsonl; then
            echo "DCA callback samples:"
            tail -n 12 freqtrade-futures-results/dca-diagnostics.jsonl
          else
            echo "No DCA diagnostics were emitted; callback may not have been invoked."
          fi
          find freqtrade-futures-data/backtest_results -type f -name '*.zip' | grep -q .
      - name: Write verified command-execution manifest
        script: |
          set -eu
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = {
              "actual_freqtrade_backtest_command_completed": True,
              "runtime_install": "experimental native macOS ARM64",
              "futures_13x_callbacks_implemented": True,
              "strategy": "BtcM15H1FuturesRuntime",
              "market": "OKX BTC/USDT:USDT Futures",
              "strategy_scope": "13x LONG/SHORT DCA candidate + prioritized custom_exit; fill-level parity unverified",
              "android_13x_futures_parity_verified": False,
              "dca_short_tp_soft_sl_emergency_sl_parity_verified": False,
              "android_fill_price_and_event_order_verified": False,
              "dca_callback_trace": "dca-diagnostics.jsonl",
              "no_real_orders": True
          }
          Path("freqtrade-futures-results/run-manifest.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          PY
    artifacts:
      - freqtrade-futures-results/**/*
      - freqtrade-futures-data/backtest_results/**/*
