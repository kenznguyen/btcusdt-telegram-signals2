  dual-strategy-phase14-frozen-preprocessing:
    name: Phase 14 | SHA-sealed frozen model fitted preprocessing audit (manual)
    instance_type: mac_mini_m2
    max_build_duration: 35
    # Manual only. No GitHub Actions, trading, retraining or exchange download.
    environment:
      vars:
        PHASE14_EVIDENCE_ZIP: "research_evidence/phase14-frozen-original-evidence.zip"
    scripts:
      - name: Verify original Phase13B evidence archive before invoking Python
        script: |
          set -euo pipefail
          test -f "$PHASE14_EVIDENCE_ZIP" || {
            echo "PHASE14_MISSING_ORIGINAL_SEALED_EVIDENCE_ZIP: upload research_evidence/phase14-frozen-original-evidence.zip"; exit 2;
          }
          printf '%s  %s\n' "b64f39bd70c27c8d6abed1795ee06504c108eed42ebdab98ce375a6449b5b035" "$PHASE14_EVIDENCE_ZIP" | shasum -a 256 -c -
          mkdir -p artifacts/phase14/input artifacts/phase14/seal artifacts/phase14/report
          unzip -t "$PHASE14_EVIDENCE_ZIP" >/dev/null
          unzip -oq "$PHASE14_EVIDENCE_ZIP" -d artifacts/phase14/input
          test "$(cat artifacts/phase14/input/phase3-source-sha.txt)" = "082edc082996425f61f48c952be41fb037564103" || {
            echo "PHASE14_ORIGINAL_SOURCE_COMMIT_MISMATCH"; exit 2;
          }
          git fetch --no-tags origin \
            refs/heads/freeze/phase13b-20261104-candidate-082edc0:refs/remotes/origin/freeze/phase13b-20261104-candidate-082edc0
          git merge-base --is-ancestor 888efb11b613b42a2badb3bc8adfa19ff090f2bb \
            refs/remotes/origin/freeze/phase13b-20261104-candidate-082edc0 || {
            echo "PHASE14_REGISTERED_SEAL_COMMIT_NOT_RETAINED"; exit 2;
          }
          git show 888efb11b613b42a2badb3bc8adfa19ff090f2bb:research_seals/phase13b-20261104/seal-manifest.json \
            > artifacts/phase14/seal/seal-manifest.json
