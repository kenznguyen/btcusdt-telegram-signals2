          set -euo pipefail
          python3 -m compileall -q quant_system paper_execution freqtrade_parity freqai_bridge
    artifacts:
      - phase3-source-sha.txt
      - phase3-unit-tests.log

  dual-strategy-phase3-native-research:
    name: Phase 3 | native Freqtrade FreqAI historical research (manual)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      vars:
        PHASE3_DAYS: "180"
        PHASE3_DETAIL_MINUTES: "5"
        PHASE3_DOWNLOAD_DAYS: "220"
    # NO triggering: operator manually selects 180 or 360 days. May consume
    # significant Codemagic resources; never run as a push-triggered job.
    scripts:
      - name: Validate explicit historical research parameters
        script: |
          set -euo pipefail
          case "$PHASE3_DAYS" in
            180) ;;
            360) echo "360-day execution requires completed 180-day paper audit and explicit release gate"; exit 2 ;;
            *) echo "PHASE3_DAYS must be 180"; exit 2 ;;
          esac
          case "$PHASE3_DAYS" in 180) ;; *) exit 2 ;; esac
          case "$PHASE3_DETAIL_MINUTES" in 1|5) ;; *) echo "Detail must be 1m or 5m"; exit 2 ;; esac
          test "$PHASE3_DOWNLOAD_DAYS" -ge "$((PHASE3_DAYS+35))" || {
            echo "At least 35 days of FreqAI model-training prehistory required"; exit 2;
          }
          git rev-parse HEAD | tee phase3-source-sha.txt
          mkdir -p artifacts/phase3/canonical artifacts/phase3/native artifacts/phase3/paper
      - name: Install pinned CPU Freqtrade and FreqAI runtime
        script: |
          set -euo pipefail
          if ! brew list --versions libomp > /dev/null 2>&1; then
            brew install libomp
          fi
          bash ci/setup-python.sh requirements-freqai.txt requirements-market-data.txt
          # setup-python.sh persists CI_PYTHON to CM_ENV for later steps only.
          # The current shell must export the venv path explicitly (set -u).
          export CI_PYTHON="$CM_BUILD_DIR/.ci-tools/python-venv/bin/python"
          test -x "$CI_PYTHON"
          "$CI_PYTHON" -m freqtrade --version
          "$CI_PYTHON" -c 'import freqtrade, lightgbm; print("Pinned Freqtrade/FreqAI imports OK")'
          # Detect pinned FreqAI TRAIN/TEST four-candle overlap and prove the
          # Phase12 prefit purge on actual pandas/sklearn arrays BEFORE downloading
          # 220 days of venue data. Synthetic smoke is not historical certification.
          export PYTHONPATH="$CM_BUILD_DIR"
          "$CI_PYTHON" -m quant_system.phase12_native_purge_smoke 2>&1 | tee artifacts/phase3/native/phase12-purge-smoke.json
          # Regression on configured feature hooks; synthetic data only.
          "$CI_PYTHON" -m unittest quant_system.test_phase13_feature_causality -v \
            2>&1 | tee artifacts/phase3/native/phase13-feature-tests.log
          "$CI_PYTHON" -m unittest \
            quant_system.test_phase13b_matrix \
            quant_system.test_phase13b_matrix_audit \
            quant_system.test_phase13b_oos \
            quant_system.test_phase13b_native_fit_contract -v \
            2>&1 | tee artifacts/phase3/native/phase13b-unit-tests.log
          # A fresh Codemagic checkout has NO default ./user_data. Freqtrade
          # requires a real userdir before it loads config for download-data.
          "$CI_PYTHON" -m freqtrade create-userdir --userdir "$CM_BUILD_DIR/.ci-tools/phase3-freqtrade-userdata"
          test -d "$CM_BUILD_DIR/.ci-tools/phase3-freqtrade-userdata"
          test -d "$CM_BUILD_DIR/.ci-tools/phase3-freqtrade-userdata/strategies"
          mkdir -p "$CM_BUILD_DIR/.ci-tools/phase3-freqtrade-userdata/freqaimodels"
          cp freqai_bridge/ChartProAuditLightGBMRegressor.py \
            "$CM_BUILD_DIR/.ci-tools/phase3-freqtrade-userdata/freqaimodels/ChartProAuditLightGBMRegressor.py"
          "$CI_PYTHON" -m freqtrade create-userdir --help > artifacts/phase3/create-userdir-cli-help.txt
          # Validate the pinned CLI before the expensive historical download.
          "$CI_PYTHON" -m freqtrade download-data --help > artifacts/phase3/download-cli-help.txt
          "$CI_PYTHON" -m freqtrade backtesting --help > artifacts/phase3/backtest-cli-help.txt
          for flag in --timeframes --days --data-format-ohlcv; do
            grep -Fq -- "$flag" artifacts/phase3/download-cli-help.txt || {
              echo "Freqtrade download CLI missing $flag"; exit 2;
            }
          done
          for flag in --freqaimodel --timeframe-detail --dry-run-wallet --fee --cache --export; do
            grep -Fq -- "$flag" artifacts/phase3/backtest-cli-help.txt || {
              echo "Freqtrade backtesting CLI missing $flag"; exit 2;
            }
          done
      - name: Download genuine futures OHLCV plus exchange-managed funding and mark data
        script: |
          set -euo pipefail
          # OKX research data is separate from Binance paper market state.
          # Do not certify 180/360-day funding: historical MARK coverage may be limited.
          "$CI_PYTHON" -m freqtrade download-data \
            --config freqai_bridge/config.okx-research.json \
            --userdir "$CM_BUILD_DIR/.ci-tools/phase3-freqtrade-userdata" \
            --datadir "$CM_BUILD_DIR/.ci-tools/phase3-native-okx" \
            --data-format-ohlcv feather \
            --trading-mode futures \
            --timeframes "${PHASE3_DETAIL_MINUTES}m" 15m 1h \
            --days "$PHASE3_DOWNLOAD_DAYS" \
            2>&1 | tee artifacts/phase3/native-download.log
      - name: Export exactly the native candles and audit 180 or 360 days
        script: |
          set -euo pipefail
          export PYTHONPATH="$CM_BUILD_DIR"
          "$CI_PYTHON" -m quant_system.native_exchange_export \
            --exchange okx \
            --datadir "$CM_BUILD_DIR/.ci-tools/phase3-native-okx" \
            --output-dir artifacts/phase3/canonical \
            --days "$PHASE3_DAYS" --detail-minutes "$PHASE3_DETAIL_MINUTES"
          "$CI_PYTHON" -m quant_system.intrabar_audit \
            --m15 artifacts/phase3/canonical/15m.csv \
            --h1 artifacts/phase3/canonical/1h.csv \
            --detail "artifacts/phase3/canonical/${PHASE3_DETAIL_MINUTES}m.csv" \
            --days "$PHASE3_DAYS" --detail-minutes "$PHASE3_DETAIL_MINUTES" \
            --output "artifacts/phase3/history-audit-${PHASE3_DAYS}.json"
      - name: Verify actual native strategy resolvers
        script: |
          set -euo pipefail
          export PYTHONPATH="$CM_BUILD_DIR"
