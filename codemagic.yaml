# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
workflows:
  kotlin-freqtrade-trace-gate:
    name: Kotlin vs Freqtrade trace export and fail-closed audit
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    # Manual only: provide genuine input files and both independent engine traces.
    scripts:
      - name: Export Kotlin trace from supplied canonical CSV if available
        script: |
          set -euo pipefail
          mkdir -p artifacts/parity
          if [ -s parity-input/m15.csv ] && [ -s parity-input/h1.csv ]; then
            bash ci/setup-android.sh
            export PARITY_M15_CSV="$CM_BUILD_DIR/parity-input/m15.csv"
            export PARITY_H1_CSV="$CM_BUILD_DIR/parity-input/h1.csv"
            export PARITY_KOTLIN_TRACE_OUTPUT="$CM_BUILD_DIR/artifacts/parity/kotlin-trace.json"
            cd android-app
            "$CHART_GRADLE_BIN" :app:testDebugUnitTest --tests "*StrategyCsvArtifactTest" --no-daemon
          else
            echo "Missing canonical parity-input CSV; parity will fail closed"
          fi
      - name: Enforce independent trace gate
        script: |
          set -euo pipefail
          python3 ci/parity-artifact-gate.py artifacts/parity
    artifacts:
      - artifacts/parity/**
      - android-app/app/build/test-results/testDebugUnitTest/*.xml

  freqtrade-strategy-parity:
    name: Freqtrade strategy rule parity - no live orders
    instance_type: mac_mini_m2
    max_build_duration: 15
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/freqtrade-strategy-parity-20261029
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Validate offline rules and fail-closed trace policy
        script: |
          set -euo pipefail
          python3 -m unittest freqtrade_parity.test_rules freqtrade_parity.test_indicators freqtrade_parity.test_position freqtrade_parity.test_callbacks freqtrade_parity.test_context freqtrade_parity.test_strategy_contract freqtrade_parity.test_reconciliation freqtrade_parity.test_report_cli freqtrade_parity.test_dataset_hash freqtrade_parity.test_dataset_io freqtrade_parity.test_freqtrade_trace -v
          python3 -m compileall -q freqtrade_parity
    artifacts:
      - android-source-sha.txt

  freqtrade-native-smoke:
    name: Freqtrade 2026.9 native resolver - no orders
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install research runtime
        script: |
          set -euo pipefail
          if ! brew list --versions libomp > /dev/null 2>&1; then
            brew install libomp
          fi
          bash ci/setup-python.sh requirements-freqai.txt requirements-market-data.txt
      - name: Load guarded native strategy
        script: |
          set -euo pipefail
          export PYTHONPATH="$CM_BUILD_DIR"
          "$CI_PYTHON" ci/freqtrade-parity-smoke.py 2>&1 | tee freqtrade-parity-smoke.log
    artifacts:
      - ci-source-sha.txt
      - freqtrade-parity-smoke.log

  android-chart-pro-debug:
    name: BTC Chart Pro - tests, regular and parallel APKs
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.cache/btc-chart-pro
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/android-five-layer-control
          include: true
          source: true
        - pattern: feature/strategy-shadow-parity-20261029
          include: true
          source: true
        - pattern: feature/freqtrade-strategy-parity-20261029
          include: true
          source: true
        - pattern: feature/five-layer-paper
          include: true
          source: true
        - pattern: feature/canonical-market-data
          include: true
          source: true
        - pattern: feature/hummingbot-order-book
          include: true
          source: true
        - pattern: fix/chart-pro-reliability-20261027
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - android-app/
          - integrations/
          - ci/
          - codemagic.yaml
    scripts:
      - name: Test Hummingbot read-only bridge
        script: |
          set -euo pipefail
          python3 -m unittest integrations.test_hummingbot_bridge -v
          python3 -m unittest ci.test_android_apks -v
      - name: Prepare Android build tools and record source
        script: bash ci/setup-android.sh
      - name: Run Android unit tests
        working_directory: android-app
        script: |
          set -euo pipefail
          "$CHART_GRADLE_BIN" :app:testDebugUnitTest :app:testParallelUnitTest --no-daemon --stacktrace
        test_report: android-app/app/build/test-results/test*UnitTest/*.xml
      - name: Build regular and parallel APKs
        working_directory: android-app
        script: |
          set -euo pipefail
          "$CHART_GRADLE_BIN" :app:assembleDebug :app:assembleParallel --no-daemon --stacktrace
      - name: Verify application identities and publish parallel APK
        script: python3 ci/verify-android-apks.py
    artifacts:
      - android-app/app/build/outputs/apk/debug/*.apk
      - artifacts/BTC-5-Tang-Paper-*.apk
      - android-app/app/build/test-results/testDebugUnitTest/*.xml
      - android-app/app/build/reports/tests/testDebugUnitTest/**
      - android-app/app/build/test-results/testParallelUnitTest/*.xml
      - android-app/app/build/reports/tests/testParallelUnitTest/**
      - android-source-sha.txt
      - android-apks.json

  android-chart-pro-release:
    name: BTC Chart Pro - verified signed release APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      groups:
        - android_release
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.cache/btc-chart-pro
    # No triggering section: start this workflow manually on the intended source branch.
    scripts:
      - name: Prepare Android build tools and record source
        script: bash ci/setup-android.sh
      - name: Test, build and verify the existing release signing identity
        script: bash ci/release-android.sh
        test_report: android-app/app/build/test-results/testDebugUnitTest/*.xml
    artifacts:
      - android-app/app/build/outputs/apk/release/*.apk
      - android-app/app/build/test-results/testDebugUnitTest/*.xml
      - android-app/app/build/reports/tests/testDebugUnitTest/**
      - android-source-sha.txt
      - android-release-apk-signature.txt

  canonical-market-data:
    name: Canonical market data - Python checks
    instance_type: mac_mini_m2
    max_build_duration: 15
    cache:
      cache_paths:
        - $HOME/.cache/pip
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/five-layer-paper
          include: true
          source: true
        - pattern: feature/canonical-market-data
          include: true
          source: true
        - pattern: feature/hummingbot-order-book
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - market_data/
          - futures_intelligence/
          - pipeline/
          - paper_execution/
          - freqai_bridge/
          - integrations/
          - ci/
          - app.py
          - backtest.py
          - telegram_commands.py
          - requirements-market-data.txt
          - requirements.txt
          - requirements-freqai.txt
          - requirements-web.txt
          - requirements-ci.txt
          - codemagic.yaml
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements-market-data.txt requirements.txt requirements-web.txt requirements-ci.txt
      - name: Verify installed adapters and application
        script: |
          set -euo pipefail
          "$CI_PYTHON" -c 'import ccxt; import app; assert ccxt.binanceusdm().id == "binanceusdm"'
      - name: Run data tests and gateway regressions
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest market_data.test_store market_data.test_sync market_data.test_api -v 2>&1 | tee market-data-tests.log
          "$CI_PYTHON" -m unittest discover -s integrations -p 'test_*.py' -v 2>&1 | tee gateway-tests.log
          "$CI_PYTHON" -m unittest discover -s ci -p 'test_*.py' -v 2>&1 | tee ci-policy-tests.log
      - name: Run five-layer paper integration tests
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest futures_intelligence.test_import_collector pipeline.test_decision pipeline.test_api paper_execution.test_ledger freqai_bridge.test_exporter -v 2>&1 | tee paper-system-tests.log
      - name: Verify CLI and syntax
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m market_data.sync --help
          "$CI_PYTHON" -m compileall -q market_data integrations ci futures_intelligence pipeline paper_execution freqai_bridge app.py backtest.py telegram_commands.py
    artifacts:
      - ci-source-sha.txt
      - market-data-tests.log
      - gateway-tests.log
      - ci-policy-tests.log
      - paper-system-tests.log

  telegram-command:
    name: Telegram command
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups: [codemagic_legacy]
      vars:
        TELEGRAM_COMMAND: help
        BACKTEST_DAYS: "360"
        BACKTEST_INITIAL_CAPITAL: "100"
        ENTRY_MARGIN_PCT: "50"
        DCA_MARGIN_RATIO: "100"
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Execute authorized Telegram command
        script: '"$CI_PYTHON" ci/run-legacy.py telegram'
    artifacts:
      - ci-source-sha.txt
      - backtest_last_result.json
      - backtest_status.json
      - backtest_trades.csv
      - backtest_equity.csv
      - backtest_equity_m15.csv

  dashboard-backtest:
    name: Dashboard backtest
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        BACKTEST_DAYS: "360"
        BACKTEST_INITIAL_CAPITAL: "100"
        ENTRY_MARGIN_PCT: "50"
        DCA_MARGIN_RATIO: "100"
        BACKTEST_STATUS_FILE: dashboard_backtest_status.json
        BACKTEST_RESULT_FILE: dashboard_backtest_last_result.json
        BACKTEST_TRADES_FILE: dashboard_backtest_trades.csv
        BACKTEST_EQUITY_FILE: dashboard_backtest_equity.csv
        BACKTEST_CURVE_FILE: dashboard_backtest_equity_m15.csv
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Run backtest
        script: '"$CI_PYTHON" ci/run-legacy.py dashboard'
    artifacts:
      - ci-source-sha.txt
      - dashboard_backtest_last_result.json
      - dashboard_backtest_status.json
      - dashboard_backtest_trades.csv
      - dashboard_backtest_equity.csv
      - dashboard_backtest_equity_m15.csv

  signal-scan:
    name: Manual paper signal scan
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      groups: [codemagic_legacy]
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Scan using explicitly supplied paper state
        script: '"$CI_PYTHON" ci/run-legacy.py scanner'
    artifacts:
      - ci-source-sha.txt
      - state.json
      - state-provenance.json


  five-layer-dashboard:
    name: Five-layer React control - test and build
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      node: 24
      npm: 11.9.0
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/five-layer-paper
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - control_dashboard/
          - pipeline/
          - codemagic.yaml
    scripts:
      - name: Record dashboard source
        script: git rev-parse HEAD > ci-source-sha.txt
      - name: Frozen install with dependency scripts disabled
        working_directory: control_dashboard
        script: npm ci --ignore-scripts
      - name: Test API boundaries
        working_directory: control_dashboard
        script: npm test
      - name: Build control dashboard
        working_directory: control_dashboard
        script: npm run build
      - name: Audit dependencies
        working_directory: control_dashboard
        script: npm audit --audit-level=high
    artifacts:
      - control_dashboard/dist/**
      - ci-source-sha.txt

  freqai-strategy-smoke:
    name: FreqAI 2026.9 - native strategy load (manual)
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Prepare CPU runtime
        script: |
          set -euo pipefail
          if ! brew list --versions libomp > /dev/null 2>&1; then
            brew install libomp
          fi
          bash ci/setup-python.sh requirements-freqai.txt requirements-market-data.txt
      - name: Load prediction-only strategy without starting trading
        script: |
          set -euo pipefail
          export PYTHONPATH="$CM_BUILD_DIR"
          "$CI_PYTHON" ci/freqai-smoke.py 2>&1 | tee freqai-smoke-tests.log
    artifacts:
      - ci-source-sha.txt
      - freqai-smoke-tests.log

  dual-strategy-phase2:
    name: Dual-Strategy Phase 2 | CORE + FreqAI + risk ledger
    instance_type: mac_mini_m2
    max_build_duration: 15
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/dual-strategy-phase2-20261030
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Record CI source commit
        script: |
          set -euo pipefail
          git rev-parse HEAD | tee dual-strategy-source-sha.txt
          python3 --version
      - name: Test independent sources, conflict arbitration and crash-safe reservation
        script: |
          set -euo pipefail
          python3 -m unittest \
            quant_system.test_dual_strategy_phase2 \
            freqtrade_parity.test_rules \
            freqtrade_parity.test_context \
            freqtrade_parity.test_callbacks \
            freqtrade_parity.test_strategy_contract -v 2>&1 | tee dual-strategy-phase2-tests.log
      - name: Syntax-check paper-only Freqtrade adapter
        script: |
          set -euo pipefail
          python3 -m compileall -q quant_system freqtrade_parity freqai_bridge pipeline
    artifacts:
      - dual-strategy-source-sha.txt
      - dual-strategy-phase2-tests.log

  dual-strategy-phase3-unit:
