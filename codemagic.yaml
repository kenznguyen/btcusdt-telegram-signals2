              > "artifacts/frozen-oos/seal/$path"
          done
          git show "$PHASE16_APPROVAL_COMMIT:research_seals/phase13b-20261104/phase16-oos-release-gate.json" \
            > artifacts/frozen-oos/seal/phase16-oos-release-gate.json
          git show "$PHASE16_APPROVAL_COMMIT:research_seals/phase13b-20261104/phase16-all26-original-fit-audit.json" \
            > artifacts/frozen-oos/seal/phase16-all26-original-fit-audit.json
          cmp artifacts/frozen-oos/input/artifacts/phase3/native/phase13b-unsealed-model-candidate.json \
            artifacts/frozen-oos/seal/model-candidate-metadata.json || {
            echo "OOS_ORIGINAL_CANDIDATE_NOT_GIT_SEALED"; exit 2;
          }
      - name: Run immutable exact 30d OOS with original fitted model and shared risk
        script: |
          set -euo pipefail
          if ! brew list --versions libomp >/dev/null 2>&1; then brew install libomp; fi
          bash ci/setup-python.sh requirements-freqai.txt requirements-market-data.txt
          export CI_PYTHON="$CM_BUILD_DIR/.ci-tools/python-venv/bin/python"
          export PYTHONPATH="$CM_BUILD_DIR"
          "$CI_PYTHON" -m unittest \
            quant_system.test_phase16_frozen_oos \
            quant_system.test_paper_portfolio -v \
            2>&1 | tee artifacts/frozen-oos/report/frozen-oos-contract-tests.log
          "$CI_PYTHON" -m quant_system.phase16_frozen_oos \
            --holdout-dir research_evidence/frozen-oos-20261104/holdout \
            --prehistory-dir research_evidence/frozen-oos-20261104/prehistory \
            --config freqai_bridge/config.okx-research.json \
            --bundle artifacts/frozen-oos/input/artifacts/phase3/native/phase13b-unsealed-model-candidate.joblib \
            --metadata artifacts/frozen-oos/seal/model-candidate-metadata.json \
            --protocol artifacts/frozen-oos/seal/phase13b-oos-protocol.json \
            --seal artifacts/frozen-oos/seal/seal-manifest.json \
            --fold-audit artifacts/frozen-oos/seal/phase16-all26-original-fit-audit.json \
            --release-gate artifacts/frozen-oos/seal/phase16-oos-release-gate.json \
            --out-dir artifacts/frozen-oos/report \
            2>&1 | tee artifacts/frozen-oos/report/frozen-oos-paper-replay.log
    artifacts:
      - artifacts/frozen-oos/report/*.csv
      - artifacts/frozen-oos/report/*.json
      - artifacts/frozen-oos/report/*.log
      - artifacts/frozen-oos/seal/*.json
