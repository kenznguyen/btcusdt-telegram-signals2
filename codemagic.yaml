# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
# Android verification is test-only: no release APK packaging, signing, or live execution.
workflows:
# Codemagic executes CI workflows; existing workflows below are retained unchanged.
  android-t0-foundation:
    name: Android T0 Foundation - SQLite, JNI and JVM verification
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
      ndk: r27
      vars:
        AI_EXECUTION_ENABLED: "false"
        MARKET_DATA_DB: ""
        T0_FEEDER_LEASE_DB: ""
        PAPER_DB: ""
        BINANCE_API_KEY: ""
        BINANCE_API_SECRET: ""
        OKX_API_KEY: ""
        OKX_API_SECRET: ""
    scripts:
      - name: Record and validate exact source provenance
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/codemagic-android-evidence"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_BRANCH="${CM_BRANCH:-unknown}"
          if [ -n "${CM_COMMIT:-}" ]; then test "$SOURCE_SHA" = "$CM_COMMIT"; fi
          test "$AI_EXECUTION_ENABLED" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            test -z "${!key:-}"
          done
          {
            echo "source_sha=$SOURCE_SHA"
            echo "source_branch=$SOURCE_BRANCH"
            echo "codemagic_build_id=${CM_BUILD_ID:-unknown}"
            echo "ai_execution_enabled=$AI_EXECUTION_ENABLED"
            echo "java_version=$(java -version 2>&1 | head -n 1)"
            echo "os=$(sw_vers -productVersion)"
          } | tee "$CM_BUILD_DIR/codemagic-android-evidence/provenance.txt"
      - name: Install pinned Android SDK, NDK and CMake packages
        script: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "android_sdk_root=$SDK_ROOT" | tee -a "$CM_BUILD_DIR/codemagic-android-evidence/provenance.txt"
          echo "sdkmanager=$SDKMANAGER" | tee -a "$CM_BUILD_DIR/codemagic-android-evidence/provenance.txt"
      - name: Download and verify pinned Gradle 8.9 distribution
        script: |
          set -euo pipefail
          TOOLS_DIR="$CM_BUILD_DIR/.ci-tools"
          mkdir -p "$TOOLS_DIR"
          curl --fail --location --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$TOOLS_DIR/gradle-8.9-bin.zip"
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  $TOOLS_DIR/gradle-8.9-bin.zip" | shasum -a 256 -c -
          unzip -q "$TOOLS_DIR/gradle-8.9-bin.zip" -d "$TOOLS_DIR"
          "$TOOLS_DIR/gradle-8.9/bin/gradle" --version | tee "$CM_BUILD_DIR/codemagic-android-evidence/gradle-version.txt"
      - name: Download and verify official SQLite 3.54.1 amalgamation
        script: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip --output "$CM_BUILD_DIR/sqlite-amalgamation-3540100.zip"
          python3 ci/prepare_pinned_sqlite.py --archive "$CM_BUILD_DIR/sqlite-amalgamation-3540100.zip" 2>&1 | tee "$CM_BUILD_DIR/codemagic-android-evidence/sqlite-pinning.log"
      - name: Build and run isolated native SQLite D5 memory tests
        script: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          CMAKE="$SDK_ROOT/cmake/3.22.1/bin/cmake"
          CTEST="$SDK_ROOT/cmake/3.22.1/bin/ctest"
          test -x "$CMAKE"
          test -x "$CTEST"
          "$CMAKE" -S android-app/app/src/main/cpp/tests -B "$CM_BUILD_DIR/.ci-build/t0.6-native-d5-tests" -DSQLITE_AMALGAMATION_DIR="$CM_BUILD_DIR/android-app/app/build/generated/sqlite/vendor"
          "$CMAKE" --build "$CM_BUILD_DIR/.ci-build/t0.6-native-d5-tests" --parallel 2
          "$CTEST" --test-dir "$CM_BUILD_DIR/.ci-build/t0.6-native-d5-tests" --output-on-failure 2>&1 | tee "$CM_BUILD_DIR/codemagic-android-evidence/native-ctest.log"
          mkdir -p android-app/app/build/t0.6
          cp "$CM_BUILD_DIR/.ci-build/t0.6-native-d5-tests/d5-native-memory-fixture.bin" android-app/app/build/t0.6/
      - name: Compile and link native SQLite JNI library
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.ci-tools/gradle-8.9/bin/gradle" -p android-app :app:externalNativeBuildDebug --no-daemon --stacktrace 2>&1 | tee "$CM_BUILD_DIR/codemagic-android-evidence/jni-build.log"
      - name: Run regular Android host JVM tests
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.ci-tools/gradle-8.9/bin/gradle" -p android-app :app:testDebugUnitTest -Pd5NativeFixture=build/t0.6/d5-native-memory-fixture.bin --no-daemon --stacktrace 2>&1 | tee "$CM_BUILD_DIR/codemagic-android-evidence/jvm-regular.log"
      - name: Run parallel .paper client JVM tests
        script: |
          set -euo pipefail
          "$CM_BUILD_DIR/.ci-tools/gradle-8.9/bin/gradle" -p android-app :app:testParallelUnitTest -Pd5NativeFixture=build/t0.6/d5-native-memory-fixture.bin --no-daemon --stacktrace 2>&1 | tee "$CM_BUILD_DIR/codemagic-android-evidence/jvm-paper.log"
      - name: Run SQLite pinning preparation unit tests
        script: |
          set -euo pipefail
          python3 -m unittest ci.tests.test_prepare_pinned_sqlite -v 2>&1 | tee "$CM_BUILD_DIR/codemagic-android-evidence/sqlite-preparation-tests.log"
      - name: Run Android T0 foundation static audit
        script: |
          set -euo pipefail
          python3 ci/check_android_t0_foundation.py 2>&1 | tee "$CM_BUILD_DIR/codemagic-android-evidence/android-t0-static-audit.log"
      - name: Collect test reports and source evidence
        script: |
          set -euo pipefail
          find android-app/app/build/test-results -type f -name '*.xml' -print 2>/dev/null | sort > "$CM_BUILD_DIR/codemagic-android-evidence/junit-xml-index.txt" || true
          git rev-parse HEAD > "$CM_BUILD_DIR/codemagic-android-evidence/final-source-sha.txt"
          git status --short > "$CM_BUILD_DIR/codemagic-android-evidence/worktree-status.txt"
    artifacts:
      - codemagic-android-evidence/**
      - android-app/app/build/test-results/testDebugUnitTest/**
      - android-app/app/build/test-results/testParallelUnitTest/**
      - android-app/app/build/reports/tests/testDebugUnitTest/**
      - android-app/app/build/reports/tests/testParallelUnitTest/**
      - android-app/app/build/t0.6/**
      - android-app/app/build/generated/sqlite/sqlite3-pins.cmake
  canonical-market-data:
    name: Cross-layer integration - non-T0 runtime suites
    instance_type: mac_mini_m2
    max_build_duration: 15
    cache:
      cache_paths:
        - $HOME/.cache/pip
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/five-layer-paper
          include: true
          source: true
        - pattern: feature/hummingbot-order-book
          include: true
          source: true
        - pattern: feature/android-five-layer-control
          include: true
          source: true
        - pattern: feature/t1-intelligence-provenance-quality-20261101
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - futures_intelligence/
          - pipeline/
          - paper_execution/
          - freqai_bridge/
          - integrations/
          - backtest.py
          - telegram_commands.py
          - ci/test_legacy_runner.py
          - ci/run-legacy.py
          - requirements-market-data.txt
          - requirements.txt
          - requirements-freqai.txt
          - requirements-web.txt
          - requirements-ci.txt
          - codemagic.yaml
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements-market-data.txt requirements.txt requirements-web.txt requirements-ci.txt
      - name: Run data tests and gateway regressions
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest discover -s integrations -p 'test_*.py' -v 2>&1 | tee gateway-tests.log
          "$CI_PYTHON" -m unittest ci.test_legacy_runner -v 2>&1 | tee legacy-runner-tests.log
      - name: Run five-layer paper integration tests
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m unittest futures_intelligence.test_import_collector pipeline.test_decision pipeline.test_api pipeline.test_core_signal pipeline.test_core_strategy paper_execution.test_ledger paper_execution.test_risk_control paper_execution.test_equity freqai_bridge.test_exporter -v 2>&1 | tee paper-system-tests.log
      - name: Verify CLI and syntax
        script: |
          set -euo pipefail
          "$CI_PYTHON" -m compileall -q integrations futures_intelligence pipeline paper_execution freqai_bridge backtest.py telegram_commands.py
    artifacts:
      - ci-source-sha.txt
      - gateway-tests.log
      - legacy-runner-tests.log
      - paper-system-tests.log

  telegram-command:
    name: Telegram command
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups: [codemagic_legacy]
      vars:
        TELEGRAM_COMMAND: help
        BACKTEST_DAYS: "360"
        BACKTEST_INITIAL_CAPITAL: "100"
        ENTRY_MARGIN_PCT: "50"
        DCA_MARGIN_RATIO: "100"
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Execute authorized Telegram command
        script: '"$CI_PYTHON" ci/run-legacy.py telegram'
    artifacts:
      - ci-source-sha.txt
      - backtest_last_result.json
      - backtest_status.json
      - backtest_trades.csv
      - backtest_equity.csv
      - backtest_equity_m15.csv

  dashboard-backtest:
    name: Dashboard backtest
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        BACKTEST_DAYS: "360"
        BACKTEST_INITIAL_CAPITAL: "100"
        ENTRY_MARGIN_PCT: "50"
        DCA_MARGIN_RATIO: "100"
        BACKTEST_STATUS_FILE: dashboard_backtest_status.json
        BACKTEST_RESULT_FILE: dashboard_backtest_last_result.json
        BACKTEST_TRADES_FILE: dashboard_backtest_trades.csv
        BACKTEST_EQUITY_FILE: dashboard_backtest_equity.csv
        BACKTEST_CURVE_FILE: dashboard_backtest_equity_m15.csv
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Run backtest
        script: '"$CI_PYTHON" ci/run-legacy.py dashboard'
    artifacts:
      - ci-source-sha.txt
      - dashboard_backtest_last_result.json
      - dashboard_backtest_status.json
      - dashboard_backtest_trades.csv
      - dashboard_backtest_equity.csv
      - dashboard_backtest_equity_m15.csv

  signal-scan:
    name: Manual paper signal scan
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      groups: [codemagic_legacy]
    scripts:
      - name: Prepare Python and record source
        script: bash ci/setup-python.sh requirements.txt
      - name: Scan using explicitly supplied paper state
        script: '"$CI_PYTHON" ci/run-legacy.py scanner'
    artifacts:
      - ci-source-sha.txt
      - state.json
      - state-provenance.json


  five-layer-dashboard:
    name: Five-layer React control - test and build
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      node: 24
      npm: 11.9.0
    triggering:
      events: [push]
      branch_patterns:
        - pattern: feature/five-layer-paper
          include: true
          source: true
        - pattern: feature/android-five-layer-control
          include: true
          source: true
        - pattern: feature/t1-intelligence-provenance-quality-20261101
          include: true
          source: true
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - control_dashboard/
          - pipeline/
          - codemagic.yaml
    scripts:
      - name: Record dashboard source
        script: git rev-parse HEAD > ci-source-sha.txt
      - name: Frozen install with dependency scripts disabled
        working_directory: control_dashboard
        script: npm ci --ignore-scripts
      - name: Test React dashboard and API boundaries
        working_directory: control_dashboard
        script: npm test
      - name: Build control dashboard
        working_directory: control_dashboard
        script: npm run build
      - name: Audit dependencies
        working_directory: control_dashboard
        script: npm audit --audit-level=high
    artifacts:
      - control_dashboard/dist/**
      - ci-source-sha.txt

  freqai-strategy-smoke:
    name: FreqAI 2026.9 - native strategy load (manual)
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Prepare CPU runtime
        script: |
          set -euo pipefail
          if ! brew list --versions libomp > /dev/null 2>&1; then
            brew install libomp
          fi
          bash ci/setup-python.sh requirements-freqai.txt requirements-market-data.txt
      - name: Load prediction-only strategy without starting trading
        script: |
          set -euo pipefail
          export PYTHONPATH="$CM_BUILD_DIR"
          "$CI_PYTHON" ci/freqai-smoke.py 2>&1 | tee freqai-smoke-tests.log
    artifacts:
      - ci-source-sha.txt
      - freqai-smoke-tests.log
