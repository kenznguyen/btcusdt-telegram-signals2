            > artifacts/phase14/seal/phase13b-oos-protocol.json
          git show 888efb11b613b42a2badb3bc8adfa19ff090f2bb:research_seals/phase13b-20261104/model-candidate-metadata.json \
            > artifacts/phase14/seal/model-candidate-metadata.json
          cmp artifacts/phase14/seal/model-candidate-metadata.json \
            artifacts/phase14/input/artifacts/phase3/native/phase13b-unsealed-model-candidate.json || {
            echo "PHASE14_CANDIDATE_METADATA_NOT_EXACT_GIT_SNAPSHOT"; exit 2;
          }
      - name: Run pinned FreqAI fitted-pipeline interventions on original frozen candidate
        script: |
          set -euo pipefail
          if ! brew list --versions libomp >/dev/null 2>&1; then brew install libomp; fi
          bash ci/setup-python.sh requirements-freqai.txt requirements-market-data.txt
          export PYTHONPATH="$CM_BUILD_DIR"
          export CI_PYTHON="$CM_BUILD_DIR/.ci-tools/python-venv/bin/python"
          "$CI_PYTHON" -m freqtrade --version
          "$CI_PYTHON" -m unittest quant_system.test_phase14_fitted_preprocessing -v \
            2>&1 | tee artifacts/phase14/report/phase14-fitted-tests.log
          "$CI_PYTHON" -m quant_system.phase14_fitted_preprocessing \
            --artifacts-root artifacts/phase14/input/artifacts/phase3 \
            --bundle artifacts/phase14/input/artifacts/phase3/native/phase13b-unsealed-model-candidate.joblib \
            --candidate-metadata artifacts/phase14/input/artifacts/phase3/native/phase13b-unsealed-model-candidate.json \
            --protocol artifacts/phase14/seal/phase13b-oos-protocol.json \
            --seal artifacts/phase14/seal/seal-manifest.json \
            --out artifacts/phase14/report/phase14-frozen-preprocessing-audit.json \
            2>&1 | tee artifacts/phase14/report/phase14-frozen-preprocessing-audit.log
