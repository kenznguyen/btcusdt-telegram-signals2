name: Paper Writer Isolation P1 GREEN Acceptance

on:
  push:
    branches:
      - feature/t0-paper-writer-isolation-red-20261102
    paths:
      - "paper_execution/**"
      - ".github/workflows/paper-writer-isolation-red.yml"
  pull_request:
    branches:
      - feature/p5-2-4-shadow-migration-tests-20261102
    paths:
      - "paper_execution/**"
      - ".github/workflows/paper-writer-isolation-red.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-writer-isolation-red:
    name: SWG-F P1 + P2 PaperLedger runtime GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ""
      DATABASE_PATH: ""
      SQLITE_PATH: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
      EXCHANGE_API_KEY: ""
      EXCHANGE_API_SECRET: ""
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "SWG_F_SOURCE_SHA=$actual"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce source-only preflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL}"
          test -z "${DATABASE_PATH}"
          test -z "${SQLITE_PATH}"
          test -z "${BINANCE_API_KEY}"
          test -z "${BINANCE_API_SECRET}"
          test -z "${OKX_API_KEY}"
          test -z "${OKX_API_SECRET}"
          test -z "${EXCHANGE_API_KEY}"
          test -z "${EXCHANGE_API_SECRET}"
          echo "PAPER_WRITER_RED_PREFLIGHT=PASS"
      - name: Compile Paper writer contracts
        run: python -m py_compile paper_execution/test_writer_isolation_red.py paper_execution/test_writer_gate_runtime.py paper_execution/test_ledger_writer_isolation.py
      - name: Verify P2 PaperLedger GREEN acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest paper_execution.test_ledger_writer_isolation -v 2>&1 | tee paper-ledger-p2-green.log
          python - <<'PY'
          import re
          from pathlib import Path
          output = Path("paper-ledger-p2-green.log").read_text(encoding="utf-8")
          ran = re.search(r"^Ran (\d+) tests? in ", output, re.MULTILINE)
          failures = re.findall(r"^FAIL: test_[^\s(]+", output, re.MULTILINE)
          errors = re.findall(r"^ERROR: test_[^\s(]+", output, re.MULTILINE)
          skipped = re.findall(r"^test_[^\s(]+ \(.*skipped=", output, re.MULTILINE)
          valid = (
              ran is not None and int(ran.group(1)) == 9
              and not failures and not errors and not skipped
              and re.search(r"^OK$", output, re.MULTILINE) is not None
          )
          print(f"PAPER_LEDGER_P2_GREEN ran={ran.group(1) if ran else 'MISSING'} failures={len(failures)} errors={len(errors)} skipped={len(skipped)}")
          if not valid:
              raise SystemExit("P2 PaperLedger GREEN acceptance failed")
          print("PAPER_LEDGER_P2_GREEN=PASS")
          PY
      - name: Verify full Paper execution test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest paper_execution.test_ledger paper_execution.test_risk_limits paper_execution.test_equity paper_execution.test_risk_control paper_execution.test_shadow_migration paper_execution.test_writer_gate_runtime paper_execution.test_ledger_writer_isolation -v 2>&1 | tee paper-execution-regression.log
      - name: Verify process-level runtime GREEN acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest paper_execution.test_writer_gate_runtime -v 2>&1 | tee paper-writer-runtime-green.log
          python - <<'PY'
          import re
          from pathlib import Path

          output = Path("paper-writer-runtime-green.log").read_text(encoding="utf-8")
          ran = re.search(r"^Ran (\d+) tests? in ", output, re.MULTILINE)
          errors = re.findall(r"^ERROR: test_[^\s(]+", output, re.MULTILINE)
          failures = re.findall(r"^FAIL: test_[^\s(]+", output, re.MULTILINE)
          skipped = re.findall(r"^test_[^\s(]+ \(.*skipped=", output, re.MULTILINE)
          valid = (
              ran is not None and int(ran.group(1)) == 12
              and not errors and not failures and not skipped
              and re.search(r"^OK$", output, re.MULTILINE) is not None
          )
          print(
              f"SWG_F_RUNTIME_GREEN ran={ran.group(1) if ran else 'MISSING'} "
              f"failures={len(failures)} errors={len(errors)} skipped={len(skipped)}"
          )
          if not valid:
              print("PAPER_WRITER_RUNTIME_GREEN=NOT_VERIFIED")
              raise SystemExit(1)
          print("PAPER_WRITER_RUNTIME_GREEN=PASS")
          PY
      - name: Upload P1/P2 GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-writer-isolation-p1-p2-green-${{ github.sha }}
          path: |
            paper-writer-runtime-green.log
            paper-ledger-p2-green.log
            paper-execution-regression.log
          if-no-files-found: warn
          retention-days: 7
