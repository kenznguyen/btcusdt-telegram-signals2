name: T0 Health API Boundary Regression

'on':
  pull_request:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - "app.py"
      - "market_data/**"
      - "requirements*.txt"
      - ".github/workflows/t0-health-api-boundary.yml"

permissions:
  contents: read

concurrency:
  group: t0-health-api-boundary-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  health-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact PR source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements.txt
            requirements-web.txt
            requirements-ci.txt
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-market-data.txt -r requirements.txt -r requirements-web.txt -r requirements-ci.txt
      - name: Verify source identity and paper-only boundary
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$AI_EXECUTION_ENABLED" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            test -z "${!key:-}"
          done
      - name: Run T0 health API and app-surface contracts
        run: |
          set -euo pipefail
          python -m unittest market_data.test_app_surface market_data.test_feeder_health_api market_data.test_feeder_health_runtime_api -v 2>&1 | tee t0-health-api-boundary-tests.log
          python -m py_compile app.py market_data/feeder.py market_data/feeder_status.py
      - name: Upload exact-SHA test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-health-api-boundary-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          path: t0-health-api-boundary-tests.log
          retention-days: 14
