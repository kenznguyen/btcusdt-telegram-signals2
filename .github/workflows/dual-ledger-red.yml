name: Dual Ledger RED and Migration Contract

on:
  push:
    branches:
      - feature/t0-centralized-data-feeder-p1-20261101
    paths:
      - "paper_execution/**"
      - ".github/workflows/dual-ledger-red.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-ledger-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dual-ledger-red:
    name: Isolated Core and AI ledger contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_DB: ""
      MARKET_DATA_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-web.txt

      - name: Enforce isolated paper-only environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${PAPER_DB}"
          test -z "${MARKET_DATA_DB}"
          test -z "${BINANCE_API_KEY}"
          test -z "${BINANCE_API_SECRET}"
          test -z "${OKX_API_KEY}"
          test -z "${OKX_API_SECRET}"
          {
            echo "DUAL_LEDGER_MODE=PAPER_ONLY"
            echo "DUAL_LEDGER_SOURCE_SHA=$(git rev-parse HEAD)"
            echo "DUAL_LEDGER_EXTERNAL_SERVICES=NONE"
          } | tee dual-ledger-preflight.log

      - name: Compile RED contract
        run: |
          set -euo pipefail
          python -m py_compile paper_execution/test_dual_ledger_red.py paper_execution/test_dual_ledger_migration_red.py
          echo "DUAL_LEDGER_RED_COMPILE=PASS" | tee dual-ledger-compile.log

      - name: Execute focused RED contract
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_dual_ledger_red paper_execution.test_dual_ledger_migration_red -v 2>&1 | tee dual-ledger-red-tests.log

      - name: Upload source and RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-ledger-red-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            dual-ledger-preflight.log
            dual-ledger-compile.log
            dual-ledger-red-tests.log
