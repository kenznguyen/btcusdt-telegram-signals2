name: Telegram Command
run-name: ${{ github.event_name == 'schedule' && 'Scheduled signal run' || format('Telegram command {0}', inputs.command || 'help') }}

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      command:
        description: "Telegram command"
        required: true
        type: choice
        options:
          - help
          - status
          - position
          - signal
          - backtest
          - btstatus
          - btresult

permissions:
  contents: read
  actions: read

jobs:
  telegram-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Restore latest backtest report and status
        uses: actions/cache@v4
        with:
          path: |
            backtest_last_result.json
            backtest_status.json
          key: bt-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bt-state-

      - name: Execute Telegram command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python bot.py
          else
            python telegram_commands.py "${{ inputs.command || 'help' }}"
          fi

      - name: Upload detailed backtest report
        if: always() && inputs.command == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-detailed-report
          path: |
            backtest_last_result.json
            backtest_status.json
            backtest_trades.csv
            backtest_equity.csv
          if-no-files-found: warn
          retention-days: 30
