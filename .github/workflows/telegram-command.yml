name: Telegram Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Telegram command"
        required: true
        type: choice
        options:
          - help
          - status
          - position
          - signal

permissions:
  contents: read

jobs:
  telegram-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Execute Telegram command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_commands.py "${{ inputs.command }}"
