name: Telegram Command
run-name: ${{ github.event_name == 'push' && 'Backtest trigger' || format('Telegram command {0}', inputs.command || 'help') }}

on:
  push:
    branches: [main]
    paths:
      - '.github/backtest-trigger.txt'
  workflow_dispatch:
    inputs:
      command:
        description: "Telegram command"
        required: true
        type: choice
        options:
          - help
          - status
          - position
          - signal
          - backtest
          - btstatus
          - btresult
      backtest_days:
        description: "Backtest period in days (1-365)"
        required: false
        default: "360"
        type: string
      initial_capital:
        description: "Initial capital in USDT"
        required: false
        default: "100"
        type: string
      entry_margin_pct:
        description: "Initial order margin as % of current balance"
        required: false
        default: "50"
        type: string
      dca_margin_ratio:
        description: "DCA margin as % of initial order margin"
        required: false
        default: "100"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  telegram-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Restore latest backtest report and status
        uses: actions/cache@v4
        with:
          path: |
            backtest_last_result.json
            backtest_status.json
          key: bt-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bt-state-

      - name: Execute Telegram command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTIONS_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BACKTEST_DAYS: ${{ inputs.backtest_days || '360' }}
          BACKTEST_INITIAL_CAPITAL: ${{ inputs.initial_capital || '100' }}
          ENTRY_MARGIN_PCT: ${{ inputs.entry_margin_pct || '50' }}
          DCA_MARGIN_RATIO: ${{ inputs.dca_margin_ratio || '100' }}
          BACKTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python telegram_commands.py "backtest"
          else
            python telegram_commands.py "${{ inputs.command || 'help' }}"
          fi

      - name: Upload detailed backtest report
        if: always() && (inputs.command == 'backtest' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: backtest-detailed-report
          path: |
            backtest_last_result.json
            backtest_status.json
            backtest_trades.csv
            backtest_equity.csv
            backtest_equity_m15.csv
          if-no-files-found: warn
          retention-days: 30
