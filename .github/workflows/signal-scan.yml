name: BTCUSDT Signal Scanner
run-name: BTCUSDT signal scan

on:
  schedule:
    # GitHub Actions cron uses UTC. Run every 5 minutes.
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Avoid two scans reading/writing the same cached state at once.
concurrency:
  group: btcusdt-signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Restore scanner state
        uses: actions/cache@v4
        with:
          path: state.json
          key: signal-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            signal-state-

      - name: Scan closed M15 candles and send signal notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
