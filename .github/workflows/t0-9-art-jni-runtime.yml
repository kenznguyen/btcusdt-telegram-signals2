name: T0.9.1 Android ART JNI Emulator Reliability Isolation

'on':
  push:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - "android-app/**"
      - "ci/**"
      - ".github/workflows/t0-9-art-jni-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  art-jni-runtime:
    name: ART JNI runtime API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: t0-9-art-jni-runtime-${{ github.ref }}-${{ matrix.api-level }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 33, 35]
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Download official SQLite 3.54.1 amalgamation
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip \
            --output /tmp/sqlite-amalgamation-3540100.zip

      - name: Verify and materialize pinned SQLite sources
        run: python3 ci/prepare_pinned_sqlite.py --archive /tmp/sqlite-amalgamation-3540100.zip

      - name: Assemble debug APKs before emulator startup
        working-directory: android-app
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Boot, preflight, install APKs, then invoke ART instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # API 33 remains the Google APIs control; API 26/35 use lean AOSP.
          target: ${{ matrix.api-level == 33 && 'google_apis' || 'default' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -Eeuo pipefail
            cd android-app
            prefix="../t0-9-art-jni-api-${{ matrix.api-level }}"
            mkdir -p "$prefix"
            capture_diagnostics() {
              adb logcat -b all -d -v threadtime > "$prefix-logcat.txt" 2>&1 || true
              adb shell getprop > "$prefix-getprop.txt" 2>&1 || true
              adb shell cat /proc/meminfo > "$prefix-meminfo.txt" 2>&1 || true
              adb shell df -h /data > "$prefix-data-disk.txt" 2>&1 || true
              adb get-state > "$prefix-adb-state.txt" 2>&1 || true
              date -u +'%Y-%m-%dT%H:%M:%SZ' > "$prefix-diagnostics-captured-at.txt"
            }
            trap capture_diagnostics EXIT

            echo "stage=emulator_preflight_started"
            date -u +'%Y-%m-%dT%H:%M:%SZ' | tee "$prefix-boot-started.txt"
            booted=false
            for attempt in $(seq 1 60); do
              boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              adb_state="$(adb get-state 2>/dev/null || true)"
              if [ "$boot_completed" = "1" ] && [ "$adb_state" = "device" ]; then
                booted=true
                break
              fi
              sleep 5
            done
            {
              echo "boot_completed=$boot_completed"
              echo "adb_state=$adb_state"
              echo "preflight_attempts=$attempt"
            } | tee "$prefix-preflight.txt"
            if [ "$booted" != "true" ]; then
              echo "stage=emulator_preflight_failed" | tee -a "$prefix-preflight.txt"
              exit 20
            fi
            adb shell cat /proc/meminfo > "$prefix-preinstall-meminfo.txt"
            adb shell df -h /data > "$prefix-preinstall-data-disk.txt"
            adb logcat -b all -d -v threadtime > "$prefix-preinstall-logcat.txt" 2>&1 || true
            echo "stage=apk_install_started"
            date -u +'%Y-%m-%dT%H:%M:%SZ' | tee "$prefix-install-started.txt"
            gradle :app:installDebug :app:installDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$prefix-install.log"
            date -u +'%Y-%m-%dT%H:%M:%SZ' | tee "$prefix-install-finished.txt"
            echo "stage=apk_install_completed"
            echo "stage=art_instrumentation_started"
            date -u +'%Y-%m-%dT%H:%M:%SZ' | tee "$prefix-instrumentation-started.txt"
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$prefix-instrumentation.log"
            date -u +'%Y-%m-%dT%H:%M:%SZ' | tee "$prefix-instrumentation-finished.txt"
            echo "stage=art_instrumentation_completed"

      - name: Upload boot, install, ART reports and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-9-1-art-jni-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            android-app/app/build/outputs/androidTest-results/**
            android-app/app/build/reports/androidTests/**
            t0-9-art-jni-api-${{ matrix.api-level }}-*
          if-no-files-found: warn
          retention-days: 14
