name: T0.9 Android ART JNI Runtime Verification

'on':
  push:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - "android-app/**"
      - "ci/**"
      - ".github/workflows/t0-9-art-jni-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  art-jni-runtime:
    name: ART JNI runtime API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: t0-9-art-jni-runtime-${{ github.ref }}-${{ matrix.api-level }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 33, 35]
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Download official SQLite 3.54.1 amalgamation
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip \
            --output /tmp/sqlite-amalgamation-3540100.zip

      - name: Verify and materialize pinned SQLite sources
        run: python3 ci/prepare_pinned_sqlite.py --archive /tmp/sqlite-amalgamation-3540100.zip

      - name: Run instrumentation on Android ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android-app
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload ART instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-9-art-jni-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            android-app/app/build/outputs/androidTest-results/**
            android-app/app/build/reports/androidTests/**
            android-app/app/build/outputs/apk/androidTest/**
          if-no-files-found: warn
          retention-days: 14
