name: P5.3.10.5 G1 Gateway GREEN verification

on:
  workflow_call:
  pull_request:
    branches:
      - feature/p5-3-10-4-g1-red-tests-20261103
    paths:
      - market_data/gateway.py
      - market_data/test_gateway_runtime.py
      - .github/workflows/p5-3-10-5-g1-green-validation.yml

permissions:
  contents: read

concurrency:
  group: p5-3-10-5-g1-green-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  isolated-g1-green:
    name: Isolated SQLite G1 GREEN acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
      AI_EXECUTION_ENABLED: "false"
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact caller source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee g1-green-source-sha.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Compile Gateway and acceptance tests
        run: python -m py_compile market_data/gateway.py market_data/test_gateway_runtime.py

      - name: Execute G1 GREEN acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest market_data.test_gateway_runtime -v 2>&1 | tee g1-green-test.log
          echo "RESULT=PASS_G1_GREEN" | tee g1-green-summary.txt

      - name: Upload G1 GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-3-10-5-g1-green-evidence-${{ github.run_id }}
          path: |
            g1-green-source-sha.txt
            g1-green-test.log
            g1-green-summary.txt
          if-no-files-found: warn
          retention-days: 30
