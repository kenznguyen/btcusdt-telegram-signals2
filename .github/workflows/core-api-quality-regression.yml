name: Core API quality snapshot regression

on:
  push:
    branches:
      - main
    paths:
      - "pipeline/api.py"
      - "core_runtime/test_api_facade.py"
      - ".github/workflows/core-api-quality-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-api-quality-regression-main
  cancel-in-progress: false

jobs:
  quality-snapshot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-web.txt

      - name: Enforce paper-only test environment
        shell: bash
        run: |
          set -euo pipefail
          test "${AI_EXECUTION_ENABLED}" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unexpected persistent DB or credential environment: ${key}"
              exit 1
            fi
          done
          git rev-parse HEAD | tee source-sha.txt
          echo "PAPER_ONLY=PASS" | tee safety-status.txt

      - name: Compile Core API and regression test
        run: |
          set -euo pipefail
          python -m py_compile pipeline/api.py core_runtime/test_api_facade.py
          echo "PY_COMPILE=PASS" | tee compile-status.txt

      - name: Run quality snapshot regression
        shell: bash
        run: |
          set -uo pipefail
          python -m unittest core_runtime.test_api_facade.CoreApiFacadeTest.test_quality_projection_uses_bundle_preview_and_t1_book_evidence -v 2>&1 | tee quality-snapshot-regression.log
          status=${PIPESTATUS[0]}
          echo "QUALITY_SNAPSHOT_TEST_EXIT=${status}" | tee quality-snapshot-test-status.txt
          exit "${status}"

      - name: Upload exact-source test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-quality-regression-${{ github.sha }}
          path: |
            source-sha.txt
            safety-status.txt
            compile-status.txt
            quality-snapshot-regression.log
            quality-snapshot-test-status.txt
          if-no-files-found: warn
          retention-days: 30
