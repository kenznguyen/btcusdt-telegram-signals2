name: Android APK

on:
  # Manual Android build and release verification.
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test debug APK
        working-directory: android-app
        run: gradle testDebugUnitTest assembleDebug
      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify release signing identity\n        if: env.HAS_RELEASE_KEY == 'true'\n        env:\n          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}\n        run: |\n          test \"$ANDROID_KEY_ALIAS\" = \"btc-chart-release\"\n          keytool -list -v -keystore \"$RUNNER_TEMP/release.keystore\" -alias \"$ANDROID_KEY_ALIAS\" -storepass \"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\" | grep -E 'SHA256:|Alias name:'\n          \"$ANDROID_HOME/build-tools/35.0.0/apksigner\" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk\n      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-live-alerts-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-live-alerts-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
