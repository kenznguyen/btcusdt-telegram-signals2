name: Android T0 Foundation Tests

'on':
  push:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - "android-app/**"
      - "ci/**"
      - ".github/workflows/android-t0-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-t0-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundation:
    name: Canonical identity and read-only schema contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Download official SQLite 3.54.1 amalgamation
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip \
            --output /tmp/sqlite-amalgamation-3540100.zip

      - name: Verify and materialize pinned SQLite sources
        run: python3 ci/prepare_pinned_sqlite.py --archive /tmp/sqlite-amalgamation-3540100.zip

      - name: Compile and link native SQLite JNI library (debug only)
        working-directory: android-app
        run: gradle :app:externalNativeBuildDebug --no-daemon --stacktrace

      - name: Run regular host unit tests (no APK assembly or signing)
        working-directory: android-app
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run parallel .paper client unit tests (no APK assembly or signing)
        working-directory: android-app
        run: gradle :app:testParallelUnitTest --no-daemon --stacktrace

      - name: Run pinned SQLite preparation unit tests
        run: python3 -m unittest ci.tests.test_prepare_pinned_sqlite -v

      - name: Run Android T0 foundation static audit
        run: python3 ci/check_android_t0_foundation.py

      - name: Upload native build outputs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-sqlite-debug-${{ github.sha }}
          path: |
            android-app/app/.cxx/**/obj/**/*.so
            android-app/app/build/intermediates/cxx/**/obj/**/*.so
            android-app/app/build/test-results/testDebugUnitTest/**
            android-app/app/build/test-results/testParallelUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fixture test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-t0-foundation-${{ github.sha }}
          path: |
            android-app/app/build/test-results/testDebugUnitTest/**
            android-app/app/build/reports/tests/testDebugUnitTest/**
            android-app/app/build/test-results/testParallelUnitTest/**
            android-app/app/build/reports/tests/testParallelUnitTest/**
          if-no-files-found: warn
          retention-days: 14
