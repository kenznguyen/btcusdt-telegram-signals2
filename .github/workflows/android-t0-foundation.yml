name: Android T0 Foundation Tests

'on':
  push:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - "android-app/**"
      - "ci/check_android_t0_foundation.py"
      - ".github/workflows/android-t0-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-t0-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundation:
    name: CanonicalRuntime and path-authority fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - name: Run Android unit tests (no APK assembly or signing)
        working-directory: android-app
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android T0 foundation static audit
        run: python3 ci/check_android_t0_foundation.py

      - name: Upload fixture test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-t0-foundation-${{ github.sha }}
          path: |
            android-app/app/build/test-results/testDebugUnitTest/**
            android-app/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
