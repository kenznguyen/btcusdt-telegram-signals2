name: Android T0 Foundation — GitHub Actions

'on':
  pull_request:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - "android-app/**"
      - "ci/**"
      - ".github/workflows/android-t0-foundation-github-actions.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character commit SHA to verify (blank uses PR head or selected ref SHA)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-t0-foundation-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

jobs:
  foundation:
    name: Android T0 acceptance gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Resolve exact source SHA
        id: source
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${INPUT_SOURCE_SHA:-${PR_HEAD_SHA:-$EVENT_SHA}}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$AI_EXECUTION_ENABLED" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            test -z "${!key:-}"
          done
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Record source provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$SOURCE_SHA"
          {
            echo "requested_source_sha=$SOURCE_SHA"
            echo "actual_source_sha=$ACTUAL_SOURCE_SHA"
            echo "event_sha=${{ github.sha }}"
            echo "event_name=${{ github.event_name }}"
            echo "event_ref=${{ github.ref }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "ai_execution_enabled=$AI_EXECUTION_ENABLED"
          } | tee ci-evidence/source-provenance.txt

      - name: Set up Python for CI policy tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run CI policy regression tests on exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python -m unittest ci.test_ci_policy -v 2>&1 | tee ci-evidence/ci-policy-tests.log

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Create evidence directory
        run: mkdir -p ci-evidence

      - name: Download official SQLite 3.54.1 amalgamation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip \
            --output /tmp/sqlite-amalgamation-3540100.zip

      - name: Verify and materialize pinned SQLite sources
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/prepare_pinned_sqlite.py --archive /tmp/sqlite-amalgamation-3540100.zip 2>&1 | tee ci-evidence/sqlite-pinning.log

      - name: Build and run isolated native SQLite D5 tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android-app/app/src/main/cpp/tests -B /tmp/t0.6-native-d5-tests \
            -DSQLITE_AMALGAMATION_DIR="$GITHUB_WORKSPACE/android-app/app/build/generated/sqlite/vendor"
          cmake --build /tmp/t0.6-native-d5-tests --parallel 2
          ctest --test-dir /tmp/t0.6-native-d5-tests --output-on-failure 2>&1 | tee ci-evidence/native-ctest.log
          mkdir -p android-app/app/build/t0.6
          cp /tmp/t0.6-native-d5-tests/d5-native-memory-fixture.bin android-app/app/build/t0.6/

      - name: Compile and link native SQLite JNI library (debug only)
        working-directory: android-app
        shell: bash
        run: gradle :app:externalNativeBuildDebug --no-daemon --stacktrace 2>&1 | tee ../ci-evidence/jni-build.log

      - name: Run regular host unit tests (no APK assembly or signing)
        working-directory: android-app
        shell: bash
        run: gradle :app:testDebugUnitTest -Pd5NativeFixture=build/t0.6/d5-native-memory-fixture.bin --no-daemon --stacktrace 2>&1 | tee ../ci-evidence/jvm-regular.log

      - name: Run parallel .paper client unit tests (no APK assembly or signing)
        working-directory: android-app
        shell: bash
        run: gradle :app:testParallelUnitTest -Pd5NativeFixture=build/t0.6/d5-native-memory-fixture.bin --no-daemon --stacktrace 2>&1 | tee ../ci-evidence/jvm-paper.log

      - name: Run pinned SQLite preparation unit tests
        shell: bash
        run: python3 -m unittest ci.tests.test_prepare_pinned_sqlite -v 2>&1 | tee ci-evidence/sqlite-preparation-tests.log

      - name: Run Android T0 foundation static audit
        shell: bash
        run: python3 ci/check_android_t0_foundation.py 2>&1 | tee ci-evidence/android-t0-static-audit.log

      - name: Upload Android T0 evidence and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-t0-foundation-${{ steps.source.outputs.sha }}
          path: |
            ci-evidence/**
            android-app/app/.cxx/**/obj/**/*.so
            android-app/app/build/intermediates/cxx/**/obj/**/*.so
            android-app/app/build/test-results/testDebugUnitTest/**
            android-app/app/build/reports/tests/testDebugUnitTest/**
            android-app/app/build/test-results/testParallelUnitTest/**
            android-app/app/build/reports/tests/testParallelUnitTest/**
            android-app/app/build/t0.6/d5-native-memory-fixture.bin
          if-no-files-found: warn
          retention-days: 14
