name: T2 Legacy Paper Regression

on:
  push:
    branches:
      - feature/dual-strategy-phase22-preholdout-attestation-20261031
    paths:
      - "quant_system/dual_strategy.py"
      - "quant_system/paper_bridge.py"
      - "quant_system/test_dual_strategy_phase2.py"
      - "quant_system/test_phase3_paper_bridge.py"
      - "paper_execution/**"
      - "quant_system/dual_ledger.py"
      - "quant_system/test_dual_ledger_contract.py"
      - ".github/workflows/t2-legacy-paper-regression.yml"
  pull_request:
    paths:
      - "quant_system/dual_strategy.py"
      - "quant_system/paper_bridge.py"
      - "quant_system/test_dual_strategy_phase2.py"
      - "quant_system/test_phase3_paper_bridge.py"
      - "paper_execution/**"
      - "quant_system/dual_ledger.py"
      - "quant_system/test_dual_ledger_contract.py"
      - ".github/workflows/t2-legacy-paper-regression.yml"

permissions:
  contents: read

jobs:
  legacy-paper-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run existing Dual Strategy Phase 2 regression
        run: python -m unittest quant_system.test_dual_strategy_phase2 -v
      - name: Run existing Phase 3 paper bridge regression
        run: python -m unittest quant_system.test_phase3_paper_bridge -v
      - name: Run paper execution ledger regression
        run: python -m unittest paper_execution.test_ledger -v
