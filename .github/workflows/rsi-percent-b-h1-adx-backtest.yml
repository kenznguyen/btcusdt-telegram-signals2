name: RSI %b H1 ADX Backtest
run-name: RSI %b H1 ADX · ${{ inputs.backtest_days || '180' }} days

on:
  workflow_dispatch:
    inputs:
      backtest_days:
        description: "Backtest period (1-365 days)"
        required: true
        default: "180"
        type: string
      initial_capital:
        description: "Initial capital in USDT"
        required: true
        default: "1000"
        type: string
      margin_pct:
        description: "Margin per trade as % of current balance"
        required: true
        default: "10"
        type: string
      leverage:
        description: "Leverage multiplier (start with 1 for unlevered comparison)"
        required: true
        default: "1"
        type: string
      adx_min:
        description: "Minimum H1 ADX"
        required: true
        default: "20"
        type: string
      fee_rate:
        description: "Taker fee rate per side (0.0005 = 0.05%)"
        required: true
        default: "0.0005"
        type: string
      slippage_ticks:
        description: "Slippage in ticks per side"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: rsi-percent-b-h1-adx-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run backtest
        env:
          BACKTEST_DAYS: ${{ inputs.backtest_days }}
          INITIAL_CAPITAL: ${{ inputs.initial_capital }}
          MARGIN_PCT: ${{ inputs.margin_pct }}
          LEVERAGE: ${{ inputs.leverage }}
          H1_ADX_MIN: ${{ inputs.adx_min }}
          TAKER_FEE_RATE: ${{ inputs.fee_rate }}
          SLIPPAGE_TICKS: ${{ inputs.slippage_ticks }}
        run: python backtest_rsi_percent_b_h1_adx.py
      - name: Upload backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-percent-b-h1-adx-${{ inputs.backtest_days }}d
          path: rsi_percent_b_backtest/
          if-no-files-found: error
          retention-days: 30
