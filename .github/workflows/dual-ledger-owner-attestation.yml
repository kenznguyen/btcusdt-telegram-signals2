name: Dual Ledger manual Owner attestation contract

on:
  push:
    branches:
      - feature/core-operational-proof-20261112
    paths:
      - "paper_execution/owner_attestation.py"
      - "paper_execution/test_dual_ledger_owner_attestation.py"
      - "paper_execution/bootstrap.py"
      - "paper_execution/test_dual_ledger_bootstrap.py"
      - "paper_execution/__main__.py"
      - ".github/workflows/dual-ledger-owner-attestation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-ledger-owner-attestation
  cancel-in-progress: false

jobs:
  disposable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-web.txt

      - name: Enforce disposable paper-only environment
        shell: bash
        run: |
          set -euo pipefail
          test "${AI_EXECUTION_ENABLED}" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unexpected persistent DB or credential environment: ${key}"
              exit 1
            fi
          done
          git rev-parse HEAD | tee dual-ledger-attestation-source-sha.txt

      - name: Compile attestation and bootstrap modules
        run: |
          set -euo pipefail
          python -m py_compile paper_execution/owner_attestation.py paper_execution/test_dual_ledger_owner_attestation.py paper_execution/bootstrap.py paper_execution/test_dual_ledger_bootstrap.py paper_execution/__main__.py

      - name: Run manual Owner attestation contract tests
        run: |
          set -euo pipefail
          python -m unittest paper_execution.test_dual_ledger_owner_attestation -v 2>&1 | tee dual-ledger-owner-attestation-tests.log

      - name: Run bootstrap and full PaperLedger regression
        run: |
          set -euo pipefail
          python -m unittest paper_execution.test_dual_ledger_bootstrap -v 2>&1 | tee dual-ledger-bootstrap-tests.log
          python -m unittest discover -s paper_execution -p "test_*.py" -v 2>&1 | tee paper-execution-regression.log

      - name: Upload exact-source disposable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-ledger-owner-attestation-proof-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            dual-ledger-attestation-source-sha.txt
            dual-ledger-owner-attestation-tests.log
            dual-ledger-bootstrap-tests.log
            paper-execution-regression.log
