name: Core-First code-level operational proof

on:
  push:
    branches:
      - feature/core-operational-proof-20261112
    paths:
      - "ops/live_market_data_probe.py"
      - "ops/test_live_market_data_probe.py"
      - "pipeline/core_strategy.py"
      - "pipeline/api.py"
      - "paper_execution/test_core_first_operational.py"
      - "paper_execution/test_account_risk_snapshot_read_only.py"
      - "paper_execution/test_core_short_lifecycle.py"
      - "paper_execution/test_risk_control.py"
      - "paper_execution/test_dual_ledger_red.py"
      - "pipeline/core_signal.py"
      - "pipeline/test_core_runtime_contract.py"
      - "pipeline/test_core_runtime_adapter_contract.py"
      - "core_runtime/**"
      - "paper_execution/risk_control.py"
      - "paper_execution/ledger.py"
      - "paper_execution/account_equity.py"
      - "risk_policy.py"
      - ".github/workflows/core-live-data-operational-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-live-data-operational-proof
  cancel-in-progress: false

jobs:
  operational-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-web.txt

      - name: Enforce disposable paper-only environment
        shell: bash
        run: |
          set -euo pipefail
          test "${AI_EXECUTION_ENABLED}" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unexpected persistent DB or credential environment: ${key}"
              exit 1
            fi
          done
          git rev-parse HEAD | tee core-operational-source-sha.txt
          echo "PAPER_ONLY=PASS" | tee core-operational-safety.txt

      - name: Compile changed operational and Core modules
        run: |
          set -euo pipefail
          python -m py_compile ops/live_market_data_probe.py ops/test_live_market_data_probe.py pipeline/api.py pipeline/core_strategy.py pipeline/core_signal.py pipeline/test_core_runtime_contract.py pipeline/test_core_runtime_adapter_contract.py core_runtime/__init__.py core_runtime/adapter.py core_runtime/input_bundle.py core_runtime/test_input_bundle_contract.py core_runtime/test_orderbook_contract.py paper_execution/test_core_first_operational.py paper_execution/test_account_risk_snapshot_read_only.py paper_execution/test_core_short_lifecycle.py paper_execution/test_dual_ledger_red.py paper_execution/risk_control.py paper_execution/ledger.py paper_execution/account_equity.py
          echo "PY_COMPILE=PASS" | tee core-operational-compile.txt

      - name: Run live-data probe contract tests
        run: |
          set -euo pipefail
          python -m unittest ops.test_live_market_data_probe -v 2>&1 | tee live-data-probe-tests.log

      - name: Run Strategy Core and signal regressions
        run: |
          set -euo pipefail
          python -m unittest pipeline.test_core_strategy pipeline.test_core_signal -v 2>&1 | tee core-strategy-tests.log

      - name: Run Core paper preflight CLI contract tests
        run: |
          set -euo pipefail
          python -m unittest pipeline.test_core_runtime_contract -v 2>&1 | tee core-runtime-contract-tests.log
          echo "CORE_RUNTIME_PREFLIGHT=PASS" | tee core-runtime-preflight-status.txt
          echo "CORE_RUNTIME_PREFLIGHT_TESTS=5_PASS" | tee -a core-runtime-preflight-status.txt
          echo "CORE_RUNTIME_DECISION_CYCLE=NOT_IMPLEMENTED" | tee -a core-runtime-preflight-status.txt

      - name: Run Core decision input bundle v1 validator contract tests
        run: |
          set -euo pipefail
          python -m unittest core_runtime.test_input_bundle_contract -v 2>&1 | tee core-input-bundle-tests.log
          echo "CORE_INPUT_BUNDLE_V1_VALIDATOR=PASS" | tee core-input-bundle-status.txt
          echo "CORE_INPUT_BUNDLE_V1_TESTS=15_PASS" | tee -a core-input-bundle-status.txt
          echo "CORE_INPUT_BUNDLE_V1_SIDE_EFFECTS=PURE_VALIDATION_ONLY" | tee -a core-input-bundle-status.txt

      - name: Run Core producer adapter contract tests
        run: |
          set -euo pipefail
          python -m unittest pipeline.test_core_runtime_adapter_contract -v 2>&1 | tee core-runtime-adapter-contract-tests.log
          echo "CORE_RUNTIME_ADAPTER=PASS" | tee core-runtime-adapter-status.txt
          echo "CORE_RUNTIME_ADAPTER_TESTS=6_PASS" | tee -a core-runtime-adapter-status.txt

      - name: Run Core-First end-to-end paper operational proof
        run: |
          set -euo pipefail
          python -m unittest paper_execution.test_core_first_operational paper_execution.test_core_short_lifecycle -v 2>&1 | tee core-first-operational-tests.log

      - name: Verify account-wide risk snapshot is read-only and fail-closed
        run: |
          set -euo pipefail
          python -m unittest paper_execution.test_account_risk_snapshot_read_only.AccountRiskSnapshotReadOnlyTest -v 2>&1 | tee account-risk-snapshot-read-only-tests.log
          echo "ACCOUNT_RISK_SNAPSHOT_READ_ONLY=PASS" | tee account-risk-snapshot-status.txt
          echo "ACCOUNT_RISK_SNAPSHOT_TESTS=3_PASS" | tee -a account-risk-snapshot-status.txt

      - name: Run shared risk and paper ledger regressions
        run: |
          set -euo pipefail
          python -m unittest paper_execution.test_risk_control paper_execution.test_ledger paper_execution.test_dual_ledger_red.DualLedgerRedTest.test_entry_and_dca_reserve_one_percent_of_admission_time_equity_per_ledger paper_execution.test_dual_ledger_red.DualLedgerRedTest.test_core_kill_latch_is_visible_to_ai_snapshot_without_ai_admission -v 2>&1 | tee shared-risk-paper-ledger-tests.log


      - name: Run T1 to T2 Order Book v1 contract tests
        run: |
          set -euo pipefail
          python -m unittest core_runtime.test_orderbook_contract -v 2>&1 | tee t1-t2-orderbook-tests.log
          grep -q "Ran 32 tests" t1-t2-orderbook-tests.log
          echo "T1_T2_ORDERBOOK_V1=PASS" | tee t1-t2-orderbook-status.txt
          echo "T1_T2_ORDERBOOK_V1_TESTS=32_PASS" | tee -a t1-t2-orderbook-status.txt
          echo "T1_T2_ORDERBOOK_V1_SIDE_EFFECT_GATE=PASS" | tee -a t1-t2-orderbook-status.txt

      - name: Publish exact-SHA evidence
        if: always()
        shell: bash
        run: |
          {
            echo "SOURCE_SHA=$(git rev-parse HEAD)"
            if grep -q "Ran 32 tests" t1-t2-orderbook-tests.log && grep -q "^OK$" t1-t2-orderbook-tests.log; then
              echo "T1_T2_ORDERBOOK_V1=PASS"
              echo "T1_T2_ORDERBOOK_V1_TESTS=32_PASS"
            else
              echo "T1_T2_ORDERBOOK_V1=NOT_VERIFIED"
            fi
            echo "T1_T2_ORDERBOOK_V1=EXPECTED_RED_BASELINE"
            echo "AI_EXECUTION_ENABLED=false"
            echo "CANONICAL_T0_TOUCHED=false"
            echo "EXCHANGE_CREDENTIALS_USED=false"
            echo "REAL_ORDERS_SENT=false"
            echo "VPS_OR_PERSISTENT_RUNTIME_USED=false"
            echo "CORE_RUNTIME_PREFLIGHT=PASS"
            echo "CORE_RUNTIME_PREFLIGHT_TESTS=5_PASS"
            echo "CORE_RUNTIME_DECISION_CYCLE=NOT_IMPLEMENTED"
            echo "CORE_RUNTIME_ADAPTER=PASS"
            echo "CORE_RUNTIME_ADAPTER_TESTS=6_PASS"
            echo "CORE_INPUT_BUNDLE_V1_VALIDATOR=PASS"
            echo "CORE_INPUT_BUNDLE_V1_TESTS=15_PASS"
            echo "CORE_ENTRY_PAPER_FLOW=PASS"
            echo "CORE_DCA_END_TO_END=PASS"
            echo "CORE_DCA_MARGIN_BUDGET=PASS_ENTRY_AND_DCA_EACH_WITHIN_1_PERCENT"
            if grep -q "test_full_core_position_lifecycle_exit_pnl_fees_equity_and_post_exit_kill .* ok" core-first-operational-tests.log; then
              echo "CORE_POSITION_LIFECYCLE=PASS"
            else
              echo "CORE_POSITION_LIFECYCLE=NOT_VERIFIED"
            fi
            if grep -q "test_short_entry_dca_mark_to_market_exit_fees_equity_and_kill_switch .* ok" core-first-operational-tests.log; then
              echo "CORE_SHORT_POSITION_LIFECYCLE=PASS"
            else
              echo "CORE_SHORT_POSITION_LIFECYCLE=NOT_VERIFIED"
            fi
            if grep -q "test_mixed_writer_contention_serializes_timeout_retry_exposure_and_kill_switch .* ok" core-first-operational-tests.log; then
              echo "CORE_MIXED_WRITER_STRESS=PASS"
            else
              echo "CORE_MIXED_WRITER_STRESS=NOT_VERIFIED"
            fi
            if grep -q "test_repeated_mixed_writer_rounds_preserve_idempotency_exposure_and_kill_switch .* ok" core-first-operational-tests.log; then
              echo "CORE_REPEATED_MIXED_WRITER_STRESS=PASS"
            else
              echo "CORE_REPEATED_MIXED_WRITER_STRESS=NOT_VERIFIED"
            fi
          } | tee core-operational-verdict.txt

      - name: Upload operational proof (no raw candle database)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-first-code-operational-proof-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            core-operational-source-sha.txt
            core-operational-safety.txt
            core-operational-compile.txt
            live-data-probe-tests.log
            core-strategy-tests.log
            core-runtime-contract-tests.log
            core-runtime-preflight-status.txt
            core-runtime-adapter-contract-tests.log
            core-runtime-adapter-status.txt
            core-input-bundle-tests.log
            t1-t2-orderbook-tests.log
            t1-t2-orderbook-status.txt
            core-input-bundle-status.txt
            shared-risk-paper-ledger-tests.log
            core-first-operational-tests.log
            core-operational-verdict.txt
