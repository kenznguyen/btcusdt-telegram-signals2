name: Cross-layer Integration
run-name: Cross-layer Integration (${{ github.ref_name }} @ ${{ github.event.pull_request.head.sha || github.sha }})

'on':
  pull_request:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - "integrations/**"
      - "futures_intelligence/**"
      - "pipeline/**"
      - "paper_execution/**"
      - "freqai_bridge/**"
      - "requirements*.txt"
      - ".github/workflows/cross-layer-integration.yml"
  push:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - "integrations/**"
      - "futures_intelligence/**"
      - "pipeline/**"
      - "paper_execution/**"
      - "freqai_bridge/**"
      - "requirements*.txt"
      - ".github/workflows/cross-layer-integration.yml"

permissions:
  contents: read

concurrency:
  group: cross-layer-integration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements.txt
            requirements-web.txt
            requirements-ci.txt
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-market-data.txt -r requirements.txt -r requirements-web.txt -r requirements-ci.txt
      - name: Enforce paper-only environment and record source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$AI_EXECUTION_ENABLED" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            test -z "${!key:-}"
          done
          git rev-parse HEAD | tee cross-layer-source-sha.txt
      - name: Compile cross-layer modules
        run: python -m compileall -q integrations futures_intelligence pipeline paper_execution freqai_bridge ci
      - name: Run integrations tests
        run: python -m unittest discover -s integrations -p 'test_*.py' -v 2>&1 | tee cross-layer-integrations-tests.log
      - name: Run futures intelligence and paper system tests
        run: |
          python -m unittest \
            futures_intelligence.test_import_collector \
            pipeline.test_decision pipeline.test_api pipeline.test_core_signal pipeline.test_core_strategy \
            paper_execution.test_ledger paper_execution.test_risk_control paper_execution.test_equity \
            freqai_bridge.test_exporter -v 2>&1 | tee cross-layer-paper-tests.log
      - name: Run CI workflow policy regressions
        run: python -m unittest ci.test_ci_policy -v 2>&1 | tee ci-policy-tests.log
      - name: Upload exact-SHA integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-layer-integration-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            cross-layer-source-sha.txt
            cross-layer-integrations-tests.log
            cross-layer-paper-tests.log
            ci-policy-tests.log
          retention-days: 30
