name: T2 HTTP Candle Consumer Tests

on:
  push:
    branches:
      - feature/t0-centralized-data-feeder-p1-20261101
    paths:
      - "freqai_bridge/http_candles.py"
      - "freqai_bridge/context.py"
      - "freqai_bridge/ChartProFreqaiResearch.py"
      - "freqai_bridge/test_http_candles.py"
      - "freqai_bridge/test_context_http.py"
      - "freqai_bridge/test_exporter.py"
      - "freqai_bridge/exporter.py"
      - "freqai_bridge/t2_http_migration_acceptance.py"
      - "pipeline/decision.py"
      - "pipeline/values.py"
      - "freqai_bridge/config.research.json"
      - ".github/workflows/t2-http-consumer-red.yml"

permissions:
  contents: read

concurrency:
  group: t2-http-consumer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  t2-http-adapter:
    name: Verify T2 HTTP candle adapter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MARKET_DATA_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
      AI_EXECUTION_ENABLED: "false"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.32.0,<3" "pandas>=2.2,<3"

      - name: Enforce isolated paper-only test environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${MARKET_DATA_DB}"
          test -z "${PAPER_DB}"
          test -z "${BINANCE_API_KEY}"
          test -z "${BINANCE_API_SECRET}"
          test -z "${OKX_API_KEY}"
          test -z "${OKX_API_SECRET}"
          test "${AI_EXECUTION_ENABLED}" = "false"
          echo "T2_HTTP_GREEN_PREFLIGHT=PASS"
          echo "T2_HTTP_GREEN_SOURCE_SHA=$(git rev-parse HEAD)" | tee t2-http-source-sha.txt

      - name: Compile adapter and test modules
        run: |
          set -euo pipefail
          python -m py_compile freqai_bridge/http_candles.py freqai_bridge/context.py freqai_bridge/ChartProFreqaiResearch.py freqai_bridge/test_http_candles.py freqai_bridge/test_context_http.py freqai_bridge/t2_http_migration_acceptance.py
          echo "T2_HTTP_GREEN_COMPILE=PASS" | tee t2-http-compile.log

      - name: Run HTTP adapter behavior tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest freqai_bridge.test_http_candles -v 2>&1 | tee t2-http-tests.log
          grep -Eq "^Ran 45 tests?" t2-http-tests.log
          grep -Eq "^OK$" t2-http-tests.log
          echo "T2_HTTP_GREEN=PASS"
          echo "T2_HTTP_GREEN_TESTS=45"

      - name: Run HTTP context and migration acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest freqai_bridge.test_context_http freqai_bridge.t2_http_migration_acceptance -v 2>&1 | tee t2-migration-tests.log
          grep -Eq "^Ran 10 tests?" t2-migration-tests.log
          grep -Eq "^OK$" t2-migration-tests.log
          echo "T2_HTTP_CONSUMER_MIGRATION=PASS"
          echo "T2_HTTP_MIGRATION_TESTS=10"
      - name: Run HTTP-backed prediction exporter regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest freqai_bridge.test_exporter -v 2>&1 | tee t2-exporter-tests.log
          grep -Eq "^Ran 6 tests?" t2-exporter-tests.log
          grep -Eq "^OK$" t2-exporter-tests.log
          echo "T2_HTTP_EXPORTER_REGRESSION=PASS"
      - name: Upload exact-SHA adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-http-adapter-${{ github.sha }}
          if-no-files-found: error
          path: |
            t2-http-source-sha.txt
            t2-http-compile.log
            t2-http-tests.log
            t2-migration-tests.log
            t2-exporter-tests.log
