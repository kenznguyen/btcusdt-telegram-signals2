name: T2 HTTP Consumer RED Contracts

on:
  push:
    branches:
      - feature/t0-centralized-data-feeder-p1-20261101
    paths:
      - "freqai_bridge/test_http_candles.py"
      - ".github/workflows/t2-http-consumer-red.yml"

permissions:
  contents: read

concurrency:
  group: t2-http-consumer-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  t2-http-consumer-red:
    name: Confirm T2 HTTP migration contract gaps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MARKET_DATA_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
      AI_EXECUTION_ENABLED: "false"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce isolated paper-only test environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${MARKET_DATA_DB}"
          test -z "${PAPER_DB}"
          test -z "${BINANCE_API_KEY}"
          test -z "${BINANCE_API_SECRET}"
          test -z "${OKX_API_KEY}"
          test -z "${OKX_API_SECRET}"
          test "${AI_EXECUTION_ENABLED}" = "false"
          echo "T2_HTTP_RED_PREFLIGHT=PASS"
          echo "T2_HTTP_RED_SOURCE_SHA=$(git rev-parse HEAD)" | tee t2-http-red-source-sha.txt

      - name: Compile RED contract tests
        run: |
          set -euo pipefail
          python -m py_compile freqai_bridge/test_http_candles.py
          echo "T2_HTTP_RED_COMPILE=PASS" | tee t2-http-red-compile.log

      - name: Confirm expected RED gaps without masking unexpected results
        shell: bash
        run: |
          set +e
          python -m unittest freqai_bridge.test_http_candles -v > t2-http-red-tests.log 2>&1
          test_status=$?
          set -e
          cat t2-http-red-tests.log
          python - <<'PY'
          import re
          from pathlib import Path

          output = Path("t2-http-red-tests.log").read_text(encoding="utf-8")
          expected_failures = {
              "test_http_adapter_module_exists",
              "test_context_does_not_import_t0_store",
              "test_context_does_not_call_t0_read_window",
              "test_strategy_does_not_accept_canonical_db_path",
              "test_strategy_does_not_pass_database_to_canonical_context",
          }
          failures = set(re.findall(r"^FAIL: (test_[^(]+)", output, re.MULTILINE))
          errors = re.findall(r"^ERROR: (test_[^(]+)", output, re.MULTILINE)
          ran = re.findall(r"^Ran (\\d+) tests?", output, re.MULTILINE)
          summary = re.search(r"^FAILED \\(failures=(\\d+)\\)$", output, re.MULTILINE)
          passed_policy = (
              "test_approved_freshness_formula_is_present_in_contract_plan" in output
              and "test_transport_limits_are_recorded_in_contract_plan" in output
          )
          print(f"T2_HTTP_RED_TESTS_RAN={ran[-1] if ran else 'UNKNOWN'}")
          print(f"T2_HTTP_RED_EXPECTED_FAILURES={len(failures)}")
          print(f"T2_HTTP_RED_UNEXPECTED_ERRORS={len(errors)}")
          if (
              len(ran) != 1
              or ran[-1] != "7"
              or failures != expected_failures
              or errors
              or not summary
              or summary.group(1) != "5"
              or not passed_policy
          ):
              print("T2_HTTP_RED=INVALID")
              raise SystemExit(1)
          print("T2_HTTP_RED=CONFIRMED_ARCHITECTURE_GAPS")
          print("T2_HTTP_POLICY_ASSERTIONS=PASS")
          PY

      - name: Upload exact-SHA RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-http-consumer-red-${{ github.sha }}
          if-no-files-found: error
          path: |
            t2-http-red-source-sha.txt
            t2-http-red-compile.log
            t2-http-red-tests.log
