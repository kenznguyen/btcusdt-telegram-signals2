name: P5.3.11.5 - G2 Writer Routing RED
run-name: G2 RED validation (${{ github.ref_name }} @ ${{ github.sha }})

on:
  push:
    branches:
      - feature/p5-3-11-5-g2-red-tests-20261103
    paths:
      - "market_data/test_g2_writer_routing.py"
      - "market_data/**"
      - "ci/test_ci_policy.py"
      - ".github/workflows/p5-3-11-5-g2-red-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-3-11-5-g2-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  g2-red:
    name: G2 RED contracts (isolated shadow-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-market-data.txt -r requirements-ci.txt

      - name: Enforce isolated environment
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unsafe environment variable present: $key"
              exit 1
            fi
          done
          echo "ISOLATED_SHADOW_ONLY=PASS" | tee g2-isolation-verdict.txt
          git rev-parse HEAD | tee g2-source-sha.txt

      - name: Compile G2 RED test module
        run: python -m py_compile market_data/test_g2_writer_routing.py

      - name: Execute and classify expected RED
        shell: bash
        run: |
          set +e
          python -m unittest market_data.test_g2_writer_routing -v 2>&1 | tee g2-red-tests.log
          status=${PIPESTATUS[0]}
          set -e
          echo "EXIT_STATUS=$status" | tee g2-test-status.txt
          expected_failures="$(printf '%s\n' \
            test_g2_01_sync_window_requires_gateway_parameter \
            test_g2_02_sync_window_requires_lease_fence_parameter \
            test_g2_03_sync_window_requires_separate_lease_clock \
            test_g2_04_sync_window_routes_through_gateway_insert_batch \
            test_g2_05_feeder_passes_typed_lease_capability_to_gateway_path \
            test_g2_08_recovery_builder_uses_gateway_backed_sync_callback \
            test_g2_09_cli_sync_requires_explicit_lease_capability \
            test_g2_10_legacy_unfenced_store_insert_is_not_called_by_sync \
            test_g2_11_legacy_insert_fenced_is_not_an_alternate_sync_route \
            test_g2_12_runtime_lease_and_writer_paths_do_not_create_schema \
            test_g2_18_postgres_backend_is_not_available_to_canonical_sync_cli \
            | sort)"
          actual_failures="$(awk '/^FAIL: test_g2_/ {print $2}' g2-red-tests.log | sort)"
          if [[ "$status" -ne 0 ]] \
             && grep -q "Ran 18 tests" g2-red-tests.log \
             && grep -q "FAILED (failures=11)" g2-red-tests.log \
             && [[ "$actual_failures" == "$expected_failures" ]] \
             && ! grep -Eq "errors=|skipped=" g2-red-tests.log; then
            echo "EXPECTED_RED=11_NAMED_CONTRACT_FAILURES_7_BUSINESS_AND_REGRESSION_PASSES_ZERO_ERRORS_ZERO_SKIPS" | tee g2-verdict.txt
          else
            echo "EXPECTED_RED=INVALID_RESULT" | tee g2-verdict.txt
            echo "EXPECTED_FAILURES:" | tee -a g2-verdict.txt
            printf '%s\n' "$expected_failures" | tee -a g2-verdict.txt
            echo "ACTUAL_FAILURES:" | tee -a g2-verdict.txt
            printf '%s\n' "$actual_failures" | tee -a g2-verdict.txt
            exit 1
          fi

      - name: Upload G2 RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-3-11-5-g2-red-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            g2-source-sha.txt
            g2-isolation-verdict.txt
            g2-red-tests.log
            g2-test-status.txt
            g2-verdict.txt
