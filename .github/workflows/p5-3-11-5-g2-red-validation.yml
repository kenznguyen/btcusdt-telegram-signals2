name: P5.3.11.5 - G2 Writer Routing Validation
run-name: G2 validation (${{ github.ref_name }} @ ${{ github.sha }})

on:
  push:
    branches:
      - feature/p5-3-11-5-g2-red-tests-20261103
    paths:
      - "market_data/test_g2_writer_routing.py"
      - "market_data/test_*.py"
      - "market_data/**"
      - "ci/test_ci_policy.py"
      - ".github/workflows/p5-3-11-5-g2-red-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-3-11-5-g2-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  g2-validation:
    name: G2 contract validation (isolated shadow-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-market-data.txt -r requirements-ci.txt
          python -m pip install "Flask>=3.0.0,<4"

      - name: Enforce isolated environment
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unsafe environment variable present: $key"
              exit 1
            fi
          done
          echo "ISOLATED_SHADOW_ONLY=PASS" | tee g2-isolation-verdict.txt
          git rev-parse HEAD | tee g2-source-sha.txt

      - name: Compile G2 contract test module
        run: python -m py_compile market_data/test_g2_writer_routing.py

      - name: Execute G2 contract suite
        shell: bash
        run: |
          set +e
          python -m unittest market_data.test_g2_writer_routing -v 2>&1 | tee g2-contract-tests.log
          status=${PIPESTATUS[0]}
          set -e
          echo "EXIT_STATUS=$status" | tee g2-test-status.txt
          if [[ "$status" -eq 0 ]] \
             && grep -q "Ran 18 tests" g2-contract-tests.log \
             && grep -q '^OK$' g2-contract-tests.log \
             && ! grep -Eq "errors=|skipped=|FAILED|ERROR:" g2-contract-tests.log; then
            echo "G2_GREEN_CANDIDATE=18_CONTRACT_TESTS_PASS_ZERO_ERRORS_ZERO_SKIPS" | tee g2-verdict.txt
          else
            echo "G2_VALIDATION=INVALID_RESULT" | tee g2-verdict.txt
            exit 1
          fi

      - name: Run complete market_data regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s market_data -p 'test_*.py' -v 2>&1 | tee g2-regression-tests.log
      - name: Upload G2 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-3-11-5-g2-validation-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            g2-source-sha.txt
            g2-isolation-verdict.txt
            g2-contract-tests.log
            g2-regression-tests.log
            g2-test-status.txt
            g2-verdict.txt
