name: P5.3.11.5 - G2 Writer Routing RED
run-name: G2 RED validation (${{ github.ref_name }} @ ${{ github.sha }})

on:
  push:
    branches:
      - feature/p5-3-11-5-g2-red-tests-20261103
    paths:
      - ".github/workflows/p5-3-11-5-g2-red-validation.yml"
      - "market_data/test_g2_writer_routing.py"
      - "market_data/**"
      - "ci/test_ci_policy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-3-11-5-g2-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  g2-red:
    name: G2 RED contracts (isolated shadow-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-market-data.txt -r requirements-ci.txt

      - name: Enforce isolated environment
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unsafe environment variable present: $key"
              exit 1
            fi
          done
          echo "ISOLATED_SHADOW_ONLY=PASS" | tee g2-isolation-verdict.txt
          git rev-parse HEAD | tee g2-source-sha.txt

      - name: Compile G2 RED test module
        run: python -m py_compile market_data/test_g2_writer_routing.py

      - name: Execute and classify expected RED
        shell: bash
        run: |
          set +e
          python -m unittest market_data.test_g2_writer_routing -v 2>&1 | tee g2-red-tests.log
          status=${PIPESTATUS[0]}
          set -e
          echo "EXIT_STATUS=$status" | tee g2-test-status.txt
          if [[ "$status" -ne 0 ]] \
             && grep -q "Ran 18 tests" g2-red-tests.log \
             && grep -q "FAILED (failures=18)" g2-red-tests.log \
             && ! grep -Eq "errors=|skipped=" g2-red-tests.log; then
            echo "EXPECTED_RED=18_ASSERTION_FAILURES_ZERO_ERRORS_ZERO_SKIPS" | tee g2-verdict.txt
          else
            echo "EXPECTED_RED=INVALID_RESULT" | tee g2-verdict.txt
            exit 1
          fi

      - name: Upload G2 RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-3-11-5-g2-red-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            g2-source-sha.txt
            g2-isolation-verdict.txt
            g2-red-tests.log
            g2-test-status.txt
            g2-verdict.txt
