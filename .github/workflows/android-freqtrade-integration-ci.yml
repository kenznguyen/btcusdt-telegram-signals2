name: Android Freqtrade Integration CI

on:
  workflow_dispatch:
  push:
    branches:
      - integration/android-freqtrade-analytics-20261025
  pull_request:
    paths:
      - 'android-app/**'
      - 'freqtrade-backtest/**'

permissions:
  contents: read

jobs:
  analytics-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline Analytics
        run: python -m unittest discover -s freqtrade-backtest/tests -v

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android Gradle project
        run: |
          test -f android-app/settings.gradle.kts
          test -f android-app/app/build.gradle.kts
      - name: Android unit tests
        working-directory: android-app
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
