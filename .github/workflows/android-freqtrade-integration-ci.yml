name: Android Freqtrade Integration CI

on:
  workflow_dispatch:
  push:
    branches:
      - integration/android-freqtrade-analytics-20261025
  pull_request:
    paths:
      - 'android-app/**'
      - 'freqtrade-backtest/**'

permissions:
  contents: read

jobs:
  analytics-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline Analytics
        run: python -m unittest discover -s freqtrade-backtest/tests -v

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android Gradle project
        run: |
          test -f android-app/settings.gradle.kts
          test -f android-app/app/build.gradle.kts
      - name: Android unit tests and parity trace
        working-directory: android-app
        env:
          ANDROID_PARITY_TRACE_OUTPUT: ${{ github.workspace }}/android-emergency-trace.json
          ANDROID_PARITY_ENTRY_TRACE_OUTPUT: ${{ github.workspace }}/android-entry-trace.json
          ANDROID_PARITY_DCA_TRACE_OUTPUT: ${{ github.workspace }}/android-dca-trace.json
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Compare Android and Python emergency traces
        run: |
          python freqtrade-backtest/export_emergency_parity_trace.py python-emergency-trace.json
          python freqtrade-backtest/compare_events.py android-emergency-trace.json python-emergency-trace.json
      - name: Compare genuine OHLC ENTRY traces
        run: |
          python freqtrade-backtest/export_entry_parity_trace.py python-entry-trace.json
          python freqtrade-backtest/compare_events.py android-entry-trace.json python-entry-trace.json
      - name: Compare genuine OHLC DCA traces
        run: |
          python freqtrade-backtest/export_dca_parity_trace.py python-dca-trace.json
          python freqtrade-backtest/compare_events.py android-dca-trace.json python-dca-trace.json
      - name: Assemble debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Inspect debug APK metadata and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -m 1 '^package:'
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/debug-apk-certs.txt
          grep -Eiq 'certificate SHA-256 digest|certificate SHA-256' /tmp/debug-apk-certs.txt
          echo 'DEBUG signature only. This certificate must NOT be used to judge Release upgrade compatibility.'
      - name: Upload unsigned-for-release debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-freqtrade-analytics-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
