name: P5.3.11 - G2 Integration RED (historical, manual only)
run-name: Historical G2 RED reproduction (${{ github.ref_name }} @ ${{ github.sha }})

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-3-11-g2-integration-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-red:
    name: Isolated G2 contract reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-market-data.txt -r requirements-ci.txt

      - name: Enforce isolated environment and record source SHA
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unsafe environment variable present: $key"
              exit 1
            fi
          done
          git rev-parse HEAD | tee g2-integration-source-sha.txt
          echo "ISOLATED_SHADOW_ONLY=PASS" | tee g2-integration-isolation.txt

      - name: Run G2 writer-routing contracts and classify expected RED
        shell: bash
        run: |
          set +e
          python -m unittest market_data.test_g2_writer_routing -v 2>&1 | tee g2-integration-contracts.log
          status=${PIPESTATUS[0]}
          set -e
          echo "EXIT_STATUS=$status" | tee g2-integration-contracts.status
          test "$status" -ne 0
          grep -q "Ran 22 tests" g2-integration-contracts.log
          grep -q "FAIL: test_g2_20_build_runtime_rejects_duck_typed_gateway" g2-integration-contracts.log
          grep -q "ERROR: test_g2_21_runtime_uses_independent_observation_and_lease_clocks" g2-integration-contracts.log
          grep -q "FAILED (failures=1, errors=1)" g2-integration-contracts.log

      - name: Run CandleStore fail-closed regression and classify expected RED
        shell: bash
        run: |
          set +e
          python -m unittest market_data.test_store -v 2>&1 | tee g2-integration-candle-store.log
          status=${PIPESTATUS[0]}
          set -e
          echo "EXIT_STATUS=$status" | tee g2-integration-candle-store.status
          test "$status" -ne 0
          grep -q "FAIL: test_runtime_insert_does_not_create_missing_database" g2-integration-candle-store.log
          ! grep -q "ERROR:" g2-integration-candle-store.log

      - name: Run LeaseStore fail-closed regression and classify expected RED
        shell: bash
        run: |
          set +e
          python -m unittest market_data.test_feeder_lease -v 2>&1 | tee g2-integration-lease-store.log
          status=${PIPESTATUS[0]}
          set -e
          echo "EXIT_STATUS=$status" | tee g2-integration-lease-store.status
          test "$status" -ne 0
          grep -q "FAIL: test_runtime_lease_transaction_does_not_create_missing_database" g2-integration-lease-store.log
          ! grep -q "ERROR:" g2-integration-lease-store.log

      - name: Publish RED reproduction verdict
        if: always()
        shell: bash
        run: |
          {
            echo "G2_INTEGRATION_RED=EXPECTED_REPRODUCED"
            echo "Expected causes: duck-typed runtime Gateway accepted; observation_clock injection missing; CandleStore and LeaseStore can create absent DB files."
            echo "This workflow is a test-first reproduction gate, not GREEN acceptance."
          } | tee g2-integration-red-verdict.txt

      - name: Upload isolated RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-3-11-g2-integration-red-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            g2-integration-source-sha.txt
            g2-integration-isolation.txt
            g2-integration-contracts.log
            g2-integration-contracts.status
            g2-integration-candle-store.log
            g2-integration-candle-store.status
            g2-integration-lease-store.log
            g2-integration-lease-store.status
            g2-integration-red-verdict.txt
