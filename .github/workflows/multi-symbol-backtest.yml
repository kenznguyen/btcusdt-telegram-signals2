name: Multi-Symbol Backtest
run-name: Multi-symbol backtest (${{ inputs.symbols || 'default symbols' }}, ${{ inputs.backtest_days || '360' }} days)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols, e.g. BTCUSDT,ETHUSDT,SOLUSDT"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT"
        type: string
      backtest_days:
        description: "Historical period (1-365 days)"
        required: true
        default: "360"
        type: string
      initial_capital:
        description: "Independent starting capital per symbol (USDT)"
        required: true
        default: "100"
        type: string
      entry_margin_pct:
        description: "Initial order margin (% of current balance)"
        required: true
        default: "50"
        type: string
      dca_margin_ratio:
        description: "DCA margin (% of initial order margin)"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: multi-symbol-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Validate inputs
        env:
          BACKTEST_SYMBOLS: ${{ inputs.symbols }}
          BACKTEST_DAYS: ${{ inputs.backtest_days }}
          BACKTEST_INITIAL_CAPITAL: ${{ inputs.initial_capital }}
          ENTRY_MARGIN_PCT: ${{ inputs.entry_margin_pct }}
          DCA_MARGIN_RATIO: ${{ inputs.dca_margin_ratio }}
        run: |
          python - <<'PY'
          import os
          supported = {"BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","LINKUSDT"}
          symbols = list(dict.fromkeys(s.strip().upper() for s in os.environ["BACKTEST_SYMBOLS"].split(",") if s.strip()))
          if not symbols or any(s not in supported for s in symbols):
              raise SystemExit("Symbols không hợp lệ. Chọn: " + ", ".join(sorted(supported)))
          days = int(os.environ["BACKTEST_DAYS"])
          capital = float(os.environ["BACKTEST_INITIAL_CAPITAL"])
          margin = float(os.environ["ENTRY_MARGIN_PCT"])
          dca = float(os.environ["DCA_MARGIN_RATIO"])
          if not 1 <= days <= 365: raise SystemExit("backtest_days phải từ 1 đến 365")
          if capital < 1: raise SystemExit("initial_capital phải >= 1 USDT")
          if not 1 <= margin <= 100: raise SystemExit("entry_margin_pct phải từ 1 đến 100")
          if not 0 <= dca <= 500: raise SystemExit("dca_margin_ratio phải từ 0 đến 500")
          print("Validated symbols:", ", ".join(symbols))
          PY

      - name: Run isolated backtests sequentially
        env:
          BACKTEST_SYMBOLS: ${{ inputs.symbols }}
          BACKTEST_DAYS: ${{ inputs.backtest_days }}
          BACKTEST_INITIAL_CAPITAL: ${{ inputs.initial_capital }}
          ENTRY_MARGIN_PCT: ${{ inputs.entry_margin_pct }}
          DCA_MARGIN_RATIO: ${{ inputs.dca_margin_ratio }}
          GITHUB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python multi_backtest.py

      - name: Upload multi-symbol results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-symbol-backtest-${{ github.run_id }}
          path: multi_backtest_results/
          if-no-files-found: warn
          retention-days: 30
