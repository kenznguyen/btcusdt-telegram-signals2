name: T0 Single Writer Gateway RED Contracts

on:
  push:
    branches:
      - feature/t0-atomic-write-fencing-20261105
    paths:
      - "market_data/**"
      - ".github/workflows/t0-single-writer-gateway-red.yml"
  pull_request:
    branches:
      - feature/t0-centralized-data-feeder-p1-20261101
    paths:
      - "market_data/**"
      - ".github/workflows/t0-single-writer-gateway-red.yml"
      - "docs/evidence/T0_SINGLE_WRITER_GATEWAY_RED_2026-11-05.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t0-swg-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadow-contracts:
    name: Static source-only RED contract classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce source-only environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${MARKET_DATA_DB}"
          test -z "${T0_FEEDER_LEASE_DB}"
          test -z "${PAPER_DB}"
          test -z "${BINANCE_API_KEY}"
          test -z "${BINANCE_API_SECRET}"
          test -z "${OKX_API_KEY}"
          test -z "${OKX_API_SECRET}"
          echo "T0_SWG_SHADOW_PREFLIGHT=PASS" | tee t0-swg-preflight.log
      - name: Compile contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile market_data/test_single_writer_gateway_red.py
          echo "T0_SWG_RED_COMPILE=PASS" | tee t0-swg-compile.log
      - name: Run and classify expected RED contracts
        shell: bash
        run: |
          set -euo pipefail
          set +e
          env -u MARKET_DATA_DB -u T0_FEEDER_LEASE_DB -u PAPER_DB \
            -u BINANCE_API_KEY -u BINANCE_API_SECRET -u OKX_API_KEY -u OKX_API_SECRET \
            python -m unittest market_data.test_single_writer_gateway_red -v 2>&1 | tee t0-swg-red-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "${test_status}" -eq 0 ]; then
            echo "T0_SWG_RED=UNEXPECTED_PASS" | tee t0-swg-red-verdict.log
            exit 1
          fi
          if grep -q "AssertionError:" t0-swg-red-tests.log \
            && ! grep -q "^ERROR:" t0-swg-red-tests.log \
            && grep -Eq "^FAILED \(failures=[1-9][0-9]*\)$" t0-swg-red-tests.log; then
            echo "T0_SWG_RED=CONFIRMED_CONTRACT_GAPS" | tee t0-swg-red-verdict.log
          else
            echo "T0_SWG_RED=INVALID_FAILURE_CLASS" | tee t0-swg-red-verdict.log
            exit 1
          fi
      - name: Run Gateway behavioral and feeder regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            market_data.test_write_gateway \
            market_data.test_fenced_store \
            market_data.test_sync \
            market_data.test_storage \
            market_data.test_feeder_lifecycle -v 2>&1 | tee t0-swg-behavior-tests.log
      - name: Upload source identity and RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-swg-red-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            t0-swg-preflight.log
            t0-swg-compile.log
            t0-swg-red-tests.log
            t0-swg-red-verdict.log
            t0-swg-behavior-tests.log
