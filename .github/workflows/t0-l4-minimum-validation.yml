name: T0 L4-Minimum Validation

on:
  push:
    branches:
      - feature/t0-centralized-data-feeder-p1-20261101
    paths:
      - .github/workflows/t0-l4-minimum-validation.yml
      - ci/test_t0_l4_minimum_lineage_contract.py
      - ci/test_t0_l4_artifact_manifest.py
      - ci/t0_l4_artifact_manifest.py
      - ci/l4-artifact-allowlist.json
      - ci/t0_l4_repository_file_inventory.py
      - ci/test_t0_l4_repository_file_inventory.py
      - ci/test_t0_l4_claim_discipline.py
      - ci/t0_l4_claim_discipline.py
      - ci/test_t0_l4_aggregate_readiness.py
      - ci/t0_l4_aggregate_readiness.py
      - synthetic_evidence/trust_lifecycle.py
      - synthetic_evidence/test_trust_lifecycle.py
      - synthetic_evidence/root_b_checkpoint_store.py
      - synthetic_evidence/test_root_b_checkpoint_store.py
      - synthetic_evidence/test_workflow_archive_contract.py
      - .github/workflows/p1-8-synthetic-evidence.yml
      - ci/l4-repository-file-inventory.json
      - docs/architecture/CENTRAL_DATA_LIFECYCLE_POLICY.md
      - docs/architecture/P1.8.14_EXTERNAL_TRUST_ANCHOR_PROVENANCE_AUTHENTICITY_2026-11-07.md
      - docs/architecture/T0_EVIDENCE_OBJECT_CHECKPOINT_CONTRACT_V1.md
      - docs/evidence/t0/T0_EVIDENCE_CHECKPOINT_G3_REVIEW_INPUTS_2026-11-10.md
      - docs/evidence/T0_L4M01_L4M03_EXISTING_TRUST_EVIDENCE_NON_SUBSTITUTION_2026-11-10.md
      - docs/evidence/T0_L4M01_L4M03_OWNER_EVIDENCE_INTAKE_CONTRACT_2026-11-10.md
      - docs/evidence/p1-8/P1.8.14*.md
      - docs/decisions/D-2026-11-09-*.md
      - docs/decisions/D-2026-11-10-*.md
      - docs/evidence/p1-8/L4-MINIMUM-PROVENANCE-ACCEPTANCE-MATRIX.md
      - docs/evidence/T0_L4_MINIMUM_NINE_CONTROL_EVIDENCE_ACQUISITION_REGISTER_2026-11-10.md
      - docs/evidence/T0_L4_MINIMUM_AUTOMATION_PLAN_2026-11-10.md
      - docs/evidence/T0_L4*.md
      - docs/decisions/D-*-L4*.md
      - docs/evidence/T0_L4_MINIMUM_POLICY_HISTORICAL_AUDIT_RECONCILIATION_2026-11-10.md
      - docs/evidence/T0_L4M02_SIGNER_SEPARATION_EXISTING_EVIDENCE_ASSESSMENT_2026-11-10.md
      - docs/evidence/T0_L4M08_CLAIM_DISCIPLINE_DOCUMENTARY_ASSESSMENT_2026-11-10.md
      - docs/evidence/T0_L4M10_FROZEN_BASELINE_OWNER_SELF_ASSESSMENT_READINESS_2026-11-10.md

permissions:
  contents: read

concurrency:
  group: t0-l4-minimum-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  l4-minimum-lineage-contract:
    name: L4-Minimum source lineage and policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact source SHA and validation scope
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee l4-source-sha.txt
          echo "T0_L4_MINIMUM_LINEAGE=GITHUB_HOSTED_READ_ONLY" | tee l4-validation-scope.txt

      - name: Run L4-Minimum lineage contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_l4_minimum_lineage_contract -v 2>&1 | tee l4-lineage-contract-tests.log
          echo "L4_MINIMUM_LINEAGE_CONTRACT=PASS" | tee l4-lineage-contract-verdict.txt

      - name: Upload L4-Minimum lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-l4-minimum-lineage-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            l4-source-sha.txt
            l4-validation-scope.txt
            l4-lineage-contract-tests.log
            l4-lineage-contract-verdict.txt

  l4-artifact-manifest:
    name: L4-Minimum GitHub artifact readback and SHA-256 manifest
    needs: l4-minimum-lineage-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run artifact manifest contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_l4_artifact_manifest -v

      - name: Read back exact current-run artifact and build manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          L4_ARTIFACT_ALLOWLIST: ci/l4-artifact-allowlist.json
        run: |
          set -euo pipefail
          python ci/t0_l4_artifact_manifest.py --allowlist "$L4_ARTIFACT_ALLOWLIST" --output-dir l4-artifact-manifest

      - name: Upload L4 artifact inventory and SHA-256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-l4-artifact-manifest-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            l4-artifact-manifest/l4-artifact-manifest.json
            l4-artifact-manifest/l4-artifact-manifest.sha256

  l4-repository-file-inventory:
    name: L4-Minimum exact-commit repository-file inventory
    needs: l4-minimum-lineage-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository-file inventory contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_l4_repository_file_inventory -v

      - name: Build exact-commit repository-file inventory
        shell: bash
        run: |
          set -euo pipefail
          python ci/t0_l4_repository_file_inventory.py --config ci/l4-repository-file-inventory.json --output-dir l4-repository-file-inventory
          cat l4-repository-file-inventory/l4-repository-file-inventory.sha256

      - name: Upload repository-file inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-l4-repository-file-inventory-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            l4-repository-file-inventory/l4-repository-file-inventory.json
            l4-repository-file-inventory/l4-repository-file-inventory.sha256

  l4-claim-discipline:
    name: L4M-08 bounded claim-discipline contract
    needs: l4-minimum-lineage-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run claim-discipline contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_l4_claim_discipline -v

      - name: Audit the current control-to-source crosswalk
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python ci/t0_l4_claim_discipline.py --crosswalk docs/evidence/T0_L4_CONTROL_TO_SOURCE_CROSSWALK_2026-11-11.md --output-dir l4-claim-discipline

      - name: Upload L4M-08 claim-discipline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-l4-claim-discipline-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            l4-claim-discipline/claim-discipline-report.json
            l4-claim-discipline/claim-discipline-report.sha256

  l4-synthetic-history-trust:
    name: L4M-06/07 synthetic trust and append-only history
    needs: l4-minimum-lineage-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DATABASE_URL: ""
      DATABASE_PATH: ""
      SQLITE_PATH: ""
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      EXCHANGE_API_KEY: ""
      EXCHANGE_API_SECRET: ""
      AI_EXECUTION_ENABLED: "false"
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce synthetic-only environment and record source SHA
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL DATABASE_PATH SQLITE_PATH MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET EXCHANGE_API_KEY EXCHANGE_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unsafe environment variable present: $key"
              exit 1
            fi
          done
          test "$AI_EXECUTION_ENABLED" = "false"
          git rev-parse HEAD | tee l4-synthetic-history-source-sha.txt
          echo "L4_SYNTHETIC_ONLY=PASS" | tee l4-synthetic-history-scope.txt

      - name: Compile isolated trust and history modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile synthetic_evidence/trust_lifecycle.py synthetic_evidence/test_trust_lifecycle.py synthetic_evidence/root_b_checkpoint_store.py synthetic_evidence/test_root_b_checkpoint_store.py synthetic_evidence/test_workflow_archive_contract.py

      - name: Run L4M-06 synthetic trust lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest synthetic_evidence.test_trust_lifecycle -v 2>&1 | tee l4m06-trust-lifecycle-tests.log
          echo "L4M06_SYNTHETIC_TRUST_LIFECYCLE=PASS" | tee l4m06-trust-lifecycle-verdict.txt

      - name: Run L4M-07 synthetic event/checkpoint and archive-history tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest synthetic_evidence.test_root_b_checkpoint_store synthetic_evidence.test_workflow_archive_contract -v 2>&1 | tee l4m07-history-tests.log
          echo "L4M07_SYNTHETIC_HISTORY=PASS" | tee l4m07-history-verdict.txt

      - name: Upload synthetic trust and history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-l4-synthetic-history-trust-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            l4-synthetic-history-source-sha.txt
            l4-synthetic-history-scope.txt
            l4m06-trust-lifecycle-tests.log
            l4m06-trust-lifecycle-verdict.txt
            l4m07-history-tests.log
            l4m07-history-verdict.txt

  l4m10-aggregate-readiness:
    name: L4M-10 fail-closed aggregate readiness
    needs: [l4-minimum-lineage-contract, l4-claim-discipline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run L4M-10 fail-closed readiness contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_l4_aggregate_readiness -v 2>&1 | tee l4m10-aggregate-readiness-tests.log

      - name: Evaluate current aggregate without owner disposition
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python ci/t0_l4_aggregate_readiness.py --crosswalk docs/evidence/T0_L4_CONTROL_TO_SOURCE_CROSSWALK_2026-11-11.md --output-dir l4m10-readiness
          grep -q '"aggregate_verdict":"BLOCKED / NOT VERIFIED"' l4m10-readiness/aggregate-readiness-report.json
          echo "L4M10_AGGREGATE_READINESS=BLOCKED_AS_REQUIRED" | tee l4m10-aggregate-readiness-verdict.txt

      - name: Upload L4M-10 readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-l4m10-aggregate-readiness-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            l4m10-aggregate-readiness-tests.log
            l4m10-aggregate-readiness-verdict.txt
            l4m10-readiness/aggregate-readiness-report.json
            l4m10-readiness/aggregate-readiness-report.sha256
