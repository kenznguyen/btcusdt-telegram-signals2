name: OKX shadow source contracts

on:
  pull_request:
    branches:
      - feature/android-five-layer-control
    paths:
      - "market_data/okx_swap.py"
      - "market_data/okx_swap_store.py"
      - "market_data/test_okx_swap.py"
      - "market_data/test_okx_swap_store.py"
      - "ci/okx-shadow-capture.py"
      - ".github/workflows/okx-shadow-contracts.yml"
  push:
    branches:
      - feature/okx-shadow-phase1-20261101
    paths:
      - "market_data/okx_swap.py"
      - "market_data/okx_swap_store.py"
      - "market_data/test_okx_swap.py"
      - "market_data/test_okx_swap_store.py"
      - "ci/okx-shadow-capture.py"
      - ".github/workflows/okx-shadow-contracts.yml"

permissions:
  contents: read

concurrency:
  group: okx-shadow-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
      ai_execution_enabled: "false"
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert isolated environment
        run: |
          test -z "$MARKET_DATA_DB"
          test -z "$T0_FEEDER_LEASE_DB"
          test -z "$PAPER_DB"
          test -z "$PAPER_TRADING_DB"
          test -z "$BINANCE_API_KEY"
          test -z "$BINANCE_API_SECRET"
          test -z "$OKX_API_KEY"
          test -z "$OKX_API_SECRET"
          test "$ai_execution_enabled" = "false"
      - name: Run offline OKX adapter and store contracts
        run: |
          python -m unittest market_data.test_okx_swap market_data.test_okx_swap_store -v
      - name: Compile OKX shadow modules
        run: |
          python -m py_compile market_data/okx_swap.py market_data/okx_swap_store.py market_data/test_okx_swap.py market_data/test_okx_swap_store.py ci/okx-shadow-capture.py
