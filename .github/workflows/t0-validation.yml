name: T0 Validation
'on':
  push:
    branches:
      - ci/t0-codemagic-to-github-actions-20261103
    paths:
      - "ci/**"
      - "market_data/**"
      - "codemagic.yaml"
      - ".github/workflows/t0-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Record exact source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run T0 migration policy tests
        run: python -m unittest ci.test_ci_policy -v
      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-policy-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: ci-source-sha.txt
