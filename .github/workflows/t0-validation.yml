  timescaledb-integration:
    name: T0 TimescaleDB integration and SQLite parity (manual / dedicated branch)
    if: >-
      (github.event_name == 'push' && github.ref_name == 'feature/timescaledb-storage-factory-api') ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'timescaledb-integration'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_DATA_TEST_DATABASE_URL: ${{ secrets.MARKET_DATA_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements-ci.txt
      - run: python -m pip install -r requirements-market-data.txt -r requirements-ci.txt
      - name: Record SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Report missing external disposable TimescaleDB secret
        if: ${{ env.MARKET_DATA_TEST_DATABASE_URL == '' }}
        run: echo "TIMESCALEDB_INTEGRATION=NOT_RUN_MISSING_MARKET_DATA_TEST_DATABASE_URL" | tee timescaledb-verdict.txt
      - name: Run disposable TimescaleDB integration
        if: ${{ env.MARKET_DATA_TEST_DATABASE_URL != '' }}
        env:
          CI_PYTHON: python
        run: bash ci/test-timescaledb.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-timescaledb-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            timescaledb-tests.log
            timescaledb-verdict.txt
