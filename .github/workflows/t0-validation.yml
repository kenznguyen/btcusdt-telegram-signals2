name: T0 Validation
run-name: T0 validation (${{ github.ref_name }} @ ${{ github.sha }})

'on':
  push:
    branches:
      - main
      - ci/t0-codemagic-to-github-actions-20261103
      - feature/five-layer-paper
      - feature/canonical-market-data
      - feature/hummingbot-order-book
      - feature/android-five-layer-control
      - feature/t1-intelligence-provenance-quality-20261101
      - feature/timescaledb-market-data-repository
      - feature/timescaledb-storage-factory-api
      - feature/p5-3-10-5-g1-gateway-green-20261103
      - feature/t0-centralized-data-feeder-p1-20261101
      - feature/t0-atomic-write-fencing-20261102
      - feature/t0-atomic-fencing-hardening-20261102
      - feature/t0-health-runtime-api-integration-20261102
      - feature/t0-sigkill-recovery-20261102
      - feature/t0-operational-contract-release-gate-20261102
      - feature/t0-data-integrity-candle-continuity-gate-20261102
    paths:
      - "market_data/**"
      - "ci/**"
      - "app.py"
      - "requirements*.txt"
      - "codemagic.yaml"
      - ".github/workflows/t0-validation.yml"
  pull_request:
    branches:
      - main
      - feature/p5-3-11-5-g2-red-tests-20261103
    paths:
      - "market_data/**"
      - "ci/**"
      - "app.py"
      - "requirements*.txt"
      - "codemagic.yaml"
      - ".github/workflows/t0-validation.yml"
  workflow_dispatch:
    inputs:
      gate:
        description: "T0 gate to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - market-data-core
          - feeder-scheduler
          - feeder-health
          - feeder-lifecycle
          - atomic-fencing
          - health-runtime-api
          - sigkill-recovery
          - operational-contract
          - data-integrity
          - final-runtime-config
          - component-tests-p3
          - kraken-adapter
          - kraken-spot-sqlite
          - kraken-spot-read-api
          - timescaledb-integration

permissions:
  contents: read

concurrency:
  group: t0-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy-contracts:
    name: T0/GitHub Actions migration policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Record exact source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run CI policy contracts
        run: python -m unittest ci.test_ci_policy -v
      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-policy-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt

  market-data-core:
    name: T0 market-data core and Gateway regression
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && contains(fromJSON('["main","feature/five-layer-paper","feature/canonical-market-data","feature/hummingbot-order-book","feature/android-five-layer-control","feature/t1-intelligence-provenance-quality-20261101","feature/timescaledb-market-data-repository","feature/timescaledb-storage-factory-api","feature/p5-3-10-5-g1-gateway-green-20261103"]'), github.ref_name)) ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'market-data-core'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements-ci.txt
            requirements-web.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-market-data.txt -r requirements-ci.txt -r requirements-web.txt
      - name: Enforce isolated environment and record SHA
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "Unsafe environment variable present: $key"; exit 1; fi
          done
          git rev-parse HEAD | tee ci-source-sha.txt
          echo "T0_ISOLATED_SHADOW_ONLY=PASS"
      - name: Run canonical market-data and Gateway tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest market_data.test_store market_data.test_storage market_data.test_sync market_data.test_api market_data.test_gateway_runtime -v 2>&1 | tee t0-market-data-core-tests.log
      - name: Compile market-data modules
        run: python -m compileall -q market_data
      - name: Upload T0 market-data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-market-data-core-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-market-data-core-tests.log

  feeder-scheduler:
    name: T0 feeder scheduler and lease contracts
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'feature/t0-centralized-data-feeder-p1-20261101') ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'feeder-scheduler'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Enforce isolation and record source SHA
        run: |
          set -euo pipefail
          test -z "$MARKET_DATA_DB" && test -z "$T0_FEEDER_LEASE_DB" && test -z "$PAPER_DB"
          test -z "$BINANCE_API_KEY" && test -z "$BINANCE_API_SECRET" && test -z "$OKX_API_KEY" && test -z "$OKX_API_SECRET"
          git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run singleton lease contract tests
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_lease -v 2>&1 | tee t0-feeder-lease-tests.log
          echo "T0_FEEDER_LEASE_TESTS=PASS" | tee t0-feeder-lease-verdict.txt
      - name: Compile lease implementation
        run: |
          python -m py_compile market_data/feeder.py
          echo "T0_FEEDER_LEASE_COMPILE=PASS" | tee t0-feeder-lease-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-feeder-scheduler-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-feeder-lease-tests.log
            t0-feeder-lease-verdict.txt
            t0-feeder-lease-compile.log

  feeder-health:
    name: T0 feeder health, freshness and readiness
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'feature/t0-centralized-data-feeder-p1-20261101') ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'feeder-health'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - name: Record source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run health evaluator and HTTP contracts
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-feeder-health-tests.log
          echo "T0_FEEDER_HEALTH_TESTS=PASS" | tee t0-feeder-health-verdict.txt
      - name: Compile health implementation
        run: |
          python -m py_compile market_data/feeder.py app.py market_data/test_feeder_health.py market_data/test_feeder_health_api.py
          echo "T0_FEEDER_HEALTH_COMPILE=PASS" | tee t0-feeder-health-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-feeder-health-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-feeder-health-tests.log
            t0-feeder-health-verdict.txt
            t0-feeder-health-compile.log

  feeder-lifecycle:
    name: T0 feeder lifecycle and graceful shutdown
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'feature/t0-centralized-data-feeder-p1-20261101') ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'feeder-lifecycle'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - name: Record source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run lifecycle and T0 regression contracts
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_lifecycle market_data.test_feeder_scheduler market_data.test_feeder_retry market_data.test_feeder_recovery market_data.test_feeder_lease market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-feeder-lifecycle-tests.log
          echo "T0_FEEDER_LIFECYCLE_TESTS=PASS" | tee t0-feeder-lifecycle-verdict.txt
      - name: Compile lifecycle and API modules
        run: |
          python -m py_compile market_data/feeder.py market_data/feeder_service.py market_data/test_feeder_lifecycle.py app.py
          echo "T0_FEEDER_LIFECYCLE_COMPILE=PASS" | tee t0-feeder-lifecycle-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-feeder-lifecycle-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-feeder-lifecycle-tests.log
            t0-feeder-lifecycle-verdict.txt
            t0-feeder-lifecycle-compile.log

  atomic-fencing:
    name: T0 atomic SQLite write fencing
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && contains(fromJSON('["feature/t0-atomic-write-fencing-20261102","feature/t0-atomic-fencing-hardening-20261102"]'), github.ref_name)) ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'atomic-fencing'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - name: Record source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run atomic fencing and prior T0 regression contracts
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_atomic_fencing market_data.test_feeder_lifecycle market_data.test_feeder_scheduler market_data.test_feeder_retry market_data.test_feeder_recovery market_data.test_feeder_lease market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-feeder-atomic-fencing-tests.log
          grep -q "Ran 99 tests" t0-feeder-atomic-fencing-tests.log
          echo "T0_FEEDER_ATOMIC_FENCING_TESTS=PASS (99 tests)" | tee t0-feeder-atomic-fencing-verdict.txt
      - name: Compile fenced storage and runtime integration
        run: |
          python -m py_compile market_data/store.py market_data/storage.py market_data/sync.py market_data/feeder.py market_data/feeder_service.py market_data/test_feeder_atomic_fencing.py market_data/test_feeder_lifecycle.py
          echo "T0_FEEDER_ATOMIC_FENCING_COMPILE=PASS" | tee t0-feeder-atomic-fencing-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-atomic-fencing-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-feeder-atomic-fencing-tests.log
            t0-feeder-atomic-fencing-verdict.txt
            t0-feeder-atomic-fencing-compile.log

  health-runtime-api:
    name: T0 runtime health API integration
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'feature/t0-health-runtime-api-integration-20261102') ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'health-runtime-api'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - name: Record source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Compile runtime status provider, feeder and API
        run: |
          python -m py_compile app.py market_data/feeder.py market_data/feeder_service.py market_data/feeder_status.py market_data/test_feeder_health_runtime_api.py
          echo "T0_HEALTH_RUNTIME_API_COMPILE=PASS" | tee t0-health-runtime-api-compile.log
      - name: Run runtime/API integration and T0 regressions
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_health_runtime_api market_data.test_feeder_atomic_fencing market_data.test_feeder_sigkill_recovery market_data.test_feeder_lifecycle market_data.test_feeder_scheduler market_data.test_feeder_retry market_data.test_feeder_recovery market_data.test_feeder_lease market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-health-runtime-api-tests.log
          grep -q "Ran 106 tests" t0-health-runtime-api-tests.log
          echo "T0_HEALTH_RUNTIME_API_TESTS=PASS (106 tests)" | tee t0-health-runtime-api-verdict.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-health-runtime-api-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-health-runtime-api-compile.log
            t0-health-runtime-api-tests.log
            t0-health-runtime-api-verdict.txt

  sigkill-recovery:
    name: T0 isolated SQLite SIGKILL recovery
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'feature/t0-sigkill-recovery-20261102') ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'sigkill-recovery'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
      T0_SIGKILL_AUDIT_PATH: t0-feeder-sigkill-recovery-sqlite-audit.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Record source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run SIGKILL recovery and T0 regressions
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_sigkill_recovery market_data.test_feeder_atomic_fencing market_data.test_feeder_lifecycle market_data.test_feeder_scheduler market_data.test_feeder_retry market_data.test_feeder_recovery market_data.test_feeder_lease market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-feeder-sigkill-recovery-tests.log
          grep -q "Ran 100 tests" t0-feeder-sigkill-recovery-tests.log
          echo "T0_SIGKILL_RECOVERY_TESTS=PASS (100 tests)" | tee t0-feeder-sigkill-recovery-verdict.txt
      - name: Compile SIGKILL recovery modules
        run: |
          python -m py_compile market_data/test_feeder_sigkill_recovery.py market_data/feeder.py market_data/feeder_service.py market_data/store.py market_data/sync.py
          echo "T0_SIGKILL_RECOVERY_COMPILE=PASS" | tee t0-feeder-sigkill-recovery-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-sigkill-recovery-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-feeder-sigkill-recovery-tests.log
            t0-feeder-sigkill-recovery-verdict.txt
            t0-feeder-sigkill-recovery-compile.log
            t0-feeder-sigkill-recovery-sqlite-audit.log

  operational-contract:
    name: T0 static operational contract and release gate
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'feature/t0-operational-contract-release-gate-20261102') ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'operational-contract'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Record source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run static operational contract tests and audit
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_operational_contract -v 2>&1 | tee t0-operational-contract-tests.log
          python ci/t0_operational_contract.py 2>&1 | tee t0-operational-contract-audit.log
          grep -q "T0_OPERATIONAL_CONTRACT_RELEASE_GATE=PASS" t0-operational-contract-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-operational-contract-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-operational-contract-tests.log
            t0-operational-contract-audit.log
            t0-operational-contract-report.json
            t0-operational-contract-report.md

  data-integrity:
    name: T0 read-only data integrity and candle continuity
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'feature/t0-data-integrity-candle-continuity-gate-20261102') ||
      (github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'data-integrity'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Record source SHA
        run: git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run read-only integrity and continuity contracts
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_data_integrity -v 2>&1 | tee t0-data-integrity-tests.log
          grep -q "Ran 12 tests" t0-data-integrity-tests.log
          echo "T0_DATA_INTEGRITY_CANDLE_CONTINUITY_TESTS=PASS (12 tests)" | tee t0-data-integrity-verdict.txt
      - name: Compile audit modules
        run: |
          python -m py_compile ci/t0_data_integrity.py ci/test_t0_data_integrity.py
          echo "T0_DATA_INTEGRITY_CANDLE_CONTINUITY_COMPILE=PASS" | tee t0-data-integrity-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-data-integrity-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-data-integrity-tests.log
            t0-data-integrity-verdict.txt
            t0-data-integrity-compile.log

  final-runtime-config:
    name: T0 final runtime configuration check (manual, read-only)
    if: github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'final-runtime-config')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements-ci.txt
            requirements-web.txt
      - run: python -m pip install -r requirements-market-data.txt -r requirements-ci.txt -r requirements-web.txt
      - name: Record source SHA and enforce no runtime credentials
        run: |
          set -euo pipefail
          test -z "$MARKET_DATA_DB" && test -z "$T0_FEEDER_LEASE_DB" && test -z "$PAPER_DB"
          test -z "$BINANCE_API_KEY" && test -z "$BINANCE_API_SECRET" && test -z "$OKX_API_KEY" && test -z "$OKX_API_SECRET"
          git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run read-only runtime configuration checks
        run: |
          python -m unittest ci.test_t0_final_runtime_config -v 2>&1 | tee t0-final-runtime-config-tests.log
          python -m py_compile ci/t0_final_runtime_config.py ci/test_t0_final_runtime_config.py
          python -m ci.t0_final_runtime_config | tee t0-final-runtime-config-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-final-runtime-config-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-final-runtime-config-tests.log
            t0-final-runtime-config-report.json

  component-tests-p3:
    name: T0 P3 isolated component contracts (manual)
    if: github.event_name == 'workflow_dispatch' && (inputs.gate == 'all' || inputs.gate == 'component-tests-p3')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Record SHA and enforce isolated environment
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "Unsafe environment variable present: $key"; exit 1; fi
          done
          git rev-parse HEAD | tee ci-source-sha.txt
      - name: Run P3 component contracts
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_scheduler market_data.test_feeder_retry market_data.test_feeder_recovery market_data.test_feeder_lease market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-component-tests-p3.log
          echo "T0_COMPONENT_TESTS_P3=PASS" | tee t0-component-tests-p3-verdict.txt
      - name: Compile tested modules
        run: |
          python -m py_compile market_data/feeder.py market_data/store.py market_data/test_feeder_scheduler.py market_data/test_feeder_retry.py market_data/test_feeder_recovery.py market_data/test_feeder_lease.py market_data/test_feeder_health.py market_data/test_feeder_health_api.py app.py
          echo "T0_COMPONENT_COMPILE_P3=PASS" | tee t0-component-compile-p3-verdict.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t0-component-tests-p3-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-component-tests-p3.log
            t0-component-tests-p3-verdict.txt
            t0-component-compile-p3-verdict.txt

