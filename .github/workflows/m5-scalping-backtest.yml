name: BTCUSDT M5 Scalping Backtest
run-name: M5 scalping backtest (90d)

on:
  # Experimental M5 backtest is out of current scope; manual runs only.
  workflow_dispatch:
    inputs:
      days:
        description: "Historical backtest window in days"
        required: true
        default: "90"
        type: choice
        options:
          - "90"
          - "180"
          - "360"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pandas numpy
      - name: Compile-check backtest
        run: python -m py_compile backtest_scalping_m5.py
      - name: Run historical backtest
        env:
          DAYS: ${{ inputs.days || '90' }}
        run: |
          python backtest_scalping_m5.py --days "$DAYS" --leverage 13 --fee-rate 0.0005 --slippage-bps 5 --start-balance 100
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-m5-scalping-backtest-${{ inputs.days || '90' }}d
          path: |
            backtest_m5_90d_result.json
            backtest_m5_90d_trades.csv
            backtest_m5_90d_equity.csv
          if-no-files-found: error
          retention-days: 30
