name: Dashboard Backtest
run-name: Dashboard backtest · ${{ github.event_name == 'pull_request' && '90' || inputs.backtest_days || '360' }} days

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backtest_days:
        description: "Backtest period in days (1-365)"
        required: false
        default: "360"
        type: string
      initial_capital:
        description: "Initial capital in USDT"
        required: false
        default: "100"
        type: string
      entry_margin_pct:
        description: "Initial order margin as % of current balance"
        required: false
        default: "50"
        type: string
      dca_margin_ratio:
        description: "DCA margin as % of initial order margin"
        required: false
        default: "100"
        type: string
      max_open_positions:
        description: "Maximum independent open positions (1-10)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-backtest
  cancel-in-progress: false

jobs:
  dashboard-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Check Python syntax
        run: python -m py_compile backtest.py bot.py app.py

      - name: Test independent position TP/SL decisions
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run single-position baseline for comparison
        if: github.event_name == 'pull_request'
        env:
          BACKTEST_DAYS: '90'
          BACKTEST_INITIAL_CAPITAL: '100'
          ENTRY_MARGIN_PCT: '25'
          DCA_MARGIN_RATIO: '100'
          MAX_OPEN_POSITIONS: '1'
          BACKTEST_RUN_ID: baseline-${{ github.run_id }}-${{ github.run_attempt }}
          BACKTEST_STATUS_FILE: baseline_status.json
          BACKTEST_RESULT_FILE: baseline_result.json
          BACKTEST_TRADES_FILE: baseline_trades.csv
          BACKTEST_EQUITY_FILE: baseline_equity.csv
          BACKTEST_CURVE_FILE: baseline_curve.csv
        run: python backtest.py

      - name: Run shared backtest engine for dashboard
        env:
          BACKTEST_DAYS: ${{ github.event_name == 'pull_request' && '90' || inputs.backtest_days || '360' }}
          BACKTEST_INITIAL_CAPITAL: ${{ github.event_name == 'pull_request' && '100' || inputs.initial_capital || '100' }}
          ENTRY_MARGIN_PCT: ${{ github.event_name == 'pull_request' && '25' || inputs.entry_margin_pct || '50' }}
          DCA_MARGIN_RATIO: ${{ inputs.dca_margin_ratio || '100' }}
          MAX_OPEN_POSITIONS: ${{ github.event_name == 'pull_request' && '3' || inputs.max_open_positions || '1' }}
          BACKTEST_RUN_ID: dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          BACKTEST_STATUS_FILE: dashboard_backtest_status.json
          BACKTEST_RESULT_FILE: dashboard_backtest_last_result.json
          BACKTEST_TRADES_FILE: dashboard_backtest_trades.csv
          BACKTEST_EQUITY_FILE: dashboard_backtest_equity.csv
          BACKTEST_CURVE_FILE: dashboard_backtest_equity_m15.csv
        run: python backtest.py

      - name: Print single-position vs multi-position comparison
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          for label, path in [('baseline_1_position', 'baseline_result.json'),
                              ('multi_position_3', 'dashboard_backtest_last_result.json')]:
              with open(path, encoding='utf-8') as f:
                  r = json.load(f)
              print(json.dumps({
                  'mode': label,
                  'status': r.get('status'),
                  'period_days': r.get('period_days'),
                  'max_open_positions': r.get('max_open_positions', 1),
                  'closed_positions': r.get('closed_position_count', r.get('trade_count')),
                  'entry_legs': r.get('entry_leg_count'),
                  'net_profit_usdt': r.get('net_profit_usdt'),
                  'win_rate_pct': r.get('win_rate_pct'),
                  'max_drawdown_usdt': r.get('max_drawdown_usdt'),
                  'fees_usdt': r.get('fees_usdt'),
              }, ensure_ascii=False))
          PY

      - name: Upload dashboard backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-backtest-report
          path: |
            dashboard_backtest_last_result.json
            dashboard_backtest_status.json
            dashboard_backtest_trades.csv
            dashboard_backtest_equity.csv
            dashboard_backtest_equity_m15.csv
            baseline_result.json
            baseline_status.json
            baseline_trades.csv
            baseline_equity.csv
            baseline_curve.csv
          if-no-files-found: warn
          retention-days: 30
