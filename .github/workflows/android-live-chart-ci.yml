name: Android Live Chart CI

on:
  push:
    branches:
      - feature/android-btcusdt-live-alerts
    paths:
      - "android-app/**"
      - ".github/workflows/android-live-chart-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-live-chart-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-live-chart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-and-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle project files
        working-directory: android-app
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          gradle --version

      - name: Run unit tests
        working-directory: android-app
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-live-alerts-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
