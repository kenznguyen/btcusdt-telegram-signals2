name: T1 to T2 Order Book V1 contract tests

on:
  push:
    branches:
      - feature/core-operational-proof-20261112
    paths:
      - "core_runtime/**"
      - ".github/workflows/t1-t2-orderbook-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t1-t2-orderbook-contract
  cancel-in-progress: false

jobs:
  orderbook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-web.txt
      - name: Enforce paper-only and no-provider boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${AI_EXECUTION_ENABLED}" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            test -z "${!key:-}"
          done
          git rev-parse HEAD | tee t1-t2-source-sha.txt
          echo "PAPER_ONLY=PASS" | tee t1-t2-safety.txt
      - name: Compile isolated T1 T2 reader and contract suites
        run: python -m py_compile core_runtime/orderbook_contract.py core_runtime/test_orderbook_contract.py core_runtime/orderbook_http.py core_runtime/test_orderbook_http.py core_runtime/test_orderbook_http_integration.py
      - name: Run GREEN T2 HTTP reader and T1 T2 contract suites
        run: |
          set -euo pipefail
          python -m unittest core_runtime.test_orderbook_http core_runtime.test_orderbook_contract core_runtime.test_orderbook_http_integration -v 2>&1 | tee t1-t2-orderbook-tests.log
          grep -q "Ran 48 tests" t1-t2-orderbook-tests.log
          echo "T1_T2_ORDERBOOK_V1=PASS" | tee t1-t2-orderbook-status.txt
          echo "T1_T2_ORDERBOOK_V1_TESTS=32_PASS" | tee -a t1-t2-orderbook-status.txt
          echo "T2_ORDERBOOK_HTTP_READER=PASS" | tee -a t1-t2-orderbook-status.txt
          echo "T2_ORDERBOOK_HTTP_READER_TESTS=15_PASS" | tee -a t1-t2-orderbook-status.txt
          echo "T1_T2_ORDERBOOK_HTTP_INTEGRATION=PASS" | tee -a t1-t2-orderbook-status.txt
          echo "T1_T2_ORDERBOOK_V1_SIDE_EFFECT_GATE=PASS" | tee -a t1-t2-orderbook-status.txt

      - name: Upload GREEN contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-t2-orderbook-green-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            t1-t2-source-sha.txt
            t1-t2-safety.txt
            t1-t2-orderbook-tests.log
            t1-t2-orderbook-status.txt
