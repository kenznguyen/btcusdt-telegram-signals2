name: T1 to T2 Order Book V1 contract tests

on:
  push:
    branches:
      - feature/core-operational-proof-20261112
    paths:
      - "core_runtime/**"
      - ".github/workflows/t1-t2-orderbook-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t1-t2-orderbook-contract
  cancel-in-progress: false

jobs:
  orderbook-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-web.txt
      - name: Enforce paper-only and no-provider boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${AI_EXECUTION_ENABLED}" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            test -z "${!key:-}"
          done
          git rev-parse HEAD | tee t1-t2-source-sha.txt
          echo "PAPER_ONLY=PASS" | tee t1-t2-safety.txt
      - name: Compile isolated contract suite
        run: python -m py_compile core_runtime/test_orderbook_contract.py
      - name: Verify RED baseline before implementation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest core_runtime.test_orderbook_contract -v 2>&1 | tee t1-t2-orderbook-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -eq 0 ]]; then
            echo "T1_T2_ORDERBOOK_V1=UNEXPECTED_GREEN_BEFORE_IMPLEMENTATION"
            exit 1
          fi
          if ! grep -q "No module named 'core_runtime.orderbook_contract'" t1-t2-orderbook-tests.log; then
            echo "T1_T2_ORDERBOOK_V1=UNEXPECTED_RED_FAILURE"
            exit 1
          fi
          echo "T1_T2_ORDERBOOK_V1=EXPECTED_RED_MODULE_MISSING" | tee t1-t2-orderbook-status.txt
      - name: Upload RED baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-t2-orderbook-red-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            t1-t2-source-sha.txt
            t1-t2-safety.txt
            t1-t2-orderbook-tests.log
            t1-t2-orderbook-status.txt
