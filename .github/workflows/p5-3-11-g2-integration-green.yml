name: P5.3.11 - G2 Integration GREEN
run-name: G2 integration GREEN (${{ github.ref_name }} @ ${{ github.sha }})

on:
  push:
    branches:
      - integration/p5-3-11-g2-gateway-green-20261103
    paths:
      - "market_data/**"
      - "ci/t0_operational_contract.py"
      - "ci/test_t0_operational_contract.py"
      - "ci/test_ci_policy.py"
      - "pipeline/**"
      - "freqai_bridge/**"
      - "market_data/README.md"
      - ".github/workflows/p5-3-11-g2-integration-green.yml"
  pull_request:
    branches:
      - feature/p5-3-11-5-g2-red-tests-20261103
    paths:
      - "market_data/**"
      - "ci/t0_operational_contract.py"
      - "ci/test_t0_operational_contract.py"
      - "ci/test_ci_policy.py"
      - "pipeline/**"
      - "freqai_bridge/**"
      - "market_data/README.md"
      - ".github/workflows/p5-3-11-g2-integration-green.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-3-11-g2-integration-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-acceptance:
    name: G2 and T0 isolated regression acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements-ci.txt
            requirements.txt

      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-market-data.txt -r requirements-ci.txt -r requirements.txt

      - name: Enforce shadow-only environment and record exact SHA
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unsafe environment variable present: $key"
              exit 1
            fi
          done
          git rev-parse HEAD | tee g2-green-source-sha.txt
          echo "ISOLATED_SHADOW_ONLY=PASS" | tee g2-green-isolation.txt

      - name: Compile T0, CI, pipeline and FreqAI modules
        run: |
          set -euo pipefail
          python -m py_compile market_data/*.py ci/*.py pipeline/*.py freqai_bridge/*.py
          echo "PY_COMPILE=PASS" | tee g2-green-compile-verdict.txt

      - name: Run G2 Gateway routing and G1 Gateway transaction contracts
        run: |
          set -euo pipefail
          python -m unittest market_data.test_g2_writer_routing market_data.test_gateway_runtime -v 2>&1 | tee g2-green-gateway-tests.log

      - name: Run T0 lease, fencing, lifecycle and storage regressions
        run: |
          set -euo pipefail
          python -m unittest \
            market_data.test_feeder_lease \
            market_data.test_feeder_atomic_fencing \
            market_data.test_feeder_lifecycle \
            market_data.test_feeder_scheduler \
            market_data.test_feeder_retry \
            market_data.test_feeder_recovery \
            market_data.test_feeder_health \
            market_data.test_feeder_health_api \
            market_data.test_store \
            market_data.test_sync \
            market_data.test_storage \
            market_data.test_api \
            -v 2>&1 | tee g2-green-t0-regression.log

      - name: Run T0 operational contract and CI policy tests
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_operational_contract ci.test_ci_policy -v 2>&1 | tee g2-green-ci-contracts.log

      - name: Run pipeline and FreqAI consumer regressions
        run: |
          set -euo pipefail
          python -m unittest \
            pipeline.test_api \
            pipeline.test_decision \
            pipeline.test_core_signal \
            pipeline.test_core_strategy \
            freqai_bridge.test_exporter \
            -v 2>&1 | tee g2-green-consumer-regressions.log

      - name: Publish exact-SHA acceptance verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SOURCE_SHA=$(git rev-parse HEAD)"
            echo "G2_GREEN_ACCEPTANCE=PASS_IF_ALL_REQUIRED_STEPS_SUCCEEDED"
            echo "EXCLUDED: canonical runtime, Feeder startup, exchange connectivity, SIGKILL, Android instrumentation, PC multiprocess, Timescale integration."
          } | tee g2-green-verdict.txt

      - name: Upload exact-SHA GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-3-11-g2-integration-green-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            g2-green-source-sha.txt
            g2-green-isolation.txt
            g2-green-compile-verdict.txt
            g2-green-gateway-tests.log
            g2-green-t0-regression.log
            g2-green-ci-contracts.log
            g2-green-consumer-regressions.log
            g2-green-verdict.txt
