name: BTC 5m Forecast Android CI

on:
  push:
    branches:
      - feature/android-btcusdt-5m-forecast
    paths:
      - 'btc-5m-forecast-android/**'
      - '.github/workflows/btc-5m-forecast-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-5m-forecast-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        working-directory: btc-5m-forecast-android
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build standalone debug APK
        working-directory: btc-5m-forecast-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-forecast-test-reports
          path: btc-5m-forecast-android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload standalone APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-forecast-debug-apk
          path: btc-5m-forecast-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
