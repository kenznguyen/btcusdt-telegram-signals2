name: P5.4.10 Backup Restore Fixture Tests

'on':
  push:
    branches:
      - feature/p5-4-1-post-merge-validation-20261103
    paths:
      - ".github/workflows/p5-4-10-backup-restore-fixture.yml"
      - "ci/backup_restore_test_support.py"
      - "ci/test_backup_restore.py"
      - "ci/run_backup_restore_tests.py"
      - "paper_execution/shadow_migration_fixture.py"
      - "codemagic.yaml"
      - "requirements-ci.txt"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected source commit SHA (must match the selected branch HEAD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: p5-4-10-backup-restore-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixture-only:
    name: Fixture-only Backup and Restore validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
      MARKET_DATA_POSTGRES_DSN: ""
      MARKET_DATA_TOKEN: ""
      MARKET_DATA_BACKEND: ""
      PAPER_MAX_DRAWDOWN_PCT: ""
      PAPER_MAX_DAILY_LOSS_USDT: ""
      PAPER_MAX_EXPOSURE_USDT: ""
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source identity and execution boundary
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          if [[ -n "$EXPECTED_SHA" ]]; then
            test "$actual" = "$EXPECTED_SHA"
          fi
          test "$GITHUB_REF_NAME" = "feature/p5-4-1-post-merge-validation-20261103"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET MARKET_DATA_POSTGRES_DSN MARKET_DATA_TOKEN MARKET_DATA_BACKEND PAPER_MAX_DRAWDOWN_PCT PAPER_MAX_DAILY_LOSS_USDT PAPER_MAX_EXPOSURE_USDT; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unsafe environment variable present: $key"
              exit 1
            fi
          done
          test "$AI_EXECUTION_ENABLED" = "false"
          printf '%s\n' "$actual" | tee backup-restore-source-sha.txt
          printf 'branch=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > backup-restore-run-context.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI-only test requirements
        run: python -m pip install -r requirements-ci.txt

      - name: Run fixture-only Backup and Restore tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/ci"
          python ci/run_backup_restore_tests.py 2>&1 | tee backup-restore-tests.log

      - name: Upload test logs and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-4-10-backup-restore-evidence-${{ github.run_id }}
          path: |
            backup-restore-source-sha.txt
            backup-restore-run-context.txt
            backup-restore-tests.log
            backup-restore-evidence/**
          if-no-files-found: warn
          retention-days: 30
