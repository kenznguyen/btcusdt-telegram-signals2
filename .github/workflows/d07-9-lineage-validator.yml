name: D07.9 Collector Lineage V1 Synthetic Validator

on:
  push:
    branches:
      - feature/core-operational-proof-20261112
    paths:
      - "d07_9_lineage/**"
      - ".github/workflows/d07-9-lineage-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d07-9-lineage-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_EXECUTION_ENABLED: "false"
      DATABASE_URL: ""
      DATABASE_PATH: ""
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce synthetic-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$AI_EXECUTION_ENABLED" = "false"
          for key in DATABASE_URL DATABASE_PATH MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "Unexpected external state: $key"; exit 1; fi
          done
          git rev-parse HEAD | tee d07-9-source-sha.txt
          echo "D07_9_SCOPE=SYNTHETIC_FIXTURES_ONLY" | tee d07-9-safety.txt
          echo "TARDIS_NETWORK=DISABLED" | tee -a d07-9-safety.txt
          echo "D07_2_D07_8_LEDGER_T0_VPS=UNCHANGED" | tee -a d07-9-safety.txt
          echo "LIVE_EXECUTION=FORBIDDEN" | tee -a d07-9-safety.txt
      - name: Validate JSON schema syntax
        run: python -m json.tool d07_9_lineage/schema.v1.json > /dev/null
      - name: Install isolated schema validator dependency
        run: python -m pip install --disable-pip-version-check -r d07_9_lineage/requirements.txt
      - name: Run D07.9/D07.11 synthetic contract suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s d07_9_lineage -p 'test_*.py' -v 2>&1 | tee d07-9-validator-tests.log
      - name: Upload D07.9/D07.11 synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d07-9-lineage-validator-${{ github.sha }}
          if-no-files-found: error
          path: |
            d07-9-source-sha.txt
            d07-9-safety.txt
            d07-9-validator-tests.log
