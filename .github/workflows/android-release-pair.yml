name: Android Paired Release APK (Manual)

'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full commit SHA to build (must equal the selected branch commit)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pair:
    name: Build and verify regular host + .paper client
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""

    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce branch, exact source SHA, secrets presence and paper-only boundary
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/p5-4-1-post-merge-validation-20261103"
          test "$INPUT_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$INPUT_SOURCE_SHA"
          test "$AI_EXECUTION_ENABLED" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            test -z "${!key:-}"
          done
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Required Android signing secret is missing: $key"
              exit 1
            fi
          done
          test "$ANDROID_KEY_ALIAS" = "btc-chart-release"
          printf '%s\n' "$INPUT_SOURCE_SHA" > android-source-sha.txt
          echo "Source SHA and signing-secret presence checks passed; secret values were not printed."

      - name: Restore signing keystore without exposing secret material
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          echo "Keystore restored to runner-temporary storage."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform and AGP 8.7.3 build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - name: Run Android unit tests
        working-directory: android-app
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build regular release host and signed parallel client
        working-directory: android-app
        run: gradle :app:assembleRelease :app:assembleParallel --no-daemon --stacktrace

      - name: Verify both APK identities, source SHA and release signer parity
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          python3 ci/verify-android-release-pair.py \
            --root "$GITHUB_WORKSPACE" \
            --sdk "$sdk_root" \
            --source-sha "$INPUT_SOURCE_SHA" \
            --output android-release-pair.json
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}

      - name: Upload paired signed APKs and verification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-pair-${{ inputs.source_sha }}
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/parallel/app-parallel.apk
            android-source-sha.txt
            android-release-pair.json
            android-app/app/build/test-results/testDebugUnitTest/**
            android-app/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
