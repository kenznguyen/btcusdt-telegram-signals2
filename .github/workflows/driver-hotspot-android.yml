name: Driver Hotspot Android APK
on:
  push:
    branches: [feature/driver-hotspot-android]
    paths:
      - 'DriverHotspot/**'
      - '.github/workflows/driver-hotspot-android.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DriverHotspot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build installable debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: driver-hotspot-debug-apk
          path: DriverHotspot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
