name: Strategy and Backtest Audit Tests

on:
  push:
    branches:
      - feature/strategy-backtest-audit
  pull_request:
    branches:
      - feature/strategy-backtest-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Run audit tests
        run: python -m unittest discover -s tests -v
