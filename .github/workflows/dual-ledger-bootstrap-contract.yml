name: Dual Ledger Bootstrap Contract

on:
  push:
    branches:
      - feature/core-operational-proof-20261112
    paths:
      - "paper_execution/bootstrap.py"
      - "paper_execution/funding.py"
      - "paper_execution/ledger.py"
      - "paper_execution/__main__.py"
      - "paper_execution/test_dual_ledger_bootstrap.py"
      - "paper_execution/test_dual_ledger_migration_red.py"
      - "paper_execution/test_dual_ledger_red.py"
      - "paper_execution/test_core_first_operational.py"
      - "paper_execution/test_daily_baseline_persistence.py"
      - "paper_execution/funding_reconciliation.py"
      - "paper_execution/test_funding_reconciliation.py"
      - "paper_execution/test_funding_reconciliation_persistence.py"
      - "paper_execution/funding_provenance.py"
      - "paper_execution/funding_model.py"
      - "paper_execution/test_funding_model.py"
      - "paper_execution/binance_public_funding.py"
      - "paper_execution/test_binance_public_funding.py"
      - "paper_execution/funding_position_projection.py"
      - "paper_execution/test_funding_position_projection.py"
      - "paper_execution/test_funding_position_projection_db.py"
      - "paper_execution/paper_funding_posting.py"
      - "paper_execution/test_paper_funding_end_to_end.py"
      - "paper_execution/test_funding_provenance.py"
      - "paper_execution/test_dual_ledger_bootstrap.py"
      - ".github/workflows/dual-ledger-bootstrap-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-ledger-bootstrap-contract
  cancel-in-progress: false

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_EXECUTION_ENABLED: "false"
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      PAPER_TRADING_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-web.txt

      - name: Enforce disposable paper-only environment
        shell: bash
        run: |
          set -euo pipefail
          test "${AI_EXECUTION_ENABLED}" = "false"
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB PAPER_TRADING_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then
              echo "Unexpected persistent database or credential environment: ${key}"
              exit 1
            fi
          done
          git rev-parse HEAD | tee bootstrap-source-sha.txt
          echo "BOOTSTRAP_SCOPE=DISPOSABLE_SQLITE_CI_ONLY" | tee bootstrap-safety.txt
          echo "BOOTSTRAP_EXTERNAL_SERVICES=NONE" | tee -a bootstrap-safety.txt
          echo "BOOTSTRAP_LIVE_ORDERS=FORBIDDEN" | tee -a bootstrap-safety.txt
          echo "D07_7_SCOPE=OFFLINE_NORMALIZED_FIXTURES_ONLY" | tee -a bootstrap-safety.txt
          echo "D07_8_SCOPE=OFFLINE_SYNTHETIC_MANIFEST_ONLY" | tee -a bootstrap-safety.txt

      - name: Compile bootstrap implementation and tests
        run: |
          set -euo pipefail
          python -m py_compile paper_execution/bootstrap.py paper_execution/__main__.py paper_execution/ledger.py paper_execution/funding.py paper_execution/test_dual_ledger_bootstrap.py paper_execution/funding_reconciliation.py paper_execution/test_funding_reconciliation.py paper_execution/test_funding_reconciliation_persistence.py paper_execution/funding_provenance.py paper_execution/test_funding_provenance.py paper_execution/funding_lineage.py paper_execution/test_funding_lineage.py paper_execution/funding_evidence_package.py paper_execution/test_funding_evidence_package.py paper_execution/funding_model.py paper_execution/test_funding_model.py paper_execution/binance_public_funding.py paper_execution/test_binance_public_funding.py paper_execution/funding_position_projection.py paper_execution/test_funding_position_projection.py paper_execution/test_funding_position_projection_db.py paper_execution/paper_funding_posting.py paper_execution/test_paper_funding_end_to_end.py paper_execution/test_dual_ledger_red.py paper_execution/test_core_first_operational.py paper_execution/test_daily_baseline_persistence.py paper_execution/test_dual_ledger_migration_red.py
          echo "BOOTSTRAP_COMPILE=PASS" | tee bootstrap-compile.txt

      - name: Run focused bootstrap tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_dual_ledger_bootstrap -v 2>&1 | tee bootstrap-tests.log

      - name: Run focused D07 funding reconciliation tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_funding_reconciliation -v 2>&1 | tee d07-funding-reconciliation-tests.log

      - name: Run focused D07.2 source evidence readback tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_funding_provenance -v 2>&1 | tee d07-provenance-tests.log

      - name: Run focused D07.7 offline funding lineage tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_funding_lineage -v 2>&1 | tee d07-funding-lineage-tests.log

      - name: Run focused D07.8 offline evidence package contract tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_funding_evidence_package -v 2>&1 | tee d07-funding-evidence-package-tests.log

      - name: Run focused D07 PAPER funding model tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_funding_model -v 2>&1 | tee d07-funding-model-tests.log

      - name: Run focused D07 Binance public funding parser tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_binance_public_funding -v 2>&1 | tee d07-binance-public-funding-tests.log

      - name: Run focused D07 PAPER position projection tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_funding_position_projection -v 2>&1 | tee d07-position-projection-tests.log

      - name: Run focused D07 read-only position database adapter tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_funding_position_projection_db -v 2>&1 | tee d07-position-db-tests.log

      - name: Run focused D07 offline PAPER funding end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_paper_funding_end_to_end -v 2>&1 | tee d07-funding-e2e-tests.log

      - name: Run focused D07 persistence and coverage gate tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest paper_execution.test_funding_reconciliation_persistence -v 2>&1 | tee d07-funding-persistence-tests.log

      - name: Run full PaperLedger regression
        if: success()
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s paper_execution -p 'test_*.py' -v 2>&1 | tee paper-execution-regression.log

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-ledger-bootstrap-proof-${{ github.sha }}
          if-no-files-found: error
          path: |
            bootstrap-source-sha.txt
            bootstrap-safety.txt
            bootstrap-compile.txt
            bootstrap-tests.log
            d07-funding-reconciliation-tests.log
            d07-funding-persistence-tests.log
            d07-provenance-tests.log
            d07-funding-lineage-tests.log
            d07-funding-evidence-package-tests.log
            d07-funding-model-tests.log
            d07-binance-public-funding-tests.log
            d07-position-projection-tests.log
            d07-position-db-tests.log
            d07-funding-e2e-tests.log
            paper-execution-regression.log
