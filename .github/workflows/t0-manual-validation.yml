name: T0 Manual Validation
run-name: T0 manual gate - ${{ inputs.gate }} (${{ github.sha }})

'on':
  workflow_dispatch:
    inputs:
      gate:
        description: "Select one manual T0 gate"
        required: true
        default: final-runtime-config
        type: choice
        options:
          - final-runtime-config
          - component-tests-p3
          - kraken-adapter
          - kraken-spot-sqlite
          - kraken-spot-read-api
          - timescaledb-integration
          - sqlite-lease-fencing
  push:
    branches:
      - feature/t0-centralized-data-feeder-p1-20261101
    paths:
      - .github/workflows/t0-manual-validation.yml
      - ci/t0_runtime_acceptance.py
      - ci/test_t0_runtime_acceptance.py
      - market_data/feeder.py
      - market_data/store.py
      - market_data/write_gateway.py
      - market_data/test_feeder_lease.py
      - market_data/test_write_gateway.py
      - market_data/test_feeder_lifecycle.py
      - market_data/feeder_service.py
      - market_data/test_feeder_recovery.py
      - market_data/test_feeder_scheduler.py
      - market_data/sync.py
      - market_data/api.py
      - market_data/storage.py
      - market_data/test_sync.py
      - market_data/test_api.py
      - market_data/test_e2e_data_flow.py
      - freqai_bridge/context.py
      - freqai_bridge/http_candles.py
      - freqai_bridge/test_http_candles.py
freqai_bridge/test_multi_timeframe.py
freqai_bridge/test_context_multi_timeframe.py
freqai_bridge/test_context_http.py

permissions:
  contents: read

concurrency:
  group: t0-manual-${{ github.ref }}-${{ inputs.gate }}
  cancel-in-progress: false

jobs:
  sqlite-lease-fencing-auto:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    name: Automatic isolated SQLite lease and fencing tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated market-data dependencies
        run: python -m pip install -r requirements-market-data.txt
      - name: Enforce isolated environment and record source SHA
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "Unsafe environment variable present: $key"; exit 1; fi
          done
          git rev-parse HEAD | tee ci-source-sha.txt
          echo "T0_SQLITE_LEASE_FENCING_AUTO=ISOLATED" | tee sqlite-lease-fencing-scope.txt
      - name: Run SQLite lease and fencing tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_lease market_data.test_write_gateway market_data.test_feeder_lifecycle -v 2>&1 | tee sqlite-lease-fencing-tests.log
          echo "SQLITE_LEASE_FENCING=PASS" | tee sqlite-lease-fencing-verdict.txt
      - name: Upload automatic lease-fencing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-sqlite-lease-fencing-auto-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            sqlite-lease-fencing-scope.txt
            sqlite-lease-fencing-workflow-contract-tests.log
            sqlite-lease-fencing-tests.log
            sqlite-lease-fencing-verdict.txt

  recovery-change-scope:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    name: Detect recovery-specific source changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout exact source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect recovery-specific changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE"
            HEAD_SHA="$PR_HEAD"
          else
            BASE_SHA="$PUSH_BEFORE"
            HEAD_SHA="$GITHUB_SHA"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Initial push/no base commit: run recovery gate conservatively"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > recovery-changed-files.txt
          cat recovery-changed-files.txt
          changed=false
          for path in .github/workflows/t0-manual-validation.yml ci/t0_runtime_acceptance.py ci/test_t0_runtime_acceptance.py market_data/feeder.py market_data/feeder_service.py market_data/test_feeder_recovery.py market_data/test_feeder_scheduler.py market_data/test_feeder_lifecycle.py market_data/sync.py market_data/api.py market_data/storage.py market_data/test_sync.py market_data/test_api.py market_data/test_e2e_data_flow.py freqai_bridge/context.py freqai_bridge/http_candles.py freqai_bridge/test_http_candles.py
freqai_bridge/test_multi_timeframe.py
freqai_bridge/test_context_multi_timeframe.py
freqai_bridge/test_context_http.py; do
            if grep -Fxq "$path" recovery-changed-files.txt; then changed=true; fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  sqlite-recovery-auto:
    needs:
      - sqlite-lease-fencing-auto
      - recovery-change-scope
    if: ${{ needs.sqlite-lease-fencing-auto.result == 'success' && needs.recovery-change-scope.result == 'success' && needs.recovery-change-scope.outputs.changed == 'true' }}
    name: Automatic isolated SQLite recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated market-data dependencies
        run: python -m pip install -r requirements-market-data.txt
      - name: Enforce isolated environment and record source SHA
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "Unsafe environment variable present: $key"; exit 1; fi
          done
          git rev-parse HEAD | tee recovery-source-sha.txt
          echo "T0_SQLITE_RECOVERY=ISOLATED" | tee sqlite-recovery-scope.txt
          if [[ "$EVENT_NAME" == "pull_request" ]]; then BASE_SHA="$PR_BASE"; HEAD_SHA="$PR_HEAD"; else BASE_SHA="$PUSH_BEFORE"; HEAD_SHA="$GITHUB_SHA"; fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then git diff --name-only "$BASE_SHA" "$HEAD_SHA" > recovery-changed-files.txt; else echo "INITIAL_PUSH_NO_BASE" > recovery-changed-files.txt; fi
      - name: Run isolated recovery, scheduler and startup lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_recovery market_data.test_feeder_scheduler market_data.test_feeder_lifecycle -v 2>&1 | tee sqlite-recovery-tests.log
          echo "SQLITE_RECOVERY=PASS" | tee sqlite-recovery-verdict.txt
      - name: Upload automatic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-sqlite-recovery-auto-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            recovery-source-sha.txt
            sqlite-recovery-scope.txt
            recovery-changed-files.txt
            sqlite-recovery-tests.log
            sqlite-recovery-verdict.txt
  data-flow-change-scope:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    name: Detect end-to-end data-flow changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout exact source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect data-flow source changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then BASE_SHA="$PR_BASE"; HEAD_SHA="$PR_HEAD"; else BASE_SHA="$PUSH_BEFORE"; HEAD_SHA="$GITHUB_SHA"; fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > data-flow-changed-files.txt
          cat data-flow-changed-files.txt
          changed=false
          for path in .github/workflows/t0-manual-validation.yml ci/t0_runtime_acceptance.py ci/test_t0_runtime_acceptance.py market_data/sync.py market_data/store.py market_data/write_gateway.py market_data/feeder.py market_data/api.py market_data/storage.py market_data/test_sync.py market_data/test_api.py market_data/test_e2e_data_flow.py freqai_bridge/context.py freqai_bridge/http_candles.py freqai_bridge/test_http_candles.py
freqai_bridge/test_multi_timeframe.py
freqai_bridge/test_context_multi_timeframe.py
freqai_bridge/test_context_http.py; do
            if grep -Fxq "$path" data-flow-changed-files.txt; then changed=true; fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  sqlite-data-flow-auto:
    needs:
      - sqlite-lease-fencing-auto
      - sqlite-recovery-auto
      - data-flow-change-scope
    if: ${{ needs.sqlite-lease-fencing-auto.result == 'success' && needs.sqlite-recovery-auto.result == 'success' && needs.data-flow-change-scope.result == 'success' && needs.data-flow-change-scope.outputs.changed == 'true' }}
    name: Automatic isolated T0 to T2 data-flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      MARKET_DATA_TOKEN: ""
      T0_CANDLE_API_BASE_URL: ""
      T0_CANDLE_API_TOKEN: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated market-data and HTTP client dependencies
        run: python -m pip install -r requirements-market-data.txt
      - name: Enforce isolated environment and record source/change evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB MARKET_DATA_TOKEN T0_CANDLE_API_BASE_URL T0_CANDLE_API_TOKEN BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "Unsafe environment variable present: $key"; exit 1; fi
          done
          git rev-parse HEAD | tee data-flow-source-sha.txt
          echo "T0_TO_T2_DATA_FLOW=ISOLATED_LOOPBACK" | tee data-flow-scope.txt
          if [[ "$EVENT_NAME" == "pull_request" ]]; then BASE_SHA="$PR_BASE"; HEAD_SHA="$PR_HEAD"; else BASE_SHA="$PUSH_BEFORE"; HEAD_SHA="$GITHUB_SHA"; fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then git diff --name-only "$BASE_SHA" "$HEAD_SHA" > data-flow-changed-files.txt; else echo "INITIAL_PUSH_NO_BASE" > data-flow-changed-files.txt; fi
      - name: Run isolated T0 sync, API and T2 HTTP consumer integration suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest market_data.test_e2e_data_flow market_data.test_sync market_data.test_api freqai_bridge.test_http_candles freqai_bridge.test_context_http freqai_bridge.test_multi_timeframe freqai_bridge.test_context_multi_timeframe -v 2>&1 | tee sqlite-data-flow-tests.log
          echo "SQLITE_T0_TO_T2_DATA_FLOW=PASS" | tee sqlite-data-flow-verdict.txt
      - name: Upload automatic data-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-sqlite-data-flow-auto-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data-flow-source-sha.txt
            data-flow-scope.txt
            data-flow-changed-files.txt
            sqlite-data-flow-tests.log
            sqlite-data-flow-verdict.txt

  g4-runtime-contract-change-scope:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    name: Detect G4 read-only runtime contract changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout exact source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect G4 contract changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then BASE_SHA="$PR_BASE"; HEAD_SHA="$PR_HEAD"; else BASE_SHA="$PUSH_BEFORE"; HEAD_SHA="$GITHUB_SHA"; fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > g4-changed-files.txt
          cat g4-changed-files.txt
          changed=false
          for path in .github/workflows/t0-manual-validation.yml ci/t0_runtime_acceptance.py ci/test_t0_runtime_acceptance.py; do
            if grep -Fxq "$path" g4-changed-files.txt; then changed=true; fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  sqlite-g4-runtime-contract-auto:
    needs:
      - sqlite-lease-fencing-auto
      - sqlite-recovery-auto
      - sqlite-data-flow-auto
      - g4-runtime-contract-change-scope
    if: ${{ needs.sqlite-lease-fencing-auto.result == 'success' && needs.sqlite-recovery-auto.result == 'success' && needs.sqlite-data-flow-auto.result == 'success' && needs.g4-runtime-contract-change-scope.result == 'success' && needs.g4-runtime-contract-change-scope.outputs.changed == 'true' }}
    name: G4 read-only runtime probe contract tests (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      MARKET_DATA_TOKEN: ""
      T0_CANDLE_API_TOKEN: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated probe dependencies
        run: python -m pip install -r requirements-market-data.txt -r requirements-web.txt
      - name: Verify isolated environment and record source SHA
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB MARKET_DATA_TOKEN T0_CANDLE_API_TOKEN BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "Unsafe environment variable present: $key"; exit 1; fi
          done
          git rev-parse HEAD | tee g4-source-sha.txt
          echo "G4_SQLITE_PROBE=DISPOSABLE_FIXTURE_ONLY" | tee g4-scope.txt
      - name: Run read-only SQLite G4 contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest ci.test_t0_runtime_acceptance -v 2>&1 | tee g4-runtime-contract-tests.log
          echo "G4_READ_ONLY_SQLITE_CONTRACT=PASS" | tee g4-verdict.txt
      - name: Upload G4 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-g4-runtime-contract-auto-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            g4-source-sha.txt
            g4-scope.txt
            g4-runtime-contract-tests.log
            g4-verdict.txt

  manual-gate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: T0 manual isolated acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_DATA_DB: ""
      T0_FEEDER_LEASE_DB: ""
      PAPER_DB: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      OKX_API_KEY: ""
      OKX_API_SECRET: ""
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-market-data.txt
            requirements.txt
            requirements-web.txt
            requirements-ci.txt
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-market-data.txt -r requirements.txt -r requirements-web.txt -r requirements-ci.txt
      - name: Enforce isolated environment and record source SHA
        shell: bash
        run: |
          set -euo pipefail
          for key in MARKET_DATA_DB T0_FEEDER_LEASE_DB PAPER_DB BINANCE_API_KEY BINANCE_API_SECRET OKX_API_KEY OKX_API_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "Unsafe environment variable present: $key"; exit 1; fi
          done
          git rev-parse HEAD | tee ci-source-sha.txt
          echo "T0_MANUAL_ISOLATED=PASS" | tee t0-manual-isolation-verdict.txt
      - name: Run final runtime configuration check
        if: ${{ inputs.gate == 'final-runtime-config' }}
        run: |
          python -m unittest ci.test_t0_final_runtime_config -v 2>&1 | tee t0-final-runtime-config-tests.log
          python -m py_compile ci/t0_final_runtime_config.py ci/test_t0_final_runtime_config.py
          python -m ci.t0_final_runtime_config | tee t0-final-runtime-config-report.json
          printf '%s\n' 'PC_CANONICAL_PATH=NOT_VERIFIED' 'CANONICAL_DB_INTEGRITY=NOT_RUN' 'FEEDER_RUNTIME=NOT_RUN' | tee t0-final-runtime-config-scope.txt
      - name: Run isolated SQLite lease and fencing tests
        if: ${{ inputs.gate == 'sqlite-lease-fencing' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest market_data.test_feeder_lease market_data.test_write_gateway market_data.test_feeder_lifecycle -v 2>&1 | tee sqlite-lease-fencing-tests.log
          echo "SQLITE_LEASE_FENCING=PASS" | tee sqlite-lease-fencing-verdict.txt
      - name: Run P3 isolated component contracts
        if: ${{ inputs.gate == 'component-tests-p3' }}
        run: |
          python -m unittest market_data.test_feeder_scheduler market_data.test_feeder_retry market_data.test_feeder_recovery market_data.test_feeder_lease market_data.test_feeder_health market_data.test_feeder_health_api -v 2>&1 | tee t0-component-tests-p3.log
          python -m py_compile market_data/feeder.py market_data/store.py app.py
      - name: Run Kraken Spot adapter tests
        if: ${{ inputs.gate == 'kraken-adapter' }}
        run: |
          python -m unittest market_data.test_kraken_spot -v 2>&1 | tee kraken-adapter-tests.log
          python -m compileall -q market_data/kraken_spot.py
      - name: Run Kraken Spot SQLite persistence tests
        if: ${{ inputs.gate == 'kraken-spot-sqlite' }}
        run: |
          python -m unittest market_data.test_kraken_spot market_data.test_kraken_spot_store -v 2>&1 | tee kraken-spot-sqlite-tests.log
          python -m compileall -q market_data/kraken_spot.py market_data/kraken_spot_store.py
      - name: Run Kraken Spot read API tests
        if: ${{ inputs.gate == 'kraken-spot-read-api' }}
        run: |
          python -m unittest market_data.test_kraken_spot market_data.test_kraken_spot_store market_data.test_kraken_spot_api -v 2>&1 | tee kraken-spot-read-api-tests.log
          python -m compileall -q market_data/kraken_spot.py market_data/kraken_spot_store.py market_data/kraken_spot_api.py
      - name: Run disposable TimescaleDB integration tests
        if: ${{ inputs.gate == 'timescaledb-integration' }}
        env:
          CI_PYTHON: python
          MARKET_DATA_TEST_DATABASE_URL: ${{ secrets.MARKET_DATA_TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$MARKET_DATA_TEST_DATABASE_URL" ]]; then
            echo "TIMESCALEDB_INTEGRATION=NOT_RUN_MISSING_MARKET_DATA_TEST_DATABASE_URL" | tee timescaledb-verdict.txt
            exit 1
          fi
          bash ci/test-timescaledb.sh
          echo "TIMESCALEDB_INTEGRATION=PASS" | tee timescaledb-verdict.txt
      - name: Upload manual T0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-manual-${{ inputs.gate }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-source-sha.txt
            t0-manual-isolation-verdict.txt
            t0-final-runtime-config-tests.log
            t0-final-runtime-config-report.json
            t0-final-runtime-config-scope.txt
            t0-component-tests-p3.log
            sqlite-lease-fencing-tests.log
            sqlite-lease-fencing-verdict.txt
