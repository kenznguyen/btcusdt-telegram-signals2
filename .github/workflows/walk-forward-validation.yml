name: BTCUSDT Walk-Forward Validation
run-name: BTCUSDT OOS + sensitivity validation

on:
  push:
    branches:
      - feature/strategy-backtest-audit
    paths:
      - "backtest.py"
      - "bot.py"
      - "tools/walk_forward_validation.py"
      - ".github/workflows/walk-forward-validation.yml"
  workflow_dispatch:
    inputs:
      is_days:
        description: "In-sample days (minimum 90)"
        required: true
        default: "270"
        type: string
      oos_days:
        description: "Out-of-sample days (minimum 30)"
        required: true
        default: "90"
        type: string

permissions:
  contents: read

concurrency:
  group: btcusdt-walk-forward-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run walk-forward and sensitivity analysis
        env:
          IS_DAYS: \${{ inputs.is_days || '270' }}
          OOS_DAYS: \${{ inputs.oos_days || '90' }}
          BACKTEST_INITIAL_CAPITAL: "100"
          ENTRY_MARGIN_PCT: "0.50"
          DCA_MARGIN_RATIO: "1.00"
          VALIDATION_OUTPUT_DIR: strategy_validation_report
        run: python tools/walk_forward_validation.py
      - name: Upload validation report and per-run CSV files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-walk-forward-validation
          path: strategy_validation_report/
          if-no-files-found: warn
          retention-days: 90
