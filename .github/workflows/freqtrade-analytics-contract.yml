name: Freqtrade Analytics Contract Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'freqtrade-backtest/**'
      - '.github/workflows/freqtrade-analytics-contract.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate report contract
        run: python -m unittest discover -s freqtrade-backtest/tests -v
