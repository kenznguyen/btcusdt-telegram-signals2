name: Android APK

on:
  # Manual Android build and release verification.
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record actual source commit
        run: |
          git rev-parse HEAD > android-source-sha.txt
          printf 'Built source commit: %s\n' "$(cat android-source-sha.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test debug APK
        working-directory: android-app
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            test -s "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify release signing identity
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test "$ANDROID_KEY_ALIAS" = 'btc-chart-release'
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-live-alerts-debug-apk
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-source-sha.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-live-alerts-release-apk
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-source-sha.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-unit-test-reports
          path: android-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"


